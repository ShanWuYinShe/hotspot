<!doctype html>
<!-- data-theme-family 为首屏默认主题族，须与 theme.svelte.ts 的 DEFAULT_THEME_FAMILY 一致；
     首屏绘制前由 <head> 内联脚本依据 localStorage 覆盖 -->
<html lang="zh-CN" data-theme-family="indigo">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function (config) {
        try {
          var stored = window.localStorage.getItem(config.storageKey);
          var family =
            stored && config.families.indexOf(stored) !== -1
              ? stored
              : (stored && config.migration[stored]) || config.defaultFamily;
          document.documentElement.setAttribute(config.attribute, family);
        } catch (error) {
          document.documentElement.setAttribute(config.attribute, config.defaultFamily);
        }
      })({
        storageKey: 'hotspot_theme_family',
        attribute: 'data-theme-family',
        families: ['indigo', 'forest', 'sand'],
        migration: {
          social_blue: 'indigo',
          default_clean: 'forest',
          figma_neu: 'sand',
          vibrant: 'indigo',
          neu: 'sand'
        },
        defaultFamily: 'indigo'
      });
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
