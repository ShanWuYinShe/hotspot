<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover：全站 8 处 env(safe-area-inset-*) 依赖它，缺省时 iOS 安全区恒为 0 -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#F7FAFF" />
		<title>HotSpot</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- PWA：manifest + iOS 主屏图标（R36-1）。图标由 src/assets/hotspot-logo.png 派生 -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<!-- Inter 自托管（static/fonts/），与样式表并行预加载，消除文字换字体的跳动。
		     字体请求一律走 CORS 模式，同源也必须写 crossorigin，否则会重复下载一次。
		     中文字形不预加载——由系统字体栈承担，零网络成本。 -->
		<link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// 首帧主题防闪烁：CSS 注入前先按持久化偏好设置 <html> 的 vibrant/forest/inkwash + dark 类，
			// 与 stores/theme.svelte.ts 的 colorScheme/appTheme 键保持一致。
			// 三态：colorScheme=light/dark 直接取值；auto（或缺失）时读老 isDark
			// 显式值做首帧兼容，否则跟随系统 matchMedia。
			(function () {
				try {
					var mode = localStorage.getItem('colorScheme');
					var dark;
					if (mode === 'dark') dark = true;
					else if (mode === 'light') dark = false;
					else if (localStorage.getItem('isDark') === 'true') dark = true;
					else if (localStorage.getItem('isDark') === 'false') dark = false;
					else if (window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					else dark = false;
					var t = localStorage.getItem('appTheme');
					if (t !== 'forest' && t !== 'vibrant' && t !== 'inkwash') t = 'vibrant';
					var root = document.documentElement;
					root.classList.add(t);
					if (dark) root.classList.add('dark');
					// 浏览器 chrome 配色（移动端地址栏）：与 themes/*.css 的
					// --cst-surface-page 保持一致；CSS 加载后由 theme store 动态接管
					var themeColor = dark
						? { vibrant: '#0B1424', forest: '#161A16', inkwash: '#181A1C' }
						: { vibrant: '#F7FAFF', forest: '#F6F7F3', inkwash: '#F5F2EA' };
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', themeColor[t]);
				} catch (e) {
					// localStorage 不可用（隐私模式等）时保持默认 vibrant light
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
