<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover：全站 8 处 env(safe-area-inset-*) 依赖它，缺省时 iOS 安全区恒为 0 -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#F7FAFF" />
		<title>HotSpot</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- PWA：manifest + iOS 主屏图标（R36-1）。图标由 src/assets/hotspot-logo.png 派生 -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<!-- Inter 自托管（static/fonts/），与样式表并行预加载，消除文字换字体的跳动。
		     字体请求一律走 CORS 模式，同源也必须写 crossorigin，否则会重复下载一次。
		     中文字形不预加载——由系统字体栈承担，零网络成本。 -->
		<link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// 首帧主题防闪烁：CSS 注入前先按持久化偏好设置 <html> 的 vibrant/forest/inkwash + dark 类，
			// 与 stores/theme.svelte.ts 的 colorScheme/appTheme 键保持一致。
			// 三态：colorScheme=light/dark 直接取值；auto（或缺失）时读老 isDark
			// 显式值做首帧兼容，否则跟随系统 matchMedia。
			(function () {
				try {
					var mode = localStorage.getItem('colorScheme');
					var dark;
					if (mode === 'dark') dark = true;
					else if (mode === 'light') dark = false;
					else if (localStorage.getItem('isDark') === 'true') dark = true;
					else if (localStorage.getItem('isDark') === 'false') dark = false;
					else if (window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					else dark = false;
					var t = localStorage.getItem('appTheme');
					if (t !== 'forest' && t !== 'vibrant' && t !== 'inkwash') t = 'vibrant';
					var root = document.documentElement;
					root.classList.add(t);
					if (dark) root.classList.add('dark');
					// 浏览器 chrome 配色（移动端地址栏）：与 themes/*.css 的
					// --cst-surface-page 保持一致；CSS 加载后由 theme store 动态接管
					var themeColor = dark
						? { vibrant: '#0B1424', forest: '#161A16', inkwash: '#181A1C' }
						: { vibrant: '#F7FAFF', forest: '#F6F7F3', inkwash: '#F5F2EA' };
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', themeColor[t]);
				} catch (e) {
					// localStorage 不可用（隐私模式等）时保持默认 vibrant light
				}
			})();
		</script>
		<script>
			// 大屏 UI 等比放大：首帧就同步 --cst-ui-scale（与 shared.css 根字号 clamp(1rem, 100vw/120, 2rem)
			// 同一公式：1920→1×、2560→1.33×、3840→2×），供内联数值尺寸（lucide size={n} 等）缩放，
			// 避免首屏「文字已放大、图标尚未放大」的跳变。resize 由 platform store 接管。
			(function () {
				try {
					var w = window.innerWidth || 1920;
					var scale = Math.min(2, Math.max(1, w / 1920));
					document.documentElement.style.setProperty('--cst-ui-scale', scale.toFixed(4));
				} catch (e) {
					// 隐私模式等不可用场景忽略
				}
			})();
		</script>
		<script>
			// 一次性迁移清理（2026-10-29）：旧版 dev 用 MSW service worker 伪造 API，已随
			// 「真实种子数据」重构移除。已注册的 mockServiceWorker 不会因文件删除自动注销，
			// 可能继续控制页面并干扰真实请求/图片加载。这里注销本项目遗留的 MSW worker
			//（只匹配 mockServiceWorker.js，不影响其他 service worker）。
			(function () {
				try {
					if (!('serviceWorker' in navigator)) return;
					navigator.serviceWorker.getRegistrations().then(function (regs) {
						regs.forEach(function (reg) {
							var w = reg.active || reg.installing || reg.waiting;
							var url = (w && w.scriptURL) || '';
							if (url.indexOf('mockServiceWorker.js') >= 0) reg.unregister();
						});
					}).catch(function () {});
				} catch (e) {
					// 隐私模式等不可用场景忽略
				}
			})();
		</script>
<style>
			/* 首屏启动壳：仅负责「JS chunk 未下载完成」期间的可视反馈，挂载后由内联脚本移除。
			   这里是 CSS 加载前的最早期样式，按主题类名直写页面底色/品牌色；不参与组件样式体系。 */
			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				background: #f7faff;
				color: #16233a;
				font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
				transition: opacity 0.2s ease;
			}
			html.dark #boot-splash { background: #0b1424; color: #f1f5f9; }
			html.forest #boot-splash { background: #f6f7f3; color: #152219; }
			html.forest.dark #boot-splash { background: #161a16; color: #e8f1e9; }
			html.inkwash #boot-splash { background: #f5f2ea; color: #2b2a26; }
			html.inkwash.dark #boot-splash { background: #181a1c; color: #eae6da; }
			#boot-splash.boot-splash--done { opacity: 0; pointer-events: none; }
			#boot-splash .boot-splash__logo {
				width: 56px;
				height: 56px;
				border-radius: 16px;
				box-shadow: 0 10px 30px rgba(22, 35, 58, 0.16);
			}
			#boot-splash .boot-splash__name {
				font-size: 18px;
				font-weight: 700;
				letter-spacing: 0.12em;
			}
			#boot-splash .boot-splash__hint {
				display: none;
				font-size: 12px;
				opacity: 0.72;
			}
			#boot-splash.boot-splash--slow .boot-splash__hint { display: block; }
			#boot-splash .boot-splash__bar {
				position: relative;
				width: 124px;
				height: 3px;
				border-radius: 2px;
				overflow: hidden;
				background: currentColor;
				opacity: 0.14;
			}
			#boot-splash .boot-splash__bar::after {
				content: '';
				position: absolute;
				inset-block: 0;
				left: -40%;
				width: 40%;
				border-radius: 2px;
				background: #2b5eb2;
				animation: boot-splash-slide 1.1s ease-in-out infinite;
			}
			html.forest #boot-splash .boot-splash__bar::after { background: #39714f; }
			html.forest.dark #boot-splash .boot-splash__bar::after { background: #52b878; }
			html.inkwash #boot-splash .boot-splash__bar::after { background: #a63a2e; }
			html.inkwash.dark #boot-splash .boot-splash__bar::after { background: #df7f6a; }
			html.dark #boot-splash .boot-splash__bar::after { background: #5b9cf6; }
			@keyframes boot-splash-slide {
				0% { left: -40%; }
				100% { left: 100%; }
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-splash .boot-splash__bar::after { animation: none; left: 0; width: 100%; }
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-splash" role="status" aria-label="HotSpot 正在加载">
			<img class="boot-splash__logo" src="/icons/icon-192.png" alt="" width="56" height="56" />
			<div class="boot-splash__name">HOTSPOT</div>
			<div class="boot-splash__bar" aria-hidden="true"></div>
			<div class="boot-splash__hint" aria-live="polite">网络较慢，正在加载…</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// 启动壳移除：应用根布局渲染出 h1 后淡出并移除；12s 兜底避免永久遮挡。
			(function () {
				var splash = document.getElementById('boot-splash');
				if (!splash) return;
				var done = false;
				function hide() {
					if (done) return;
					done = true;
					splash.classList.add('boot-splash--done');
					setTimeout(function () { if (splash.parentNode) splash.remove(); }, 220);
				}
				function ready() {
					// 只认路由渲染出的 h1：根布局的 skip link / 占位文本不算就绪，避免提前撤掉启动壳露出空白。
					return !!document.querySelector('h1');
				}
				if (ready()) { hide(); return; }
				var observer = new MutationObserver(function () { if (ready()) { observer.disconnect(); hide(); } });
				observer.observe(document.body, { childList: true, subtree: true });
				// 慢网提示：只提示、不撤壳；壳必须等到真实页面内容，避免「壳没了、页面还空」的更差体验。
				setTimeout(function () { if (!done) splash.classList.add('boot-splash--slow'); }, 12000);
			})();
		</script>
	</body>
</html>
