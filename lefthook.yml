# lefthook pre-commit 钩子：提交前强制校验。
# 安装：`bunx lefthook install`（生成 .git/hooks 入口）；配置改动后无需重装。
# 注意：工作树级校验以 frontend 的 `bun run check` 为准，此处只拦截高频
# 回归（ESLint 契约规则），保证提交前必然通过。

pre-commit:
  parallel: true
  commands:
    frontend-lint:
      root: frontend/
      glob: "*.{svelte,ts,js,mjs}"
      run: bunx eslint {staged_files}
