# ── HotSpot Integration Test ───────────────────────────────────────
# 使用方式:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm integration-test
#
# 说明:
#   依赖基础 docker-compose.yml 中的 postgres / seaweedfs 服务。
#   先确保基础服务已启动: docker compose up -d postgres seaweedfs
#   再运行集成测试: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm integration-test

services:
  integration-test:
    image: golang:1.26.2-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: test
      # BACKEND_URL 仅供 Go 集成测试（backend-go/test/integration/docker_test.go）使用，
      # 与前端 React 应用的 vite env 无关。前端接入已统一走 nginx 网关 (8888)，
      # 不再需要 BACKEND_URL/DOCKER_ENV/VITE_WS_URL 等 env 注入。
      BACKEND_URL: http://backend:8081
      POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD:-change-me}@postgres:5432/hotspot?sslmode=disable
    volumes:
      - ./backend-go:/test
      - go-module-cache:/go
    working_dir: /test
    command: ["go", "test", "-v", "-count=1", "-timeout=180s", "./..."]

volumes:
  go-module-cache:
