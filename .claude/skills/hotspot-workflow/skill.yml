name: hotspot-workflow
version: 3.0.0
description: |
  HotSpot 项目自治开发工作流。强调线性历史、单功能单 Commit、worktree 隔离和分层测试。
commands:
  - name: feature
    description: 从零到一实现功能，整理为单个 commit，线性同步回主分支
    file: ./commands/feature.md
    argument_hint: <功能描述>
  - name: cleanup
    description: 清理已合并或无用的 git worktree 和分支
    file: ./commands/cleanup.md
    argument_hint: [可选过滤条件]
