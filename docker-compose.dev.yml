# ── HotSpot Dev Override ──────────────────────────────────────────
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 设计原则：
#   - dev 镜像**只构建一次**（hotspot-backend-dev:latest），通过 bind-mount 实时同步源代码
#   - 修改 Go 代码 → air 自动重编译并重启服务
#   - 修改前端代码 → Vite HMR 即时刷新
#   - 用 named volume 隔离 node_modules，避免 host/container 跨平台 native modules 污染
#   - 发包时用 base docker-compose.yml（生产镜像 hotspot-backend:latest）

services:
  # 暴露基础设施端口到宿主机方便工具直连
  postgres:
    ports:
      - "5432:5432"

  seaweedfs:
    ports:
      - "8333:8333"

  redis:
    ports:
      - "6379:6379"

  # ── 后端（dev 模式）──────────────────────────────────────────────
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile.dev
      args:
        GO_VERSION: ${GO_VERSION:-1.26.2}
        AIR_VERSION: ${AIR_VERSION:-1.67.3}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: hotspot-backend-dev:latest   # dev 镜像（含 Go SDK + air，热加载）
    user: root
    ports:
      - "8081:8081"
    # 源码实时同步，air 监听 .go 变化自动重新编译重启，无需 rebuild 镜像
    volumes:
      - ./backend-go:/src               # 完整源码 mount（air 监听 .go 变化）
      - backend_tmp:/src/tmp            # 隔离 air 编译产物（避免污染 host）
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
    # 覆盖 base healthcheck：air 首次全量编译较慢，放宽启动窗口
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/api/v1/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  # ── 前端 dev 模式（Next.js dev server）───────────────────────
  frontend:
    image: oven/bun:1.3.14-alpine
    pull_policy: missing
    user: root
    working_dir: /app
    # Dev 统一从 nginx(8888) 进入。Next.js dev server 监听 5173。
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "if [ ! -d /app/node_modules/.bin ] || [ -z \"$$(ls -A /app/node_modules/.bin 2>/dev/null)\" ]; then echo '[frontend] Installing dependencies...'; bun install --frozen-lockfile; fi; bun run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"

  # ── Nginx（生产反代）─────────────────────────────────────────────
  nginx:
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8888}:80"   # 端口由 .env NGINX_PORT 统一控制，与生产 docker-compose.yml 一致
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/amap.default.inc:/etc/nginx/conf.d/amap.inc:ro

# ── 命名卷（隔离跨平台原生模块与编译产物）───────────────────────────
volumes:
  backend_tmp:
    name: hotspot-dev-backend-tmp       # air 编译输出隔离
  frontend_node_modules:
    name: hotspot-dev-frontend-node-modules  # Linux native modules（不污染 host）
