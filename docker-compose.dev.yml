# ── HotSpot Dev Override ──────────────────────────────────────────
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 设计原则：
#   - dev 镜像**只构建一次**（hotspot-backend-dev:latest），通过 bind-mount 实时同步源代码
#   - 修改 Go 代码 → air 自动重编译并重启服务
#   - 修改前端代码 → Vite HMR 即时刷新
#   - 用 named volume 隔离 node_modules，避免 host/container 跨平台 native modules 污染
#   - 发包时用 base docker-compose.yml（生产镜像 hotspot-backend:latest）

services:
  # 暴露基础设施端口到宿主机方便工具直连
  postgres:
    ports:
      - "5432:5432"

  seaweedfs:
    ports:
      - "8333:8333"

  redis:
    ports:
      - "6379:6379"

  # ── 后端（dev 模式）──────────────────────────────────────────────
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile.dev
      args:
        GO_VERSION: ${GO_VERSION:-1.26.2}
        AIR_VERSION: ${AIR_VERSION:-1.67.3}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: hotspot-backend-dev:latest   # dev 镜像（含 Go SDK + air，热加载）
    user: root
    ports:
      - "8081:8081"
    # 源码实时同步，air 监听 .go 变化自动重新编译重启，无需 rebuild 镜像
    volumes:
      - ./backend-go:/src               # 完整源码 mount（air 监听 .go 变化）
      - backend_tmp:/src/tmp            # 隔离 air 编译产物（避免污染 host）
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
    # 覆盖 base healthcheck：air 首次全量编译较慢，放宽启动窗口
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/api/v1/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  # ── 后端（集成测试实例,APP_ENV=test 跳过限流）────────────────────
  # 使用: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile test up -d backend-test
  # 然后: BACKEND_URL=http://localhost:8082 go test -count=1 ./test/integration/ (backend-go 目录)
  backend-test:
    profiles: ["test"]
    image: hotspot-backend-dev:latest
    user: root
    working_dir: /src
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-go:/src
    environment:
      APP_ENV: test          # 中间件跳过限流(ratelimit.Middleware),集成测试必需
      LOG_LEVEL: warn
      # 独立测试数据库,避免污染 dev 主库;启动时自动建库 + 迁移(bootstrap/app.go EnsureSchema)
      POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD:-change-me}@postgres:5432/hotspot_test?sslmode=disable
      # 以下与 base backend 服务保持一致(backend-test 不继承 backend 的环境变量)
      APP_HOST: 0.0.0.0
      APP_PORT: "8081"
      REDIS_URL: redis://redis:6379/0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-secret-change-me}
      APP_NAME: hotspot-backend-go
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${NGINX_PORT:-8888}/s3
      S3_PUBLIC_FORCE_PATH_STYLE: "true"
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: hotspot
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache postgresql-client >/dev/null 2>&1;
        until pg_isready -h postgres -U postgres -q; do sleep 1; done;
        PGPASSWORD=${POSTGRES_PASSWORD:-change-me} psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='hotspot_test'" | grep -q 1 ||
          PGPASSWORD=${POSTGRES_PASSWORD:-change-me} psql -h postgres -U postgres -c "CREATE DATABASE hotspot_test";
        go build -o /tmp/server ./cmd/server/ && exec /tmp/server
    ports:
      - "8082:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/api/v1/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  # ── 前端 dev 模式（SvelteKit dev server）───────────────────────
  frontend:
    image: oven/bun:1.3.14-alpine
    pull_policy: missing
    user: root
    working_dir: /app
    # Dev 统一从 nginx(8888) 进入。SvelteKit dev server 监听 5173。
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "if [ ! -d /app/node_modules/.bin ] || [ -z \"$$(ls -A /app/node_modules/.bin 2>/dev/null)\" ]; then echo '[frontend] Installing dependencies...'; bun install --frozen-lockfile; fi; bun run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"

  # ── Nginx（生产反代）─────────────────────────────────────────────
  nginx:
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8888}:80"   # 端口由 .env NGINX_PORT 统一控制，与生产 docker-compose.yml 一致
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/amap.default.inc:/etc/nginx/conf.d/amap.inc:ro

# ── 命名卷（隔离跨平台原生模块与编译产物）───────────────────────────
volumes:
  backend_tmp:
    name: hotspot-dev-backend-tmp       # air 编译输出隔离
  frontend_node_modules:
    name: hotspot-dev-frontend-node-modules  # Linux native modules（不污染 host）
