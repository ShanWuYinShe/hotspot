# ── HotSpot Dev Override ──────────────────────────────────────────
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 变更:
#   - 后端从源码构建，挂载编译产物，暴露调试端口
#   - 前端使用 Bun 原生 HMR 替代生产 Node 镜像
#   - 暴露 postgres 端口到宿主机方便数据库工具直连

services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    user: root
    ports:
      - "8081:8081"
    volumes:
      - ./backend-go/server:/app/server:ro
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug

  frontend:
    image: oven/bun:1.3.14-alpine
    pull_policy: missing
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_svelte:/app
      - /app/node_modules
    environment:
      PORT: "3000"
      ORIGIN: http://localhost:8888
      BACKEND_URL: http://backend:8081
      VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
      VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
      VITE_AMAP_SERVICE_HOST: /_AMapService
    command:
      [
        "sh",
        "-c",
        "bun install --frozen-lockfile --silent 2>/dev/null; exec bun run dev -- --host 0.0.0.0 --port 3000"
      ]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
