# ── HotSpot Dev Override ──────────────────────────────────────────
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 变更:
#   - 后端从源码构建，挂载编译产物，暴露调试端口
#   - 前端使用 Vite HMR 开发服务器替代生产 Nginx 镜像
#   - 暴露 postgres / seaweedfs 端口到宿主机方便工具直连

services:
  postgres:
    ports:
      - "5432:5432"

  seaweedfs:
    ports:
      - "8333:8333"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    user: root
    ports:
      - "8081:8081"
    volumes:
      - ./backend-go/server:/app/server:ro
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug

  frontend:
    image: oven/bun:1.3.14-alpine
    pull_policy: missing
    user: root
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      BACKEND_URL: http://backend:8081
      DOCKER_ENV: "true"
    entrypoint: []
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "5173"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/amap.default.inc:/etc/nginx/conf.d/amap.inc:ro
