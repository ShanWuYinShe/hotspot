version: '3.8'

services:
  # Database
  postgres:
    image: postgis/postgis:15-3.3
    container_name: hotspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: hotspot
      POSTGRES_DB: hotspot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotspot-net

  # Cache
  redis:
    image: redis:7-alpine
    container_name: hotspot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotspot-net

  # Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: hotspot-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hotspot-net

  # MinIO Client - Initialize bucket and policy
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - hotspot-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/hotspot;
      /usr/bin/mc anonymous set download myminio/hotspot;
      exit 0;
      "

  # Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotspot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://hotspot:hotspot@postgres:5432/hotspot
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=hotspot
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      # S3_PUBLIC_BASE: presigned URL 前缀
      # Docker 环境推荐使用 /s3（相对路径），通过 Nginx 转发到 MinIO
      - S3_PUBLIC_BASE=/s3
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=dev_secret_key_change_in_prod
      - SUPER_ADMIN_LOGIN_ID=superadmin
      - SUPER_ADMIN_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - hotspot-net

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotspot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Nuxt runtime config overrides
      # Proxy API requests to backend container
      - NUXT_API_PROXY_TARGET=http://backend:8080/api/**
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - backend
    networks:
      - hotspot-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  hotspot-net:
    driver: bridge
