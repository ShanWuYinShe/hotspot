services:
  # ── Storage ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/hotspot &&
      echo 'Bucket hotspot ready.'
      "

  # ── Backend (Go) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
      APP_HOST: 0.0.0.0
      APP_PORT: "8081"
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/hotspot?sslmode=disable
      AUTH_TOKEN_SECRET: dev-secret-change-me-in-prod
      APP_NAME: hotspot-backend-go
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: hotspot
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/api/v1/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Frontend (SvelteKit) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend_svelte
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      ORIGIN: http://localhost:8888
      BACKEND_URL: http://backend:8081
      VITE_AMAP_KEY: ""
      VITE_AMAP_SERVICE_HOST: /_AMapService

  # ── Gateway (Nginx) ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  minio_data:
