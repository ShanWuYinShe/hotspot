# ── HotSpot Base Configuration ────────────────────────────────────
# 构建 + 运行: docker compose up --build -d
# 仅运行:     docker compose up -d
# 开发模式:   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 密钥通过 .env 文件注入（复制 .env.example → .env 后填入真实值）。

services:
  # ── Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:${POSTGRES_VERSION:-17.4}-alpine3.21
    restart: always
    environment:
      POSTGRES_DB: hotspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Cache & Pub/Sub (Redis) ───────────────────────────────────────
  redis:
    image: redis:${REDIS_VERSION:-7.4}-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Object Storage (S3-compatible) ──────────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.21}
    restart: always
    command: server -s3 -dir=/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/dir/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend (Go API) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22}
    image: hotspot-backend:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      APP_HOST: 0.0.0.0
      APP_PORT: "8081"
      POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD:-change-me}@postgres:5432/hotspot?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set to a high-entropy value (>=32 bytes) in production}
      APP_NAME: hotspot-backend-go
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${NGINX_PORT:-8888}/s3
      S3_PUBLIC_FORCE_PATH_STYLE: "true"
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: hotspot
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/api/v1/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Frontend (SvelteKit 静态产物) ──────────────────────────────
  # 生产模式: hotspot-frontend:latest 仅持有 build 产物，通过共享 volume 挂给网关 nginx。
  # 开发模式: image 由 dev override 替换为 oven/bun + Vite HMR。
  # 生产构建: docker compose --profile prod build frontend-build
  frontend:
    image: hotspot-frontend:latest
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_build:/build
    healthcheck:
      test: ["CMD-SHELL", "test -f /build/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Frontend Builder (仅生产构建) ─────────────────────────────
  frontend-build:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22}
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
        VITE_AMAP_SERVICE_HOST: ${VITE_AMAP_SERVICE_HOST:-}
    image: hotspot-frontend:latest

  # ── Gateway (Nginx) ─────────────────────────────────────────────
  nginx:
    image: nginx:${NGINX_VERSION:-1.30.1}-alpine
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8888}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/amap.default.inc:/etc/nginx/conf.d/amap.inc:ro
      - frontend_build:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_build:
