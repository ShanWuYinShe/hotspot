services:
  # ── Storage ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.51
    command: server -s3 -dir=/seaweedfs/data
    volumes:
      - seaweedfs_data:/seaweedfs/data
    ports:
      - "9333:9333"
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/dir/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Go) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
      APP_HOST: 0.0.0.0
      APP_PORT: "8081"
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/hotspot?sslmode=disable
      AUTH_TOKEN_SECRET: dev-secret-change-me-in-prod
      APP_NAME: hotspot-backend-go
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: hotspot
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/api/v1/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Frontend (SvelteKit) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend_svelte
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      ORIGIN: http://localhost:8888
      BACKEND_URL: http://backend:8081
      VITE_AMAP_KEY: ""
      VITE_AMAP_SERVICE_HOST: /_AMapService

  # ── Gateway (Nginx) ──────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  seaweedfs_data:
