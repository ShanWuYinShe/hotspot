# ── Release：tag 驱动的镜像构建与产物分发 ──────────────────────────
# 推送 v* tag 触发：构建前后端生产镜像（注入 GIT_VERSION/GIT_COMMIT/
# GIT_BUILD_TIME 版本指纹）→ docker save 压缩 → 挂到同名 GitHub Release。
#
# 生产部署（auto-deploy job 经 SSH 自动触发）：从 Release 下载镜像包 →
# 服务器 docker load → compose up。服务器全程不接触源码、不构建，替代早期
# rsync 源码到服务器构建的非常规做法；手动兜底仍可本地执行
# scripts/deploy-production.sh vX.Y.Z（同一条链路）。
#
# 触发前条件：tag 形态为 vX.Y.Z、tag 指向的提交已在 origin/main 上、且该提交的
# CI 已跑完并全绿——三条都在工作流内强制断言（tag 不合规 / 未合并 / CI 未过一律
# 不出包）；deploy 脚本会再复核一次 tag 位置。
# 凭据：仅内置 GITHUB_TOKEN（contents: write 用于创建 Release/上传资产）。

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE_BACKEND: hotspot-backend
  IMAGE_FRONTEND: hotspot-frontend

jobs:
  require-ci:
    name: Require CI Green on Tagged Commit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Assert CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          # tag 若紧跟合并推送，CI 可能还在跑：等待其完成（上限 40 分钟），
          # 结论非 success（失败 / 查不到 / 超时）一律拒绝出包。
          deadline=$(( $(date +%s) + 2400 ))
          while :; do
            if ! raw="$(gh run list --workflow CI --commit "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" --json status,conclusion 2>&1)"; then
              echo "::warning::gh 查询失败，60s 后重试：$raw"
            else
              echo "gh 返回：$raw"
              row="$(printf '%s' "$raw" | jq 'first(.[] | select(.status == "completed"))')"
              if [ -n "$row" ] && [ "$row" != "null" ]; then
                conclusion="$(printf '%s' "$row" | jq -r '.conclusion')"
                echo "tagged commit $GITHUB_SHA CI conclusion: $conclusion"
                test "$conclusion" = "success"
                exit 0
              fi
              echo "CI 尚未完成，60s 后重试…"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::该提交的 CI 未在 40 分钟内完成，拒绝发布（请确认 CI 结论后重推 tag）"
              exit 1
            fi
            sleep 60
          done

  build-push-release:
    name: Build & Attach Images
    needs: require-ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # 「tag 是否在 main 上」需要祖先判定，浅克隆会误判

      # 发布门禁：CI 由 tags: ['v*'] 触发，任何 v 开头的 tag 都会进来——包括
      # 误推的 v1.2、带后缀的候选 tag（deploy 脚本只接受 vX.Y.Z）或在未合并
      # 分支提交上打的 tag。这类 tag 一旦出包，Release 页会多出无法部署的假
      # 版本，故在此拦下。
      - name: Assert release gate (tag format & on main)
        run: |
          set -eo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 不是 vX.Y.Z 形态，拒绝发布"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} 指向的提交 ${GITHUB_SHA} 不在 origin/main 上（未合并代码不得发版）"
            exit 1
          fi
          echo "release gate passed: ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"

      - name: Resolve version fingerprint
        run: |
          echo "GIT_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GIT_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build backend image
        run: |
          docker build backend-go \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg GIT_VERSION="$GIT_VERSION" \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --build-arg GIT_BUILD_TIME="$GIT_BUILD_TIME" \
            -t "$IMAGE_BACKEND:$GIT_VERSION"

      - name: Build frontend image
        env:
          # 高德 Web key：仓库 Settings → Secrets 中维护（VITE_AMAP_KEY），缺失则
          # 构建产物自动走 OSM 降级；key 会烘焙进静态产物，配额与告警见 .env.example
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
        run: |
          docker build frontend \
            --build-arg GIT_VERSION="$GIT_VERSION" \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --build-arg GIT_BUILD_TIME="$GIT_BUILD_TIME" \
            --build-arg VITE_AMAP_KEY="$VITE_AMAP_KEY" \
            -t "$IMAGE_FRONTEND:$GIT_VERSION"

      - name: Smoke-check fingerprint inside images
        run: |
          echo "backend labels:"; docker inspect "$IMAGE_BACKEND:$GIT_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.version"}} / {{index .Config.Labels "org.opencontainers.image.revision"}}'
          test "$(docker inspect "$IMAGE_BACKEND:$GIT_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$GIT_VERSION"
          test "$(docker inspect "$IMAGE_FRONTEND:$GIT_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$GIT_VERSION"

      - name: Pack images
        run: |
          docker save "$IMAGE_BACKEND:$GIT_VERSION" "$IMAGE_FRONTEND:$GIT_VERSION" | gzip > \
            "hotspot-images-${GIT_VERSION}.tar.gz"
          # 校验和随包发布：部署端下载后强制校验（sha256sum 的两空格输出格式对
          # shasum -a 256 -c 与 sha256sum -c 都兼容），挡住传输损坏与资产替换。
          sha256sum "hotspot-images-${GIT_VERSION}.tar.gz" > "hotspot-images-${GIT_VERSION}.tar.gz.sha256"
          ls -lh "hotspot-images-${GIT_VERSION}.tar.gz"*

      - name: Create GitHub Release and attach images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --notes（静态运维说明）+ --generate-notes（自动变更列表）：此前只有
          # 静态模板，Release 页看不到每个版本改了什么。
          gh release create "$GIT_VERSION" \
            --verify-tag \
            --generate-notes \
            --title "$GIT_VERSION" \
            --notes "生产镜像构建产物（hotspot-backend / hotspot-frontend）。
          部署：tag 即上线（auto-deploy job 经 SSH 触发服务器部署），
          手动兜底：./scripts/deploy-production.sh $GIT_VERSION
          版本指纹：version=$GIT_VERSION commit=$GIT_COMMIT built=$GIT_BUILD_TIME" \
            "hotspot-images-${GIT_VERSION}.tar.gz" \
            "hotspot-images-${GIT_VERSION}.tar.gz.sha256"

  auto-deploy:
    name: Auto Deploy to Production
    needs: build-push-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # deploy 脚本要校验 tag 位置与工作区干净度
      - name: Deploy over SSH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
          # deploy-production.sh 经 SERVER 走 ssh；脚本内 tag 形态/位置校验、
          # 并发锁、备份、指纹核对、失败回滚全部保留，与手动执行同一条链路。
          SERVER=prod-deploy ./scripts/deploy-production.sh "${GITHUB_REF_NAME}"
