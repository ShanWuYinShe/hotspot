name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go Backend (Unit Tests)
    runs-on: ubuntu-24.04
    env:
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: go build
        run: go build -C backend-go -o /dev/null ./cmd/server
      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l backend-go)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下文件未通过 gofmt（本地执行 gofmt -w backend-go 修复）:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: go vet
        run: go vet -C backend-go ./...
      # 官方漏洞扫描（golang.org/x/vuln）：只报实际调用到的漏洞符号，噪音低于
      # 依赖清单比对。版本固定（go list -m -versions golang.org/x/vuln 查询后
      # 手动升级），避免 @latest 漂移导致扫描器行为不可复现。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd backend-go && "$(go env GOPATH)/bin/govulncheck" ./...
      # staticcheck SA 规则（correctness）：go vet 覆盖不到的解包/未使用值/
      # nil Context/不可达分支等；版本固定避免 @latest 漂移。本地门禁同款。
      - name: staticcheck (SA rules)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          cd backend-go && "$(go env GOPATH)/bin/staticcheck" -checks 'SA*' ./...
      # gosec 安全扫描（high severity/high confidence）：与本地门禁同款，版本固定。
      # 规则号/理由缺失的 #nosec 也会失败（-nosec-require-*），防止无理由压制。
      - name: gosec (high severity/high confidence)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          cd backend-go && "$(go env GOPATH)/bin/gosec" -quiet -severity high -confidence high -nosec-require-justification -nosec-require-rules ./...
      - name: check migration numbering
        run: ./scripts/check-migrations.sh
      # -race：数据竞争在单测并发场景下才能暴露（如 media retention sweeper
      # 标志位的读写），本地回归也需带 -race 跑全量后再提交。
      - name: go test (with coverage gate)
        run: |
          # GitHub Actions 默认 shell 为 bash -e（无 pipefail），`go test | tee`
          # 的退出码取自 tee，测试失败不会让本步骤变红，必须显式开启 pipefail。
          set -eo pipefail
          cd backend-go
          # 用数组承载包列表：避免未加引号的命令替换被 shell 分词（shellcheck SC2046）。
          mapfile -t pkgs < <(go list ./... | grep -v /test/integration)
          go test -race -count=1 -cover "${pkgs[@]}" 2>&1 | tee /tmp/gotest.log
          # 业务模块覆盖率门槛：internal/modules 下任一包 <70% 即失败。
          # go test 单包输出格式：ok  <pkg>  <dur>  coverage: <x>% of statements
          awk '/^ok .*coverage: [0-9.]+% of statements/ {
            pkg = $2
            cov = $0
            sub(/^.*coverage: /, "", cov)
            sub(/% of statements.*$/, "", cov)
            if (pkg ~ /modules\// && cov + 0 < 70.0) {
              print "COVERAGE BELOW 70%: " pkg " " cov "%"
              failed = 1
            }
          } END { if (failed) exit 1 }' /tmp/gotest.log

  # ── 基础设施配置静态校验 ─────────────────────────────────────────
  # compose 三种叠加组合的语法/合并校验 + 三份 nginx 配置的 nginx -t。
  # nginx 配置此前零校验：改动只在部署时才暴露（服务器 up 失败）。
  infra:
    name: Infra (Compose & Nginx Config)
    runs-on: ubuntu-24.04
    env:
      # base 中 POSTGRES_PASSWORD / AUTH_TOKEN_SECRET 为 :? 强制变量（凭证必填
      # 加固后新增前者）；config 仅做语法/合并校验，哑值不参与任何产物
      POSTGRES_PASSWORD: ci-dummy-password-for-compose-config-validation-only
      AUTH_TOKEN_SECRET: ci-dummy-secret-for-compose-config-validation-only
      # S3 凭证同为 :? 强制（弱默认移除后新增）；同上哑值仅过 config 校验。
      # 值风格对齐上面两个哑值——含 secret/key 词根的短值会误触 gitleaks。
      S3_ACCESS_KEY: ci-dummy-s3-access-for-compose-config-validation-only
      S3_SECRET_KEY: ci-dummy-s3-secret-for-compose-config-validation-only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: docker compose config (base / +dev / +prod)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      # promtool 校验 Prometheus 主配置与告警规则语法（规则文件改动时防漂移）。
      # 镜像 tag 与 docker-compose.yml 的 PROMETHEUS_VERSION 默认值一致。
      - name: prometheus config (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/docker/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.4.1 check config /etc/prometheus/prometheus.yml

      - name: nginx -t (base / dev / prod-tls)
        run: |
          set -eo pipefail
          NGINX_IMAGE=nginx:1.30.4-alpine   # 与 docker-compose.yml NGINX_VERSION 默认值同步
          # upstream 服务名是 compose DNS 名，nginx 启动初始化时必须能解析——
          # --add-host 指到 127.0.0.1 占位（只校验语法与 include/证书文件可达，
          # 不真正反代）；卷挂载路径与各 compose 文件保持一致。

          # base（docker-compose.yml：nginx.main.conf + nginx.conf + headers/proxy/amap 片段）
          docker run --rm \
            -v "$PWD/docker/nginx.main.conf":/etc/nginx/nginx.conf:ro \
            -v "$PWD/docker/nginx.conf":/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/docker/nginx.headers.inc":/etc/nginx/conf.d/headers.inc:ro \
            -v "$PWD/docker/nginx.csp.inc":/etc/nginx/conf.d/csp.inc:ro \
            -v "$PWD/docker/nginx.proxy.inc":/etc/nginx/conf.d/proxy.inc:ro \
            -v "$PWD/docker/amap.default.inc":/etc/nginx/conf.d/amap.inc:ro \
            --add-host backend:127.0.0.1 --add-host seaweedfs:127.0.0.1 \
            "$NGINX_IMAGE" nginx -t

          # dev（docker-compose.dev.yml：nginx.main.conf + nginx.dev.conf + dev 专用 proxy 片段）
          docker run --rm \
            -v "$PWD/docker/nginx.main.conf":/etc/nginx/nginx.conf:ro \
            -v "$PWD/docker/nginx.dev.conf":/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/docker/nginx.headers.inc":/etc/nginx/conf.d/headers.inc:ro \
            -v "$PWD/docker/nginx.dev.proxy.inc":/etc/nginx/conf.d/proxy.inc:ro \
            -v "$PWD/docker/amap.default.inc":/etc/nginx/conf.d/amap.inc:ro \
            --add-host backend:127.0.0.1 --add-host seaweedfs:127.0.0.1 --add-host frontend:127.0.0.1 \
            "$NGINX_IMAGE" nginx -t

          # prod TLS（docker-compose.prod.yml：nginx.prod-tls.conf + server.inc）。
          # 证书与 amap.prod.inc 由服务器侧维护不入库：证书用一次性自签占位、
          # amap 用仓库默认片段代替——只校验配置语法与证书文件解析。
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout /tmp/chaoset.key -out /tmp/chaoset.pem -days 1 -nodes -subj '/CN=ci'
          cp /tmp/chaoset.pem /tmp/cloudflare-origin-pull.pem  # ssl_verify_client 只需文件存在
          docker run --rm \
            -v "$PWD/docker/nginx.main.conf":/etc/nginx/nginx.conf:ro \
            -v "$PWD/docker/nginx.prod-tls.conf":/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/docker/prod-server.inc":/etc/nginx/conf.d/server.inc:ro \
            -v "$PWD/docker/nginx.headers.inc":/etc/nginx/conf.d/headers.inc:ro \
            -v "$PWD/docker/nginx.csp.inc":/etc/nginx/conf.d/csp.inc:ro \
            -v "$PWD/docker/nginx.proxy.inc":/etc/nginx/conf.d/proxy.inc:ro \
            -v "$PWD/docker/amap.default.inc":/etc/nginx/conf.d/amap.inc:ro \
            -v /tmp/chaoset.pem:/etc/nginx/certs/chaoset.pem:ro \
            -v /tmp/chaoset.key:/etc/nginx/certs/chaoset.key:ro \
            -v /tmp/cloudflare-origin-pull.pem:/etc/nginx/certs/cloudflare-origin-pull.pem:ro \
            --add-host backend:127.0.0.1 --add-host seaweedfs:127.0.0.1 \
            "$NGINX_IMAGE" nginx -t

  backend-integration:
    name: Go Backend (Postgres Integration)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: groonga/pgroonga:4.0.6-alpine-18
        env:
          POSTGRES_DB: hotspot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DSN: postgresql://postgres:postgres_ci_password@localhost:5432/hotspot_test?sslmode=disable
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: run database migrations
        run: |
          cd backend-go
          go run ./cmd/migrate

      # 存量库迁移基线回归（ops 审计 P1-5）：重复执行必须幂等；-verify-only
      # 用 schema_migrations checksum + schema_manifest 校验期望对象齐全；
      # check-migration-indexes 逐名比对 manifest 索引（历史上 idx_moments_keyset
      # 因旧 runner 基线登记永久缺失，此步防同类回归）。
      - name: verify migration idempotency, manifest and indexes
        run: |
          cd backend-go
          go run ./cmd/migrate
          go run ./cmd/migrate -verify-only
          cd ..
          PG_CONTAINER="$(docker ps --filter ancestor=groonga/pgroonga:4.0.6-alpine-18 --format '{{.Names}}' | head -n1)"
          test -n "$PG_CONTAINER"
          ./scripts/check-migration-indexes.sh --container "$PG_CONTAINER" --database hotspot_test

      - name: test database schema & spatial indexes
        run: |
          cd backend-go
          go test -v -count=1 ./test/integration -run 'TestRequiredTablesExist|TestExplainUsesExpectedS2Indexes'

      - name: test real postgres repository & platform integration
        run: |
          cd backend-go
          # -p 1：共享真实库，IT 用例会提交 fixture，串行执行避免跨包统计断言偶发红灯。
          go test -p 1 -v -count=1 -run 'TestPostgresIT|Contract' ./internal/modules/...
          # platform 层真实库 IT：outbox 事务回滚/派发、RunInTransaction aftercommit、
          # WarmPlanner、auth session/refresh token 契约。这些用例的命名不含
          # TestPostgresIT|Contract 前缀，此步骤此前只跑 modules，platform IT 从未
          # 在 CI 执行；这里不传 -run 直接跑整包（无库单测成本可忽略），后续新增的
          # platform 真实库用例（SkipIfShort 门控）自动纳入。
          go test -p 1 -v -count=1 ./internal/platform/...

      # 模块覆盖率门禁（真实库口径 >=90%）：repo/IT/契约测试计入后每包必须
      # 达标；无 DB 的 backend job 保留 70% 下限，本 job 具备 Postgres，
      # 是 90% 的唯一校验点（避免无库阶段把 repo 代码天然不可覆盖算成缺口）。
      - name: module coverage gate (DB, >=90%)
        run: |
          set -euo pipefail
          cd backend-go
          mapfile -t pkgs < <(go list ./internal/modules/... | grep -v /notifytest)
          go test -p 1 -count=1 -cover "${pkgs[@]}" | tee /tmp/module-coverage.log
          awk '/^ok .*coverage: [0-9.]+% of statements/ {
            pkg = $2; cov = $0;
            sub(/^.*coverage: /, "", cov); sub(/% of statements.*$/, "", cov);
            if (index(pkg, "/modules/") > 0 && cov + 0 < 90.0) { print "COVERAGE BELOW 90%: " pkg " " cov "%"; failed = 1 }
          } END { if (failed) exit 1 }' /tmp/module-coverage.log

      # ── HTTP 全链路集成（docker_test.go ~90 用例）─────────────────
      # 此前本 job 只跑 repo 级测试：docker_test 的 TestMain 在无 BACKEND_URL
      # 时整批静默 skip 且 CI 显示绿——陌生人私聊回归（3c63ea34 修复）即借此
      # 带绿灯上线。现在真起 seaweedfs + server 进程跑全套 E2E。
      - name: start seaweedfs (S3)
        run: |
          # 与 docker-compose.yml 同款 identity 配置：无 s3.json 时 seaweedfs
          # 对匿名 allow-all，但携带未知 accessKey 的 presigned 请求会 403。
          docker run -d --name seaweedfs --entrypoint /bin/sh \
            -p 8333:8333 -p 9333:9333 \
            chrislusf/seaweedfs:4.41 -c "mkdir -p /etc/seaweedfs && \
              printf '{\"identities\":[{\"name\":\"ci\",\"credentials\":[{\"accessKey\":\"ci\",\"secretKey\":\"ci-secret-key\"}],\"actions\":[\"Read\",\"Write\",\"List\",\"Tagging\",\"Admin\"]}]}\\n' > /etc/seaweedfs/s3.json && \
              exec weed server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9333/dir/status > /dev/null; then
              echo "seaweedfs ready after $i probes"; exit 0
            fi
            sleep 2
          done
          echo "seaweedfs not ready"; docker logs seaweedfs; exit 1

      - name: start backend server
        env:
          S3_ENDPOINT: http://localhost:8333
          # 客户端可见端点按线上/本地同款形态给（网关挂载前缀 /s3）：媒体直传 URL 的
          # origin 由请求 Origin 决定、路径沿用该端点的 path，CI 里没有网关，
          # 测试侧用 TEST_S3_DIRECT_ENDPOINT 直连 SeaweedFS 完成上传。
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:8888/s3
          S3_BUCKET: hotspot
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret-key
          # 测试环境：显式关闭限流（与 docker-compose.dev.yml 的 backend-test 一致），
          # 避免 ~90 个用例互相触发限流桶。注意是 RATE_LIMIT_BYPASS 而不是 APP_ENV
          # 隐式旁路——生产误配 APP_ENV 不会静默失去限流。
          APP_ENV: test
          RATE_LIMIT_BYPASS: "1"
        run: |
          cd backend-go
          go run ./cmd/server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/healthz > /dev/null; then
              echo "backend ready after $i probes"; exit 0
            fi
            sleep 2
          done
          echo "backend not ready"; tail -100 /tmp/backend.log; exit 1

      # 媒体直传 URL 的 origin 跟随请求入口 origin（media/client_endpoint.go 的全局
      # 中间件），而 SigV4 把 Host 纳入签名——客户端必须经同一 host 的网关直传，
      # 否则换 host 必然 SignatureDoesNotMatch（2026-10-02 实测）。CI 因此起一个与
      # 本地/线上同款的 nginx：/api → host:8081、/s3 → host:8333，Host 原样透传。
      - name: start gateway (nginx, mirrors local and prod)
        run: |
          set -eo pipefail
          docker run -d --name gateway -p 8888:80 \
            --add-host backend:host-gateway --add-host seaweedfs:host-gateway \
            -v "$PWD/docker/nginx.main.conf":/etc/nginx/nginx.conf:ro \
            -v "$PWD/docker/nginx.conf":/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/docker/nginx.headers.inc":/etc/nginx/conf.d/headers.inc:ro \
            -v "$PWD/docker/nginx.csp.inc":/etc/nginx/conf.d/csp.inc:ro \
            -v "$PWD/docker/nginx.proxy.inc":/etc/nginx/conf.d/proxy.inc:ro \
            -v "$PWD/docker/amap.default.inc":/etc/nginx/conf.d/amap.inc:ro \
            nginx:1.30.4-alpine
          for _ in $(seq 1 30); do
            root_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/ || true)
            s3_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/s3/ || true)
            if [ "$root_code" = "200" ] && [ "$s3_code" != "000" ] && [ "$s3_code" != "502" ]; then
              echo "gateway ready (root=$root_code s3=$s3_code)"; exit 0
            fi
            sleep 2
          done
          echo "gateway not ready"; docker logs gateway; exit 1

      - name: run HTTP end-to-end integration tests
        env:
          BACKEND_URL: http://localhost:8081
          S3_ENDPOINT: http://localhost:8333
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:8888/s3
          S3_BUCKET: hotspot
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret-key
          APP_ENV: test
        run: |
          cd backend-go
          go test -v -count=1 ./test/integration

      - name: print backend log on failure
        if: failure()
        run: tail -200 /tmp/backend.log

  contract-guard:
    name: Contract Prefix Guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: forbid legacy /admin/v1 node
        run: |
          set -eo pipefail
          # 本文件自身含守卫字面量，做扫描例外（此处是唯一允许出现旧前缀的地方）
          hits=$(grep -rn "/admin/v1" --include="*.md" --include="*.go" --include="*.ts" --include="*.svelte" --include="*.ets" --include="*.conf" --include="*.inc" --include="*.yml" --include="*.sh" . 2>/dev/null | grep -v -e "harmonyapp/entry/build/" -e "frontend/.svelte-kit/" -e "frontend/node_modules/" -e "^./.workwork/" -e "^./.github/workflows/ci.yml" || true)
          if [ -n "$hits" ]; then
            echo "发现旧管理节点 /admin/v1（已迁移为 /admin/api/v1，见 spec/api_spec_base.md）："
            echo "$hits"
            exit 1
          fi
          echo "prefix guard passed"

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      # bun 全局安装缓存：以 bun.lock 为键，未命中才全量下载
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: bun install
        run: bun install --cwd frontend
      - name: type-check (svelte-check)
        run: bun run --cwd frontend check
      - name: unit tests (vitest)
        run: bun run --cwd frontend test
      - name: bun build
        run: bun run --cwd frontend build

  # 密钥泄露扫描：全量历史 + 现有默认规则。与 workwork 的同名 job 保持同构
  #（同一 gitleaks 版本），新发现即 fail；如有误报按指纹豁免进 .gitleaksignore。
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # 全量历史扫描
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true
          # 仓库根没有 go.mod，不指定时缓存恢复会报 "Restore cache failed" 警告
          cache-dependency-path: backend-go/go.sum
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git .

  docker-build:
    name: Docker Build + Runtime Smoke (Prod Images)
    runs-on: ubuntu-24.04
    services:
      # 生产镜像运行时契约验证需要真实数据库：镜像启动会执行迁移 + manifest
      # 校验（ops 审计 P1-4：此前 CI 只 build 不 run，USER/CMD/探针/迁移路径
      # 只能在线上首次暴露）。
      postgres:
        image: groonga/pgroonga:4.0.6-alpine-18
        env:
          POSTGRES_DB: hotspot_image_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 生产镜像可构建性机器门禁：此前 Dockerfile 只在打 tag 后的 Release 才
      # 首次构建，构建参数/层次错误要到发布阶段才暴露。GHA 缓存层复用把增量
      # 成本压到可接受范围。
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend-go
          file: backend-go/Dockerfile
          push: false
          load: true
          tags: hotspot-backend:ci
          build-args: |
            GIT_VERSION=v0.0.0-ci
            GIT_COMMIT=${{ github.sha }}
            GIT_BUILD_TIME=2026-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 生产镜像运行时契约（ops 审计 P1-4）：非 root、CMD 可启动、启动迁移 +
      # manifest 校验通过、/readyz + /healthz 可达、OCI version 指纹一致。
      # --network host 让容器内 127.0.0.1 直连 job service postgres。
      - name: run production backend image smoke
        run: |
          docker run -d --name hotspot-backend-image-ci --network host \
            -e APP_ENV=test -e APP_HOST=127.0.0.1 -e APP_PORT=18081 \
            -e POSTGRES_DSN='postgres://postgres:postgres_ci_password@127.0.0.1:5432/hotspot_image_ci?sslmode=disable' \
            -e AUTH_TOKEN_SECRET='ci-image-smoke-secret-at-least-32-bytes-long' \
            -e S3_ENDPOINT='http://127.0.0.1:8333' -e S3_PUBLIC_ENDPOINT='http://127.0.0.1:8333' \
            -e S3_BUCKET=hotspot -e S3_ACCESS_KEY=ci -e S3_SECRET_KEY=ci-secret-key \
            hotspot-backend:ci
          trap 'docker rm -f hotspot-backend-image-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18081/readyz > /tmp/readyz.json; then
              echo "image ready after $i probes"; break
            fi
            if [ "$i" = "60" ]; then
              echo "!! 生产镜像启动后 120s 内未就绪"; docker logs hotspot-backend-image-ci; exit 1
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/readyz.json
          curl -fsS http://127.0.0.1:18081/healthz | grep -q '"version":"v0.0.0-ci"'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' hotspot-backend:ci)" = "v0.0.0-ci"
          test "$(docker run --rm --entrypoint id hotspot-backend:ci -u)" != "0"
          echo "production image runtime smoke OK"
