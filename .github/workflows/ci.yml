name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: hotspot_test
          POSTGRES_USER: hotspot
          POSTGRES_PASSWORD: hotspot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotspot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DSN: postgresql://hotspot:hotspot@localhost:5432/hotspot_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: go build
        run: go build -C backend-go -o /dev/null ./cmd/server
      - name: go vet
        run: go vet -C backend-go ./...
      - name: go test
        run: go test -C backend-go -count=1 $(go list -C backend-go ./... | grep -v /test/integration) -v 2>&1 | tee

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: bun install
        run: bun install --cwd frontend
      - name: type-check (tsc)
        run: bun run --cwd frontend check
      - name: bun build
        run: bun run --cwd frontend build
