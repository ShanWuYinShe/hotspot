name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: hotspot_test
          POSTGRES_USER: hotspot
          POSTGRES_PASSWORD: hotspot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotspot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DSN: postgresql://hotspot:hotspot@localhost:5432/hotspot_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: go build
        run: go build -C backend-go -o /dev/null ./cmd/server
      - name: go vet
        run: go vet -C backend-go ./...
      - name: go test (with coverage gate)
        run: |
          cd backend-go
          go test -count=1 $(go list ./... | grep -v /test/integration) -coverprofile=/tmp/cover.out 2>&1 | tee /tmp/gotest.log
          # 业务模块覆盖率门槛：internal/modules 下任一包 <70% 即失败。
          # go test 单包输出格式：ok  <pkg>  <dur>  coverage: <x>% of statements
          awk '/^ok .*coverage: [0-9.]+% of statements/ {
            pkg = $2
            cov = $0
            sub(/^.*coverage: /, "", cov)
            sub(/% of statements.*$/, "", cov)
            if (pkg ~ /modules\// && cov + 0 < 70.0) {
              print "COVERAGE BELOW 70%: " pkg " " cov "%"
              failed = 1
            }
          } END { if (failed) exit 1 }' /tmp/gotest.log

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: bun install
        run: bun install --cwd frontend
      - name: type-check (svelte-check)
        run: bun run --cwd frontend check
      - name: unit tests (vitest)
        run: bun run --cwd frontend test
      - name: bun build
        run: bun run --cwd frontend build
