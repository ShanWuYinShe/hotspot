name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go Backend (Unit Tests)
    runs-on: ubuntu-24.04
    env:
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: go build
        run: go build -C backend-go -o /dev/null ./cmd/server
      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l backend-go)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下文件未通过 gofmt（本地执行 gofmt -w backend-go 修复）:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: go vet
        run: go vet -C backend-go ./...
      # 官方漏洞扫描（golang.org/x/vuln）：只报实际调用到的漏洞符号，噪音低于
      # 依赖清单比对。版本固定（go list -m -versions golang.org/x/vuln 查询后
      # 手动升级），避免 @latest 漂移导致扫描器行为不可复现。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd backend-go && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: check migration numbering
        run: ./scripts/check-migrations.sh
      # -race：数据竞争在单测并发场景下才能暴露（如 media retention sweeper
      # 标志位的读写），本地回归也需带 -race 跑全量后再提交。
      - name: go test (with coverage gate)
        run: |
          # GitHub Actions 默认 shell 为 bash -e（无 pipefail），`go test | tee`
          # 的退出码取自 tee，测试失败不会让本步骤变红，必须显式开启 pipefail。
          set -eo pipefail
          cd backend-go
          go test -race -count=1 -cover $(go list ./... | grep -v /test/integration) 2>&1 | tee /tmp/gotest.log
          # 业务模块覆盖率门槛：internal/modules 下任一包 <70% 即失败。
          # go test 单包输出格式：ok  <pkg>  <dur>  coverage: <x>% of statements
          awk '/^ok .*coverage: [0-9.]+% of statements/ {
            pkg = $2
            cov = $0
            sub(/^.*coverage: /, "", cov)
            sub(/% of statements.*$/, "", cov)
            if (pkg ~ /modules\// && cov + 0 < 70.0) {
              print "COVERAGE BELOW 70%: " pkg " " cov "%"
              failed = 1
            }
          } END { if (failed) exit 1 }' /tmp/gotest.log

  # ── 基础设施配置静态校验 ─────────────────────────────────────────
  # compose 三种叠加组合的语法/合并校验 + 三份 nginx 配置的 nginx -t。
  # nginx 配置此前零校验：改动只在部署时才暴露（服务器 up 失败）。
  infra:
    name: Infra (Compose & Nginx Config)
    runs-on: ubuntu-24.04
    env:
      # base 中 AUTH_TOKEN_SECRET 为 :? 强制变量；config 仅做语法/合并校验，
      # 哑值不参与任何产物
      AUTH_TOKEN_SECRET: ci-dummy-secret-for-compose-config-validation-only

    steps:
      - uses: actions/checkout@v7

      - name: docker compose config (base / +dev / +prod)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: nginx -t (base / dev / prod-tls)
        run: |
          set -eo pipefail
          NGINX_IMAGE=nginx:1.30.4-alpine   # 与 docker-compose.yml NGINX_VERSION 默认值同步
          # upstream 服务名是 compose DNS 名，nginx 启动初始化时必须能解析——
          # --add-host 指到 127.0.0.1 占位（只校验语法与 include/证书文件可达，
          # 不真正反代）；卷挂载路径与各 compose 文件保持一致。

          # base（docker-compose.yml：nginx.conf + headers/proxy/amap 片段）
          docker run --rm \
            -v "$PWD/docker/nginx.conf":/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/docker/nginx.headers.inc":/etc/nginx/conf.d/headers.inc:ro \
            -v "$PWD/docker/nginx.proxy.inc":/etc/nginx/conf.d/proxy.inc:ro \
            -v "$PWD/docker/amap.default.inc":/etc/nginx/conf.d/amap.inc:ro \
            --add-host backend:127.0.0.1 --add-host seaweedfs:127.0.0.1 \
            "$NGINX_IMAGE" nginx -t

          # dev（docker-compose.dev.yml：nginx.dev.conf + dev 专用 proxy 片段）
          docker run --rm \
            -v "$PWD/docker/nginx.dev.conf":/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/docker/nginx.headers.inc":/etc/nginx/conf.d/headers.inc:ro \
            -v "$PWD/docker/nginx.dev.proxy.inc":/etc/nginx/conf.d/proxy.inc:ro \
            -v "$PWD/docker/amap.default.inc":/etc/nginx/conf.d/amap.inc:ro \
            --add-host backend:127.0.0.1 --add-host seaweedfs:127.0.0.1 --add-host frontend:127.0.0.1 \
            "$NGINX_IMAGE" nginx -t

          # prod TLS（docker-compose.prod.yml：nginx.prod-tls.conf + server.inc）。
          # 证书与 amap.prod.inc 由服务器侧维护不入库：证书用一次性自签占位、
          # amap 用仓库默认片段代替——只校验配置语法与证书文件解析。
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout /tmp/chaoset.key -out /tmp/chaoset.pem -days 1 -nodes -subj '/CN=ci'
          cp /tmp/chaoset.pem /tmp/cloudflare-origin-pull.pem  # ssl_verify_client 只需文件存在
          docker run --rm \
            -v "$PWD/docker/nginx.prod-tls.conf":/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/docker/prod-server.inc":/etc/nginx/conf.d/server.inc:ro \
            -v "$PWD/docker/nginx.headers.inc":/etc/nginx/conf.d/headers.inc:ro \
            -v "$PWD/docker/nginx.proxy.inc":/etc/nginx/conf.d/proxy.inc:ro \
            -v "$PWD/docker/amap.default.inc":/etc/nginx/conf.d/amap.inc:ro \
            -v /tmp/chaoset.pem:/etc/nginx/certs/chaoset.pem:ro \
            -v /tmp/chaoset.key:/etc/nginx/certs/chaoset.key:ro \
            -v /tmp/cloudflare-origin-pull.pem:/etc/nginx/certs/cloudflare-origin-pull.pem:ro \
            --add-host backend:127.0.0.1 --add-host seaweedfs:127.0.0.1 \
            "$NGINX_IMAGE" nginx -t

  backend-integration:
    name: Go Backend (Postgres Integration)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: hotspot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DSN: postgresql://postgres:postgres_ci_password@localhost:5432/hotspot_test?sslmode=disable
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: run database migrations
        run: |
          cd backend-go
          go run ./cmd/migrate

      - name: test database schema & spatial indexes
        run: |
          cd backend-go
          go test -v -count=1 ./test/integration -run 'TestRequiredTablesExist|TestExplainUsesExpectedS2Indexes'

      - name: test real postgres repository integration
        run: |
          cd backend-go
          go test -v -count=1 -run 'TestPostgresIT' ./internal/modules/...

      # ── HTTP 全链路集成（docker_test.go ~90 用例）─────────────────
      # 此前本 job 只跑 repo 级测试：docker_test 的 TestMain 在无 BACKEND_URL
      # 时整批静默 skip 且 CI 显示绿——陌生人私聊回归（3c63ea34 修复）即借此
      # 带绿灯上线。现在真起 seaweedfs + server 进程跑全套 E2E。
      - name: start seaweedfs (S3)
        run: |
          # 与 docker-compose.yml 同款 identity 配置：无 s3.json 时 seaweedfs
          # 对匿名 allow-all，但携带未知 accessKey 的 presigned 请求会 403。
          docker run -d --name seaweedfs --entrypoint /bin/sh \
            -p 8333:8333 -p 9333:9333 \
            chrislusf/seaweedfs:4.41 -c "mkdir -p /etc/seaweedfs && \
              printf '{\"identities\":[{\"name\":\"ci\",\"credentials\":[{\"accessKey\":\"ci\",\"secretKey\":\"ci-secret-key\"}],\"actions\":[\"Read\",\"Write\",\"List\",\"Tagging\",\"Admin\"]}]}\\n' > /etc/seaweedfs/s3.json && \
              exec weed server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9333/dir/status > /dev/null; then
              echo "seaweedfs ready after $i probes"; exit 0
            fi
            sleep 2
          done
          echo "seaweedfs not ready"; docker logs seaweedfs; exit 1

      - name: start backend server
        env:
          S3_ENDPOINT: http://localhost:8333
          S3_PUBLIC_ENDPOINT: http://localhost:8333
          S3_BUCKET: hotspot
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret-key
          # test 环境：中间件跳过限流（与 docker-compose.dev.yml 的 backend-test 一致），
          # 避免 ~90 个用例互相触发限流桶。
          APP_ENV: test
        run: |
          cd backend-go
          go run ./cmd/server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' -d '{}' \
              http://localhost:8081/public/v1/system/health > /dev/null; then
              echo "backend ready after $i probes"; exit 0
            fi
            sleep 2
          done
          echo "backend not ready"; tail -100 /tmp/backend.log; exit 1

      - name: run HTTP end-to-end integration tests
        env:
          BACKEND_URL: http://localhost:8081
          S3_ENDPOINT: http://localhost:8333
          S3_PUBLIC_ENDPOINT: http://localhost:8333
          S3_BUCKET: hotspot
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret-key
          APP_ENV: test
        run: |
          cd backend-go
          go test -v -count=1 ./test/integration

      - name: print backend log on failure
        if: failure()
        run: tail -200 /tmp/backend.log


  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: bun install
        run: bun install --cwd frontend
      - name: type-check (svelte-check)
        run: bun run --cwd frontend check
      - name: unit tests (vitest)
        run: bun run --cwd frontend test
      - name: bun build
        run: bun run --cwd frontend build
