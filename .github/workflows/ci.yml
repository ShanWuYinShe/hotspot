name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go Backend (Unit Tests)
    runs-on: ubuntu-24.04
    env:
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: go build
        run: go build -C backend-go -o /dev/null ./cmd/server
      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l backend-go)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下文件未通过 gofmt（本地执行 gofmt -w backend-go 修复）:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: go vet
        run: go vet -C backend-go ./...
      - name: go test (with coverage gate)
        run: |
          cd backend-go
          go test -count=1 $(go list ./... | grep -v /test/integration) -coverprofile=/tmp/cover.out 2>&1 | tee /tmp/gotest.log
          # 业务模块覆盖率门槛：internal/modules 下任一包 <70% 即失败。
          # go test 单包输出格式：ok  <pkg>  <dur>  coverage: <x>% of statements
          awk '/^ok .*coverage: [0-9.]+% of statements/ {
            pkg = $2
            cov = $0
            sub(/^.*coverage: /, "", cov)
            sub(/% of statements.*$/, "", cov)
            if (pkg ~ /modules\// && cov + 0 < 70.0) {
              print "COVERAGE BELOW 70%: " pkg " " cov "%"
              failed = 1
            }
          } END { if (failed) exit 1 }' /tmp/gotest.log

  backend-integration:
    name: Go Backend (Postgres Integration)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: hotspot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DSN: postgresql://postgres:postgres_ci_password@localhost:5432/hotspot_test?sslmode=disable
      AUTH_TOKEN_SECRET: ci-test-secret-key-at-least-32-bytes-long
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: run database migrations
        run: |
          cd backend-go
          go run ./cmd/migrate

      - name: test database schema & spatial indexes
        run: |
          cd backend-go
          go test -v -count=1 ./test/integration -run 'TestRequiredTablesExist|TestExplainUsesExpectedS2Indexes'

      - name: test real postgres repository integration
        run: |
          cd backend-go
          go test -v -count=1 -run 'TestPostgresIT' ./internal/modules/...

      # ── HTTP 全链路集成（docker_test.go ~90 用例）─────────────────
      # 此前本 job 只跑 repo 级测试：docker_test 的 TestMain 在无 BACKEND_URL
      # 时整批静默 skip 且 CI 显示绿——陌生人私聊回归（3c63ea34 修复）即借此
      # 带绿灯上线。现在真起 seaweedfs + server 进程跑全套 E2E。
      - name: start seaweedfs (S3)
        run: |
          # 与 docker-compose.yml 同款 identity 配置：无 s3.json 时 seaweedfs
          # 对匿名 allow-all，但携带未知 accessKey 的 presigned 请求会 403。
          docker run -d --name seaweedfs --entrypoint /bin/sh \
            -p 8333:8333 -p 9333:9333 \
            chrislusf/seaweedfs:4.41 -c "mkdir -p /etc/seaweedfs && \
              printf '{\"identities\":[{\"name\":\"ci\",\"credentials\":[{\"accessKey\":\"ci\",\"secretKey\":\"ci-secret-key\"}],\"actions\":[\"Read\",\"Write\",\"List\",\"Tagging\",\"Admin\"]}]}\\n' > /etc/seaweedfs/s3.json && \
              exec weed server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9333/dir/status > /dev/null; then
              echo "seaweedfs ready after $i probes"; exit 0
            fi
            sleep 2
          done
          echo "seaweedfs not ready"; docker logs seaweedfs; exit 1

      - name: start backend server
        env:
          S3_ENDPOINT: http://localhost:8333
          S3_PUBLIC_ENDPOINT: http://localhost:8333
          S3_BUCKET: hotspot
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret-key
          # test 环境：中间件跳过限流（与 docker-compose.dev.yml 的 backend-test 一致），
          # 避免 ~90 个用例互相触发限流桶。
          APP_ENV: test
        run: |
          cd backend-go
          go run ./cmd/server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' -d '{}' \
              http://localhost:8081/public/v1/system/health > /dev/null; then
              echo "backend ready after $i probes"; exit 0
            fi
            sleep 2
          done
          echo "backend not ready"; tail -100 /tmp/backend.log; exit 1

      - name: run HTTP end-to-end integration tests
        env:
          BACKEND_URL: http://localhost:8081
          S3_ENDPOINT: http://localhost:8333
          S3_PUBLIC_ENDPOINT: http://localhost:8333
          S3_BUCKET: hotspot
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret-key
          APP_ENV: test
        run: |
          cd backend-go
          go test -v -count=1 ./test/integration

      - name: print backend log on failure
        if: failure()
        run: tail -200 /tmp/backend.log


  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: bun install
        run: bun install --cwd frontend
      - name: type-check (svelte-check)
        run: bun run --cwd frontend check
      - name: unit tests (vitest)
        run: bun run --cwd frontend test
      - name: bun build
        run: bun run --cwd frontend build
