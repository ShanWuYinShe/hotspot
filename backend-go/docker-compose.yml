services:
  # ── Storage ────────────────────────────────────────────────────────
  postgres:
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_DB: hotspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.21
    command: server -s3 -dir=/seaweedfs/data
    ports:
      - "9333:9333"  # Master + S3 API
      - "8333:8333"  # S3 gateway
    volumes:
      - ./.local/seaweedfs-data:/seaweedfs/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/dir/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      APP_HOST: 0.0.0.0
      APP_PORT: "8081"
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/hotspot?sslmode=disable
      AUTH_TOKEN_SECRET: test-secret-do-not-use-in-prod
      APP_NAME: hotspot-backend-go
      # S3 / SeaweedFS — swap these 6 vars to point at real AWS S3 in production
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: hotspot
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_FORCE_PATH_STYLE: "true"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/api/v1/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Test ───────────────────────────────────────────────────────────
  integration-test:
    build:
      context: .
      dockerfile: test/integration/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8081
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/hotspot?sslmode=disable
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./.local/test-results:/test-results
    working_dir: /test
    command: ["go", "test", "-v", "-count=1", "-timeout=180s", "./test/integration/..."]

volumes:
  postgres_data:
  seaweedfs_data:
