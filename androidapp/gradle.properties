# JVM 参数：Compose 编译 + Kotlin 2.4 需要足够堆
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 不使用常驻 Gradle 守护进程（CI 与本地收尾纪律：长驻进程必须清理）
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9.2 推荐项：用 useConstraints=false 替代已废弃的
# android.dependency.excludeLibraryComponentsFromConstraints
android.dependency.useConstraints=false
# AGP 内部使用已废弃 Gradle API，以 summary 粒度展示而不是完全压制警告
org.gradle.warning.mode=summary
android.uniquePackageNames=false
# 首次构建若需通过本机代理下载依赖，取消注释以下两行（不要把代理写进代码）：
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=10809
