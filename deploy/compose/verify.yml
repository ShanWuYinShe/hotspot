services:
  postgres:
    image: ${HOTSPOT_VERIFY_POSTGRES_IMAGE:-postgres:18.3-alpine3.23}
    environment:
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: hotspot
      POSTGRES_DB: hotspot
    labels:
      hotspot.role: verify-postgres
      hotspot.display.name: PostgreSQL
      hotspot.postgres.user: hotspot
      hotspot.postgres.db: hotspot
      hotspot.postgres.port: "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot -d hotspot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${HOTSPOT_VERIFY_REDIS_IMAGE:-redis:8.6.2-alpine3.23}
    labels:
      hotspot.role: verify-redis
      hotspot.display.name: Redis
      hotspot.redis.db: "0"
      hotspot.redis.port: "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: ${HOTSPOT_VERIFY_MINIO_IMAGE:?set HOTSPOT_VERIFY_MINIO_IMAGE}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    labels:
      hotspot.role: verify-minio
      hotspot.display.name: MinIO
      hotspot.minio.root_user: ${MINIO_ROOT_USER:-minioadmin}
      hotspot.minio.api_port: "9000"
      hotspot.minio.console_port: "9001"
    command:
      - server
      - /data
      - --console-address
      - :9001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-go-verify:
    image: ${HOTSPOT_BACKEND_GO_RUNNER_IMAGE:?set HOTSPOT_BACKEND_GO_RUNNER_IMAGE}
    user: "${HOTSPOT_DOCKER_UID:?set HOTSPOT_DOCKER_UID}:${HOTSPOT_DOCKER_GID:?set HOTSPOT_DOCKER_GID}"
    working_dir: /workspace/backend-go
    labels:
      hotspot.role: verify-backend-go
      hotspot.display.name: Backend Go Verify
      hotspot.backend.mode: verify
      hotspot.backend.port: "8080"
      hotspot.backend.postgres_db: hotspot
      hotspot.backend.redis_db: "0"
    command:
      - sh
      - -c
      - rm -rf /tmp/workspace && mkdir -p /tmp/workspace/backend-go && cp -a /workspace/backend-go/. /tmp/workspace/backend-go/ && cd /tmp/workspace/backend-go && go run ./cmd/migrate && go test ./...
    environment:
      HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}
      XDG_CACHE_HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}/.cache
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      AUTH_TOKEN_SECRET: test-secret
      POSTGRES_DSN: postgres://hotspot:hotspot@postgres:5432/hotspot?sslmode=disable
      REDIS_DSN: redis://redis:6379/0
    volumes:
      - ${HOTSPOT_SOURCE_ROOT:?set HOTSPOT_SOURCE_ROOT}:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-verify:
    image: ${HOTSPOT_FRONTEND_RUNNER_IMAGE:?set HOTSPOT_FRONTEND_RUNNER_IMAGE}
    user: "${HOTSPOT_DOCKER_UID:?set HOTSPOT_DOCKER_UID}:${HOTSPOT_DOCKER_GID:?set HOTSPOT_DOCKER_GID}"
    working_dir: /workspace/frontend_svelte
    labels:
      hotspot.role: verify-frontend
      hotspot.display.name: Frontend Verify
      hotspot.frontend.mode: verify
      hotspot.frontend.origin: https://localhost:8443
      hotspot.frontend.port: "3000"
    command:
      - sh
      - -c
      - rm -rf /tmp/workspace && mkdir -p /tmp/workspace/frontend_svelte && cp -a /workspace/frontend_svelte/. /tmp/workspace/frontend_svelte/ && cd /tmp/workspace/frontend_svelte && pnpm install --frozen-lockfile && pnpm check && pnpm build --mode test
    environment:
      HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}
      XDG_CACHE_HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}/.cache
      ORIGIN: https://localhost:8443
      VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
      VITE_AMAP_SERVICE_HOST: /_AMapService
      CI: "true"
    volumes:
      - ${HOTSPOT_SOURCE_ROOT:?set HOTSPOT_SOURCE_ROOT}:/workspace:ro

  backend-go-inspect:
    image: ${HOTSPOT_BACKEND_GO_RUNNER_IMAGE:?set HOTSPOT_BACKEND_GO_RUNNER_IMAGE}
    user: "${HOTSPOT_DOCKER_UID:?set HOTSPOT_DOCKER_UID}:${HOTSPOT_DOCKER_GID:?set HOTSPOT_DOCKER_GID}"
    working_dir: /workspace/backend-go
    labels:
      hotspot.role: inspect-backend-go
      hotspot.display.name: Backend Go Inspect
      hotspot.backend.mode: inspect
      hotspot.backend.app_env: development
      hotspot.backend.log_level: debug
      hotspot.backend.port: "8080"
      hotspot.backend.postgres_db: hotspot
      hotspot.backend.redis_db: "0"
    command:
      - sh
      - -c
      - rm -rf /tmp/workspace && mkdir -p /tmp/workspace/backend-go && cp -a /workspace/backend-go/. /tmp/workspace/backend-go/ && cd /tmp/workspace/backend-go && go run ./cmd/migrate && go run ./cmd/server
    environment:
      HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}
      XDG_CACHE_HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}/.cache
      APP_ENV: development
      LOG_LEVEL: debug
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      AUTH_TOKEN_SECRET: test-secret
      POSTGRES_DSN: postgres://hotspot:hotspot@postgres:5432/hotspot?sslmode=disable
      REDIS_DSN: redis://redis:6379/0
    volumes:
      - ${HOTSPOT_SOURCE_ROOT:?set HOTSPOT_SOURCE_ROOT}:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-inspect:
    image: ${HOTSPOT_FRONTEND_RUNNER_IMAGE:?set HOTSPOT_FRONTEND_RUNNER_IMAGE}
    user: "${HOTSPOT_DOCKER_UID:?set HOTSPOT_DOCKER_UID}:${HOTSPOT_DOCKER_GID:?set HOTSPOT_DOCKER_GID}"
    working_dir: /workspace/frontend_svelte
    labels:
      hotspot.role: inspect-frontend
      hotspot.display.name: Frontend Inspect
      hotspot.frontend.mode: inspect
      hotspot.frontend.run_mode: dev
      hotspot.frontend.port: "3000"
      hotspot.frontend.origin: ${HOTSPOT_VERIFY_INSPECT_BASE_URL:-http://verify-inspect-nginx}
    command:
      - sh
      - -c
      - rm -rf /tmp/workspace && mkdir -p /tmp/workspace/frontend_svelte && cp -a /workspace/frontend_svelte/. /tmp/workspace/frontend_svelte/ && cd /tmp/workspace/frontend_svelte && pnpm install --frozen-lockfile && ORIGIN=${HOTSPOT_VERIFY_INSPECT_BASE_URL:-http://verify-inspect-nginx} pnpm exec vite dev --host 0.0.0.0 --port 3000 --strictPort
    environment:
      HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}
      XDG_CACHE_HOME: ${HOTSPOT_RUNNER_HOME:?set HOTSPOT_RUNNER_HOME}/.cache
      VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
      VITE_AMAP_SERVICE_HOST: /_AMapService
      CI: "true"
      HOTSPOT_VERIFY_INSPECT_BASE_URL: ${HOTSPOT_VERIFY_INSPECT_BASE_URL:-http://verify-inspect-nginx}
    volumes:
      - ${HOTSPOT_SOURCE_ROOT:?set HOTSPOT_SOURCE_ROOT}:/workspace:ro
    depends_on:
      backend-go-inspect:
        condition: service_started

  verify-inspect-nginx:
    image: ${HOTSPOT_VERIFY_NGINX_IMAGE:-nginx:1.28.3-alpine3.23}
    labels:
      hotspot.role: inspect-nginx
      hotspot.display.name: Verify Inspect Nginx
      hotspot.nginx.listen_port: "80"
      hotspot.nginx.public_http_port: ${HOTSPOT_VERIFY_INSPECT_HTTP_PORT:-38088}
      hotspot.nginx.routes: "/,/api/v1/,/ws/v1,/s3/"
    ports:
      - "${HOTSPOT_VERIFY_INSPECT_HTTP_PORT:-38088}:80"
    environment:
      HOTSPOT_VERIFY_INSPECT_HTTP_PORT: ${HOTSPOT_VERIFY_INSPECT_HTTP_PORT:-38088}
      VITE_AMAP_JSCODE: ${VITE_AMAP_JSCODE:-}
    volumes:
      - ../nginx/hotspot.verify.nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend-go-inspect:
        condition: service_started
      frontend-inspect:
        condition: service_started
      minio:
        condition: service_healthy
