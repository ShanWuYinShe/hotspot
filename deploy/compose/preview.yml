services:
  postgres:
    image: ${HOTSPOT_PREVIEW_POSTGRES_IMAGE:-postgres:18.3-alpine3.23}
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: hotspot
      POSTGRES_DB: hotspot
    labels:
      hotspot.role: preview-postgres
      hotspot.display.name: PostgreSQL
      hotspot.postgres.user: hotspot
      hotspot.postgres.db: hotspot
      hotspot.postgres.port: "5432"
    volumes:
      - preview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot -d hotspot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hotspot-preview

  redis:
    image: ${HOTSPOT_PREVIEW_REDIS_IMAGE:-redis:8.6.2-alpine3.23}
    restart: unless-stopped
    labels:
      hotspot.role: preview-redis
      hotspot.display.name: Redis
      hotspot.redis.db: "0"
      hotspot.redis.port: "6379"
    volumes:
      - preview_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hotspot-preview

  minio:
    image: ${HOTSPOT_PREVIEW_MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    labels:
      hotspot.role: preview-minio
      hotspot.display.name: MinIO
      hotspot.minio.root_user: ${MINIO_ROOT_USER:-minioadmin}
      hotspot.minio.api_port: "9000"
      hotspot.minio.console_port: "9001"
    command: server /data --console-address ":9001"
    volumes:
      - preview_minio_data:/data
    networks:
      - hotspot-preview

  backend:
    image: ${HOTSPOT_PREVIEW_BACKEND_IMAGE:?set HOTSPOT_PREVIEW_BACKEND_IMAGE}
    restart: unless-stopped
    labels:
      hotspot.role: preview-backend-go
      hotspot.display.name: Backend Go Preview
      hotspot.backend.mode: preview
      hotspot.backend.port: "8080"
      hotspot.backend.postgres_db: hotspot
      hotspot.backend.redis_db: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://127.0.0.1:8080/api/v1/system/health -H 'Content-Type: application/json' -d '{}' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      POSTGRES_DSN: postgres://hotspot:hotspot@postgres:5432/hotspot?sslmode=disable
      REDIS_DSN: redis://redis:6379/0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-secret-change-me}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL:-support@example.com}
      APP_PRIVACY_POLICY_URL: ${APP_PRIVACY_POLICY_URL:-https://localhost:8443/privacy}
      APP_TERMS_OF_SERVICE_URL: ${APP_TERMS_OF_SERVICE_URL:-https://localhost:8443/terms}
      APP_OFFICIAL_WEBSITE_URL: ${APP_OFFICIAL_WEBSITE_URL:-https://localhost:8443}
      APP_DEFAULT_USER_AVATAR_URL: ${APP_DEFAULT_USER_AVATAR_URL:-}
      APP_DEFAULT_GROUP_AVATAR_URL: ${APP_DEFAULT_GROUP_AVATAR_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotspot-preview

  frontend:
    image: ${HOTSPOT_PREVIEW_FRONTEND_IMAGE:?set HOTSPOT_PREVIEW_FRONTEND_IMAGE}
    restart: unless-stopped
    labels:
      hotspot.role: preview-frontend
      hotspot.display.name: Frontend Preview
      hotspot.frontend.mode: preview
      hotspot.frontend.port: "3000"
      hotspot.frontend.origin: ${HOTSPOT_PREVIEW_PUBLIC_ORIGIN:-https://localhost:8443}
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: ${HOTSPOT_PREVIEW_PUBLIC_ORIGIN:-https://localhost:8443}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hotspot-preview

  nginx:
    image: ${HOTSPOT_PREVIEW_NGINX_IMAGE:-nginx:1.28.3-alpine3.23}
    restart: unless-stopped
    labels:
      hotspot.role: preview-nginx
      hotspot.display.name: Preview Nginx
      hotspot.nginx.http_port: ${HOTSPOT_PREVIEW_HTTP_PORT:-8088}
      hotspot.nginx.https_port: ${HOTSPOT_PREVIEW_HTTPS_PORT:-8443}
      hotspot.nginx.routes: "/,/api/v1/,/ws/v1,/s3/"
    ports:
      - "${HOTSPOT_PREVIEW_HTTP_PORT:-8088}:80"
      - "${HOTSPOT_PREVIEW_HTTPS_PORT:-8443}:443"
    environment:
      HOTSPOT_HTTPS_REDIRECT_PORT: ${HOTSPOT_PREVIEW_HTTPS_PORT:-8443}
      HOTSPOT_AMAP_JSCODE: ${HOTSPOT_AMAP_JSCODE:-}
    volumes:
      - ../nginx/hotspot.preview.nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${HOTSPOT_TLS_CERT_PATH:?set HOTSPOT_TLS_CERT_PATH}:/etc/nginx/certs/tls.crt:ro
      - ${HOTSPOT_TLS_KEY_PATH:?set HOTSPOT_TLS_KEY_PATH}:/etc/nginx/certs/tls.key:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - hotspot-preview

volumes:
  preview_postgres_data:
  preview_redis_data:
  preview_minio_data:

networks:
  hotspot-preview:
    driver: bridge
