services:
  postgres:
    image: ${HOTSPOT_PREVIEW_POSTGRES_IMAGE:-postgres:latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: hotspot
      POSTGRES_DB: hotspot
    volumes:
      - preview_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot -d hotspot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hotspot-preview

  redis:
    image: ${HOTSPOT_PREVIEW_REDIS_IMAGE:-redis:latest}
    restart: unless-stopped
    volumes:
      - preview_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hotspot-preview

  minio:
    image: ${HOTSPOT_PREVIEW_MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - preview_minio_data:/data
    networks:
      - hotspot-preview

  createbuckets:
    image: ${HOTSPOT_PREVIEW_MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      attempts=0;
      until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null 2>&1; do
        attempts=$$((attempts + 1));
        if [ $$attempts -ge 30 ]; then
          echo 'minio did not become reachable in time' >&2;
          exit 1;
        fi;
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET:-hotspot};
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET:-hotspot};
      exit 0;
      "
    networks:
      - hotspot-preview

  backend:
    image: ${HOTSPOT_PREVIEW_BACKEND_IMAGE:?set HOTSPOT_PREVIEW_BACKEND_IMAGE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://127.0.0.1:8080/api/v1/system/health -H 'Content-Type: application/json' -d '{}' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      POSTGRES_DSN: postgres://hotspot:hotspot@postgres:5432/hotspot?sslmode=disable
      REDIS_DSN: redis://redis:6379/0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-secret-change-me}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL:-support@example.com}
      APP_PRIVACY_POLICY_URL: ${APP_PRIVACY_POLICY_URL:-https://localhost:8443/privacy}
      APP_TERMS_OF_SERVICE_URL: ${APP_TERMS_OF_SERVICE_URL:-https://localhost:8443/terms}
      APP_OFFICIAL_WEBSITE_URL: ${APP_OFFICIAL_WEBSITE_URL:-https://localhost:8443}
      APP_DEFAULT_USER_AVATAR_URL: ${APP_DEFAULT_USER_AVATAR_URL:-}
      APP_DEFAULT_GROUP_AVATAR_URL: ${APP_DEFAULT_GROUP_AVATAR_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotspot-preview

  frontend:
    image: ${HOTSPOT_PREVIEW_FRONTEND_IMAGE:?set HOTSPOT_PREVIEW_FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: ${HOTSPOT_PREVIEW_PUBLIC_ORIGIN:-https://localhost:8443}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hotspot-preview

  nginx:
    image: ${HOTSPOT_PREVIEW_NGINX_IMAGE:-nginx:latest}
    restart: unless-stopped
    ports:
      - "${HOTSPOT_PREVIEW_HTTP_PORT:-8088}:80"
      - "${HOTSPOT_PREVIEW_HTTPS_PORT:-8443}:443"
    environment:
      HOTSPOT_HTTPS_REDIRECT_PORT: ${HOTSPOT_PREVIEW_HTTPS_PORT:-8443}
    volumes:
      - ../nginx/hotspot.preview.nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${HOTSPOT_TLS_CERT_PATH:?set HOTSPOT_TLS_CERT_PATH}:/etc/nginx/certs/tls.crt:ro
      - ${HOTSPOT_TLS_KEY_PATH:?set HOTSPOT_TLS_KEY_PATH}:/etc/nginx/certs/tls.key:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    networks:
      - hotspot-preview

volumes:
  preview_postgres_data:
  preview_redis_data:
  preview_minio_data:

networks:
  hotspot-preview:
    driver: bridge
