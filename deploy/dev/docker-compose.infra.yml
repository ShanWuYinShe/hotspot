version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: hotspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: hotspot
      POSTGRES_DB: hotspot
    ports:
      - "${HOTSPOT_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotspot-net

  redis:
    image: redis:7-alpine
    container_name: hotspot-redis
    restart: unless-stopped
    ports:
      - "${HOTSPOT_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotspot-net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: hotspot-minio
    restart: unless-stopped
    ports:
      - "${HOTSPOT_MINIO_API_HOST_PORT:-9000}:9000"
      - "${HOTSPOT_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hotspot-net

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - hotspot-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/hotspot;
      /usr/bin/mc anonymous set download myminio/hotspot;
      exit 0;
      "

networks:
  hotspot-net:
    driver: bridge
