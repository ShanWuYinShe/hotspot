version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hotspot-backend
    restart: unless-stopped
    profiles:
      - runtime
    ports:
      - "${HOTSPOT_BACKEND_HOST_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql://hotspot:hotspot@postgres:5432/hotspot
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=hotspot
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_PUBLIC_BASE=/s3
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=dev_secret_key_change_in_prod
      - SUPER_ADMIN_LOGIN_ID=superadmin
      - SUPER_ADMIN_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - hotspot-net

  frontend:
    build:
      context: ../frontend_svelte
      dockerfile: Dockerfile
    container_name: hotspot-frontend
    restart: unless-stopped
    profiles:
      - runtime
    ports:
      - "${HOTSPOT_FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - ORIGIN=http://localhost:8888
    depends_on:
      - backend
    networks:
      - hotspot-net

  nginx:
    image: nginx:1.25-alpine
    container_name: hotspot-nginx
    restart: unless-stopped
    profiles:
      - runtime
    ports:
      - "${HOTSPOT_NGINX_HTTP_PORT:-8888}:8888"
    volumes:
      - ../nginx/hotspot.test.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - hotspot-net

networks:
  hotspot-net:
    driver: bridge
