version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hotspot-backend
    restart: unless-stopped
    ports:
      - "${HOTSPOT_BACKEND_HOST_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - REDIS_URL=${REDIS_URL:?set REDIS_URL}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-hotspot}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_PUBLIC_BASE=/s3
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - SUPER_ADMIN_LOGIN_ID=${SUPER_ADMIN_LOGIN_ID:-superadmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - hotspot-net

  frontend:
    build:
      context: ../frontend_svelte
      dockerfile: Dockerfile
    container_name: hotspot-frontend
    restart: unless-stopped
    ports:
      - "${HOTSPOT_FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - ORIGIN=${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
    depends_on:
      - backend
    networks:
      - hotspot-net

  nginx:
    image: nginx:1.25-alpine
    container_name: hotspot-nginx
    restart: unless-stopped
    ports:
      - "${HOTSPOT_NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/hotspot.test.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - hotspot-net

networks:
  hotspot-net:
    driver: bridge
