version: '3.8'

services:
  # Database
  # 该容器同时用于本地 Docker 开发和 SQLx prepare / cargo check / cargo test 预备环境
  postgres:
    image: postgis/postgis:15-3.3
    container_name: hotspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: hotspot
      POSTGRES_DB: hotspot
    ports:
      - "${HOTSPOT_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotspot-net

  # Cache
  redis:
    image: redis:7-alpine
    container_name: hotspot-redis
    restart: unless-stopped
    ports:
      - "${HOTSPOT_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotspot-net

  # Test Cache
  redis-test:
    image: redis:7-alpine
    container_name: hotspot-redis-test
    restart: unless-stopped
    ports:
      - "${HOTSPOT_TEST_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotspot-net

  # Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: hotspot-minio
    restart: unless-stopped
    ports:
      - "${HOTSPOT_MINIO_API_HOST_PORT:-9000}:9000"
      - "${HOTSPOT_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hotspot-net

  # MinIO Client - Initialize bucket and policy
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - hotspot-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/hotspot;
      /usr/bin/mc anonymous set download myminio/hotspot;
      exit 0;
      "

  # Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotspot-backend
    restart: unless-stopped
    profiles:
      - runtime
    ports:
      - "${HOTSPOT_BACKEND_HOST_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql://hotspot:hotspot@postgres:5432/hotspot
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=hotspot
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      # S3_PUBLIC_BASE: presigned URL 前缀
      # Docker 环境推荐使用 /s3（相对路径），通过 Nginx 转发到 MinIO
      - S3_PUBLIC_BASE=/s3
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=dev_secret_key_change_in_prod
      - SUPER_ADMIN_LOGIN_ID=superadmin
      - SUPER_ADMIN_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - hotspot-net

  # Frontend Web App (SvelteKit + adapter-node)
  frontend:
    build:
      context: ./frontend_svelte
      dockerfile: Dockerfile
    container_name: hotspot-frontend
    restart: unless-stopped
    profiles:
      - runtime
    ports:
      - "${HOTSPOT_FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # SvelteKit CSRF origin（与 Nginx 入口域名一致）
      - ORIGIN=http://localhost:8888
    depends_on:
      - backend
    networks:
      - hotspot-net

volumes:
  postgres_data:
  redis_data:
  redis_test_data:
  minio_data:

networks:
  hotspot-net:
    driver: bridge
