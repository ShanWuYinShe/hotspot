upstream backend {
    server backend:8081;
}

# ── 请求追踪 ID（http 层）────────────────────────────────────────
# spec api_spec_base.md：客户端可选携带 X-Request-Id，服务端必须原样回显；未携带
# 才由服务端生成。此前 location 直接覆盖为 $request_id，客户端传入的 trace id
# 永远丢失。map 保证「有则透传、无则生成」，后端 RequestIDMiddleware 原样回显。
map $http_x_request_id $hotspot_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream frontend {
    server frontend:5173;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
    # 媒体对象 GET 复用长连接（/s3/ 见 docker/nginx.dev.proxy.inc）：与 location 内
    # proxy_http_version 1.1 + proxy_set_header Connection "" 配套。与仓库
    # nginx.conf / nginx.prod-tls.conf 的 upstream 段保持同步。
    keepalive 32;
}

# ── 分享链接爬虫判定（share OG 预览）────────────────────────────
# 知名链接预览爬虫 UA 子串 → $share_crawler=1；location /share/ 据此分流：
# 爬虫拿后端 GET /share/{code} 极简 HTML（og 标签，见 share/og.go），
# 真实用户走 SPA /share/[code] 页面。遗漏某平台只影响其摘要卡展示，
# 新增爬虫往 map 追加一行即可。
map $http_user_agent $share_crawler {
    default               0;
    ~*facebookexternalhit 1;
    ~*twitterbot          1;
    ~*telegrambot         1;
    ~*whatsapp            1;
    ~*slackbot            1;
    ~*discordbot          1;
    ~*linkedinbot         1;
    ~*skypeuripreview     1;
    ~*micromessenger      1;
    ~*qq/                 1;
}

# ── 分享页分流组合判定（UA × ?spa=1，与 prod-server.inc 同构）────────────
# 微信/QQ 的内嵌浏览器与它们的预览抓取器共用同一 UA 子串，单靠 UA 无法区分；
# 后端 OG 页 CTA 带 ?spa=1，本 map 让「带 spa=1 的请求一律走 SPA」（含爬虫
# UA），只有「爬虫 UA 且未带 spa=1（或显式 spa=0）」才走后端 OG HTML。否则
# 内嵌浏览器会被 OG 页 CTA 反复送回爬虫分支，SPA 分享页永远打不开。
# $arg_spa 缺失时为空串；显式 spa=0 与缺失同义。
map "$share_crawler|$arg_spa" $share_og {
    default 0;
    "1|"   1;
    "1|0"  1;
}

# 与生产 nginx.conf 保持一致：/osm-service/ 的 limit_req 依赖该 zone 定义
limit_req_zone $binary_remote_addr zone=osm_service:1m rate=1r/s;
# 与生产同口径：超限统一 429（响应体在 server 的 @rate_limited；dev 无 api 限流桶，
# 仅 /osm-service/ 会触发，但保持前端错误处理路径与 prod 一致）。
limit_req_status 429;

# 与生产 nginx.conf 保持一致：/osm-tiles/ 的 proxy_cache 依赖该缓存区定义
proxy_cache_path /var/cache/nginx/osm_tiles levels=1:2 keys_zone=osm_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# 与生产 nginx.conf 保持一致：/amap-tiles/ 的 proxy_cache 依赖该缓存区定义
proxy_cache_path /var/cache/nginx/amap_tiles levels=1:2 keys_zone=amap_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# 与生产 nginx.conf 保持一致：/s3/ 的 proxy_cache 依赖该缓存区定义
proxy_cache_path /var/cache/nginx/s3_media levels=1:2 keys_zone=s3_media:10m
    max_size=512m inactive=7d use_temp_path=off;
# 说明：/s3/ 媒体缓存与生产同口径（见 docker/nginx.dev.proxy.inc 的 /s3/），
# 便于本地验证「忽略 presigned query 的命中行为」。
# 而 /fonts/、/icons/、/manifest.webmanifest、/favicon.png 的静态长缓存只在
# docker/nginx.conf 与 docker/prod-server.inc（生产构建产物直出）实现：dev 网关
# 的前端是 Vite dev server（下方 location / 全量反代），源码每次请求现编译，
# 加长缓存只会让本地调试看不到改动——这是有意的语义差异，不是漏同步。
# 本地验证静态缓存头请走 docker compose --profile prod 的构建产物镜像。

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;

    # ── 安全响应头（dev）─────────────────────────────────────
    # 基础安全头与生产一致（headers.inc）；**不加 CSP**——Vite HMR 需要 inline
    # script/eval 与 blob worker，CSP 是生产专用片段（docker/nginx.csp.inc，
    # 仅 nginx.conf / prod-server.inc include）。2026-10-31 前 CSP 混在 headers.inc
    # 里被 dev 一并继承，导致控制台报 worker-src blob 拦截，已拆分修正。
    include /etc/nginx/conf.d/headers.inc;

    # ── 限流超限统一响应（与生产同形，见 prod-server.inc）─────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":10500,"message":"请求过于频繁"}';
    }

    # ── REST API ──────────────────────────────────────────────
    # 存活探针（全站约定 GET /healthz）
    location = /healthz {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
        # dev 网关无 TLS:后端凭证 Cookie 带 Secure,在 HTTP 非 localhost(局域网
        # IP/手机访问)会被浏览器整体拒收,刷新即丢身份(localhost 有 Chrome 豁免
        # 不受影响)。dev 在网关剥 Secure;prod 走 HTTPS,nginx.conf 保持契约原样。
        proxy_cookie_flags ~(access_token|refresh_token|device_id) nosecure;
    }

    # ── 匿名节点 API（/public/v1，纯匿名：认证入口+匿名浏览+系统信息）──
    location /public/ {
        client_max_body_size 2m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
        # dev 网关无 TLS:后端凭证 Cookie 带 Secure,在 HTTP 非 localhost(局域网
        # IP/手机访问)会被浏览器整体拒收,刷新即丢身份(localhost 有 Chrome 豁免
        # 不受影响)。dev 在网关剥 Secure;prod 走 HTTPS,nginx.conf 保持契约原样。
        proxy_cookie_flags ~(access_token|refresh_token|device_id) nosecure;
    }

    # ── 平台管理 API（/admin/api/v1 独立节点）────────────────────
    # 仅代理 /admin/api/v1 API 节点；/admin/* 前端页面路由须回落给 SPA（深链/刷新可达）
    location /admin/api/v1/ {
        client_max_body_size 2m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
        # dev 网关无 TLS:后端凭证 Cookie 带 Secure,在 HTTP 非 localhost(局域网
        # IP/手机访问)会被浏览器整体拒收,刷新即丢身份(localhost 有 Chrome 豁免
        # 不受影响)。dev 在网关剥 Secure;prod 走 HTTPS,nginx.conf 保持契约原样。
        proxy_cookie_flags ~(access_token|refresh_token|device_id) nosecure;
    }

    # ── 共享代理（/ws/ WebSocket、/s3/ SeaweedFS S3）────────
    include /etc/nginx/conf.d/proxy.inc;

    # ── 高德地图安全代理（由 amap.conf 注入 jscode）────
    include /etc/nginx/conf.d/amap.inc;

    # ── 分享链接爬虫预览（OG meta，与 prod-server.inc 的 /share/ 同构）──
    # 默认代理 Vite（SPA /share/[code]）；爬虫 UA 且未带 spa=1（$share_og=1）
    # 时 if 内 proxy_pass 覆盖默认分支，转给后端 OG HTML。带 ?spa=1 的请求
    # （OG 页 CTA）一律走 SPA，微信/QQ 内嵌浏览器由此跳出爬虫分支。
    location /share/ {
        proxy_pass http://frontend;
        # $http_host（含端口）而非 $host：dev 经 :8888 访问时后端 OG 页用请求 Host
        # 生成绝对 og:url/og:image，$host 丢端口会拼出 http://localhost/... 的错链。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($share_og) {
            proxy_pass http://backend;
        }
    }

    # ── Frontend (SvelteKit Vite HMR) ─────────────────────────
    # proxy_buffering off：HMR/SSE 实时推送不被 nginx 缓冲延迟
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
