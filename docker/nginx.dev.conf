upstream backend {
    server backend:8081;
}

upstream frontend {
    server frontend:5173;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;

    # ── 安全响应头（dev）─────────────────────────────────────
    # 与生产保持一致的基础安全头；不加 CSP（Vite HMR 需要 inline script/eval）。
    include /etc/nginx/conf.d/headers.inc;

    # ── REST API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 匿名节点 API（/public/v1，纯匿名：认证入口+匿名浏览+系统信息）──
    location /public/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 平台管理 API（/admin/v1 独立节点）────────────────────
    # 仅代理 /admin/v1 API 节点；/admin/* 前端页面路由须回落给 SPA（深链/刷新可达）
    location /admin/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 共享代理（/ws/ WebSocket、/s3/ SeaweedFS S3）────────
    include /etc/nginx/conf.d/proxy.inc;

    # ── 高德地图安全代理（由 amap.conf 注入 jscode）────
    include /etc/nginx/conf.d/amap.inc;

    # ── Frontend (SvelteKit Vite HMR) ─────────────────────────
    # proxy_buffering off：HMR/SSE 实时推送不被 nginx 缓冲延迟
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
