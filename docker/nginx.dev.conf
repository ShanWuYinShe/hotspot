upstream backend {
    server backend:8081;
}

upstream frontend {
    server frontend:5173;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

# ── 分享链接爬虫判定（share OG 预览）────────────────────────────
# 知名链接预览爬虫 UA 子串 → $share_crawler=1；location /share/ 据此分流：
# 爬虫拿后端 GET /share/{code} 极简 HTML（og 标签，见 share/og.go），
# 真实用户走 SPA /share/[code] 页面。遗漏某平台只影响其摘要卡展示，
# 新增爬虫往 map 追加一行即可。
map $http_user_agent $share_crawler {
    default               0;
    ~*facebookexternalhit 1;
    ~*twitterbot          1;
    ~*telegrambot         1;
    ~*whatsapp            1;
    ~*slackbot            1;
    ~*discordbot          1;
    ~*linkedinbot         1;
    ~*skypeuripreview     1;
    ~*micromessenger      1;
    ~*qq/                 1;
}

# 与生产 nginx.conf 保持一致：/osm-service/ 的 limit_req 依赖该 zone 定义
limit_req_zone $binary_remote_addr zone=osm_service:1m rate=1r/s;

# 与生产 nginx.conf 保持一致：/osm-tiles/ 的 proxy_cache 依赖该缓存区定义
proxy_cache_path /var/cache/nginx/osm_tiles levels=1:2 keys_zone=osm_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# 与生产 nginx.conf 保持一致：/amap-tiles/ 的 proxy_cache 依赖该缓存区定义
proxy_cache_path /var/cache/nginx/amap_tiles levels=1:2 keys_zone=amap_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;

    # ── 安全响应头（dev）─────────────────────────────────────
    # 与生产保持一致的基础安全头；不加 CSP（Vite HMR 需要 inline script/eval）。
    include /etc/nginx/conf.d/headers.inc;

    # ── REST API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 匿名节点 API（/public/v1，纯匿名：认证入口+匿名浏览+系统信息）──
    location /public/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 平台管理 API（/admin/v1 独立节点）────────────────────
    # 仅代理 /admin/v1 API 节点；/admin/* 前端页面路由须回落给 SPA（深链/刷新可达）
    location /admin/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 共享代理（/ws/ WebSocket、/s3/ SeaweedFS S3）────────
    include /etc/nginx/conf.d/proxy.inc;

    # ── 高德地图安全代理（由 amap.conf 注入 jscode）────
    include /etc/nginx/conf.d/amap.inc;

    # ── 分享链接爬虫预览（OG meta，与 prod-server.inc 的 /share/ 同构）──
    # 默认代理 Vite（SPA /share/[code]）；爬虫 UA 命中 $share_crawler 时
    # if 内 proxy_pass 覆盖默认分支，转给后端 OG HTML。
    location /share/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($share_crawler) {
            proxy_pass http://backend;
        }
    }

    # ── Frontend (SvelteKit Vite HMR) ─────────────────────────
    # proxy_buffering off：HMR/SSE 实时推送不被 nginx 缓冲延迟
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
