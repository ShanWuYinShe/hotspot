# nginx 主配置（覆盖镜像默认 /etc/nginx/nginx.conf）：统一网关并发上限。
#
# 背景：官方镜像默认 worker_connections=1024，而后端 WS_MAX_CONNECTIONS 默认
# 10000；每个 WebSocket 在网关占用 2 条连接（客户端 + 上游），默认值约 500 个
# 在线 WS 即先于后端上限触顶（2026-11-08 审计）。本文件把每 worker 连接数提到
# 16384，并配 worker_rlimit_nofile；容器 ulimits.nofile 由 docker-compose.yml
# 统一给到 65535（soft/hard），11k+ 连接不再受 fd 限制。
#
# 同步纪律：本文件被 base compose（dev/CI 网关）与生产 compose 共用挂载；
# 改动必须过 CI「nginx -t (base / dev / prod-tls)」与部署前静态校验。
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # conf.d 片段承载 http 层指令（limit_req_zone / upstream / proxy_cache_path /
    # map）与各环境 server 配置；与镜像默认配置同口径。
    include /etc/nginx/conf.d/*.conf;
}
