# ── HotSpot 生产网关（仓库文件，基于 docker/nginx.conf）──────────────
# 由 docker-compose.prod.yml 挂载，发布流程见 scripts/deploy-production.sh。
# 与仓库基线的差异：
#   1. 80 与 443 双 server 并行服务同一站点——SSL 终止在 Cloudflare（full
#      proxy），源站 443 挂 Origin CA 证书。故意不做 80→443 跳转：
#      若 CF SSL 模式为 flexible，CF 会以 HTTP 回源，跳转会造成重定向循环。
#   2. server{} 内公共部分抽到 server.inc，80/443 两块 include 同一份。
#   3. 仓库基线的 nginx.conf/headers.inc/proxy.inc/amap.inc 仍按原路径挂载，
#      仅 default.conf 被本文件替换。

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin:5m rate=5r/s;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

upstream backend {
    server backend:8081;
    keepalive 32;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    include /etc/nginx/conf.d/server.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/chaoset.pem;
    ssl_certificate_key /etc/nginx/certs/chaoset.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/server.inc;
}
