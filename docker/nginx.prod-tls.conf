# ── HotSpot 生产网关（仓库文件，随 git 发布；基于仓库 docker/nginx.conf）──
# 与仓库基线的差异：
#   1. 80 与 443 双 server 并行服务同一站点——SSL 终止在 Cloudflare（full
#      proxy），源站 443 挂 Origin CA 证书。80 端口不服务业务内容：仅容器内
#      127.0.0.1/::1 的健康检查/部署校验端点，其余请求一律 301 → https。
#      跳转前提：CF SSL 模式为 Full/Full (strict)——CF 回源固定走 443，不会
#      出现 flexible 模式下的重定向循环；若将来切回 flexible 必须去掉该 301。
#   2. 入口鉴权只在 TLS 层做：443 的 Cloudflare Authenticated Origin Pulls
#      （mTLS）在握手阶段校验 CF 回源客户端证书，直连无证书一律 400，请求不会
#      进入业务 location。因此不再维护 CF 回源网段 allow/deny 白名单——旧白名单
#      与下方 real_ip 还原互斥（CF-Connecting-IP 改写后的 $remote_addr 是真实
#      访客 IP，永远匹配不上 CF 网段），是 2026-10-30 全站 403 事故的根因。
#   3. server{} 内公共部分抽到 server.inc，仅 443 使用（80 端点极小，inline）。
#   4. 仓库基线的 nginx.conf/headers.inc/proxy.inc/amap.inc 仍按原路径挂载，
#      仅 default.conf 被本文件替换。

# ── Rate limit zone（http 层；与仓库 nginx.conf 保持同步）──────
# 443 server 内的 real_ip 还原生效后按真实客户端 IP 计数（见下方 443 server）。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin:5m rate=5r/s;
limit_req_zone $binary_remote_addr zone=osm_service:1m rate=1r/s;
# /osm-tiles/ 磁盘缓存（OSM 使用政策：低频回源 + 大力缓存）
proxy_cache_path /var/cache/nginx/osm_tiles levels=1:2 keys_zone=osm_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# ── 高德瓦片磁盘缓存（http 层，与 osm_tiles 同规格；与仓库 nginx.conf 保持同步）──
# /amap-tiles/ 经 proxy_cache 落盘 30 天：瓦片不可变，重复浏览/缩放零回源。
proxy_cache_path /var/cache/nginx/amap_tiles levels=1:2 keys_zone=amap_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

upstream backend {
    server backend:8081;
    keepalive 32;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

# ── 80：不服务业务内容 ──────────────────────────────────────────
# 容器 healthcheck（GET /healthz）与 deploy-production.sh 网关侧校验
# （GET /version.json + /healthz）走容器内 127.0.0.1/::1；其余（含公网直连）
# 一律 301 到 https，随后由 443 的 mTLS 拒绝（无客户端证书 400），拿不到内容。
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 100m;

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /version.json {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443：唯一业务入口（TLS + CF 回源 mTLS 鉴权）────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/chaoset.pem;
    ssl_certificate_key /etc/nginx/certs/chaoset.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare Authenticated Origin Pulls (mTLS，与 workwork 网关同模型)：
    # 边缘 tls_client_auth 已开，CF 回源必带客户端证书；直连无证书一律 400。
    # ⚠️ 这是源站唯一的入口闸（原 CF 网段 allow/deny 白名单已移除）：不得关闭
    # 或降级为 optional，也不得放宽这里信任的 CA 文件。升级为 per-hostname
    # AOP（自备证书）时只需把 CA 文件换成自己的根证书，本段逻辑不变。
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull.pem;
    ssl_verify_client on;

    # ── 真实客户端 IP 还原 ──────────────────────────────────────
    # 能走到本 server 的请求都已通过上面的 mTLS 校验 → 对端必为 Cloudflare
    # 回源，故信任所有对端携带的 CF-Connecting-IP（CF 对每个请求强制覆盖该头，
    # 客户端自带的同名头不可能穿透）。配置里因此不再写死任何 CF 网段：
    #   - limit_req 按真实访客 IP 计数，不再按 CF 边缘 IP 共享桶误伤同 POP 用户；
    #   - X-Real-IP / X-Forwarded-For 与真实访客一致，后端 requestmeta 口径不变。
    # ⚠️ 依赖：ssl_verify_client on 不得关闭，否则任意来源可伪造 CF-Connecting-IP。
    # 仅在本 server 内生效：80 端口（仅本机端点 + 301）不受影响。
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header CF-Connecting-IP;

    # HSTS：仅 443 server 下发（80 端口不能发，见仓库基线注释）。
    # max-age 6 个月 + 含子域；确认 CF 边缘未另行下发避免重复头。
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    include /etc/nginx/conf.d/server.inc;
}

# ── 高德 Web 服务 IPv6 入口 ────────────────────────────────────
# 境外 VPS 到高德 IPv4 CDN 节点大面积丢包，IPv6（阿里 LVS）稳定；
# 静态节点 + max_fails 自动摘除 + proxy_next_upstream 容错。
# 高德调度调整节点时需同步更新（DIG 验证：dig AAAA restapi.amap.com）。
upstream amap_rest {
    server [2408:4001:f00::173]:443 max_fails=2 fail_timeout=15s;
    server [2408:4001:f00::10f7]:443 max_fails=2 fail_timeout=15s;
    keepalive 8;
}

# ── 分享链接爬虫判定（share OG 预览）────────────────────────────
# 知名链接预览爬虫 UA 子串 → $share_crawler=1；prod-server.inc 的
# location /share/ 据此分流：爬虫拿后端 GET /share/{code} 极简 HTML
# （og 标签，见 share/og.go），真实用户走 SPA /share/[code] 页面。
# 遗漏某平台只影响其摘要卡展示，新增爬虫往 map 追加一行即可。
map $http_user_agent $share_crawler {
    default               0;
    ~*facebookexternalhit 1;
    ~*twitterbot          1;
    ~*telegrambot         1;
    ~*whatsapp            1;
    ~*slackbot            1;
    ~*discordbot          1;
    ~*linkedinbot         1;
    ~*skypeuripreview     1;
    ~*micromessenger      1;
    ~*qq/                 1;
}
