# ── 真实客户端 IP 还原（http 层；与仓库 nginx.conf 保持同步，变更时两处同改）──
# 部署拓扑（2026-10-23 确认）：全部流量必经 Cloudflare 回源，源站防火墙/mTLS
# 保证只有 CF 能建连，CF-Connecting-IP 由 CF 强制设置，可信。set_real_ip_from
# 之后的 $binary_remote_addr 即真实客户端 IP：limit_req 不再按 CF 边缘 IP 共享
# 桶误伤同 POP 用户，X-Real-IP 也变为真实客户端 IP。网段清单与仓库基线
# nginx.conf 及 backend-go requestmeta 的 defaultTrustedProxyCIDRs 一致。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Rate limit zone / OSM 缓存（http 层；与仓库 nginx.conf 保持同步）──
# real_ip 还原生效后按真实客户端 IP 计数（见上方还原块注释）。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin:5m rate=5r/s;
limit_req_zone $binary_remote_addr zone=osm_service:1m rate=1r/s;
# /osm-tiles/ 磁盘缓存（OSM 使用政策：低频回源 + 大力缓存）
proxy_cache_path /var/cache/nginx/osm_tiles levels=1:2 keys_zone=osm_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# ── 高德瓦片磁盘缓存（http 层，与 osm_tiles 同规格；与仓库 nginx.conf 保持同步）──
# /amap-tiles/ 经 proxy_cache 落盘 30 天：瓦片不可变，重复浏览/缩放零回源。
proxy_cache_path /var/cache/nginx/amap_tiles levels=1:2 keys_zone=amap_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;
# ── HotSpot 生产网关（仓库文件，随 git 发布；基于仓库 docker/nginx.conf）──
# 与仓库基线的差异：
#   1. 80 与 443 双 server 并行服务同一站点——SSL 终止在 Cloudflare（full
#      proxy），源站 443 挂 Origin CA 证书。故意不做 80→443 跳转：
#      若 CF SSL 模式为 flexible，CF 会以 HTTP 回源，跳转会造成重定向循环。
#   2. server{} 内公共部分抽到 server.inc，80/443 两块 include 同一份。
#   3. 仓库基线的 nginx.conf/headers.inc/proxy.inc/amap.inc 仍按原路径挂载，
#      仅 default.conf 被本文件替换。


gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

upstream backend {
    server backend:8081;
    keepalive 32;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    include /etc/nginx/conf.d/server.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/chaoset.pem;
    ssl_certificate_key /etc/nginx/certs/chaoset.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare Authenticated Origin Pulls (mTLS，与 workwork 网关同模型)：
    # 边缘 tls_client_auth 已开，CF 回源必带客户端证书；直连无证书一律 400。
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull.pem;
    ssl_verify_client on;

    # HSTS：仅 443 server 下发（80 端口不能发，见仓库基线注释）。
    # max-age 6 个月 + 含子域；确认 CF 边缘未另行下发避免重复头。
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    include /etc/nginx/conf.d/server.inc;
}

# ── 高德 Web 服务 IPv6 入口 ────────────────────────────────────
# 境外 VPS 到高德 IPv4 CDN 节点大面积丢包，IPv6（阿里 LVS）稳定；
# 静态节点 + max_fails 自动摘除 + proxy_next_upstream 容错。
# 高德调度调整节点时需同步更新（DIG 验证：dig AAAA restapi.amap.com）。
upstream amap_rest {
    server [2408:4001:f00::173]:443 max_fails=2 fail_timeout=15s;
    server [2408:4001:f00::10f7]:443 max_fails=2 fail_timeout=15s;
    keepalive 8;
}

# ── 分享链接爬虫判定（share OG 预览）────────────────────────────
# 知名链接预览爬虫 UA 子串 → $share_crawler=1；prod-server.inc 的
# location /share/ 据此分流：爬虫拿后端 GET /share/{code} 极简 HTML
# （og 标签，见 share/og.go），真实用户走 SPA /share/[code] 页面。
# 遗漏某平台只影响其摘要卡展示，新增爬虫往 map 追加一行即可。
map $http_user_agent $share_crawler {
    default               0;
    ~*facebookexternalhit 1;
    ~*twitterbot          1;
    ~*telegrambot         1;
    ~*whatsapp            1;
    ~*slackbot            1;
    ~*discordbot          1;
    ~*linkedinbot         1;
    ~*skypeuripreview     1;
    ~*micromessenger      1;
    ~*qq/                 1;
}
