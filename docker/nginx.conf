# 说明：真实客户端 IP 还原（real_ip_header CF-Connecting-IP）只在生产 443
# server 内配置（见 docker/nginx.prod-tls.conf，位于 mTLS 闸之后）；本基线
# 网关用于本地（不经过 Cloudflare），无需还原，也不再写死任何 CF 网段。
#
# 同步纪律：本文件的 location 与生产 443 server 片段 docker/prod-server.inc
# 保持同一套语义——其中「首屏静态资源缓存策略」四段为逐字同步段（见下方标注）；
# /s3/、瓦片等共享代理 location 抽在 docker/nginx.proxy.inc（base 与 prod 共用
# 同一文件，天然同步）；dev 网关用 docker/nginx.dev.proxy.inc（内容同构，
# 差异见该文件头注释）。
#
# ── 请求追踪 ID（http 层）────────────────────────────────────────
# spec api_spec_base.md：客户端可选携带 X-Request-Id，服务端必须原样回显；未携带
# 才由服务端生成。此前 location 直接覆盖为 $request_id，客户端传入的 trace id
# 永远丢失。map 保证「有则透传、无则生成」，后端 RequestIDMiddleware 原样回显。
map $http_x_request_id $hotspot_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# ── Rate limit zone (http context) ───────────────────────────────
# 本文件由 nginx 的 http {} 块 include，故 limit_req_zone 写在顶层即可。
# 按 client IP 限流：每秒 10 个请求，10MB 共享内存（约 16 万个 IP）。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# 平台管理节点独立限流（/admin/api/v1 专属，spec api_spec_base.md「节点与路径架构」）
limit_req_zone $binary_remote_addr zone=admin:5m rate=5r/s;
# OSM Nominatim 公共服务使用政策：≤1 req/s（/osm-service/，docker/nginx.proxy.inc）
limit_req_zone $binary_remote_addr zone=osm_service:1m rate=1r/s;
# 头像代理（/public/v1/media/avatars/{file_id}，302 到短时签名 URL）独立桶：
# 单页可并发渲染多张头像，与 API 共用 api 桶会在 burst=20 处误伤
# （2026-11-08 受控实测：同一 IP 60 并发 → 22 通过 / 38×503）。
# 这是廉价 302（不回源对象 body），单独给更宽的桶，仍保留枚举/滥用防护。
limit_req_zone $binary_remote_addr zone=avatar:5m rate=30r/s;
# 限流超限统一 429：默认 503 HTML 会被前端 core.ts 当成传输错误；429 + Retry-After
# 让客户端按契约自动重试一次。envelope 响应体在 server 的 @rate_limited 里给出。
limit_req_status 429;

# ── gzip 压缩（静态产物 + API JSON）──────────────────────────────
# gzip_proxied any：压缩经反代返回的后端响应（Go 后端本身不压缩 JSON）。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

upstream backend {
    server backend:8081;
    keepalive 32;   # API 长连接池，避免每个请求重复建连 Go 后端
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
    # 媒体对象 GET 复用长连接（/s3/ 见 docker/nginx.proxy.inc）：必须与 location
    # 内 proxy_http_version 1.1 + proxy_set_header Connection "" 配套，否则每条
    # 头像/图片请求都新建 TCP，回源成本随首屏图数量线性上升。
    # 与 nginx.prod-tls.conf / nginx.dev.conf 的 upstream 段保持同步。
    keepalive 32;
}

# ── OSM 瓦片磁盘缓存（http 层）───────────────────────────────────
# /osm-tiles/ 经 proxy_cache 落盘后，同一瓦片只回源一次；OSM 公共瓦片
# 服务有使用政策（低频 + 重缓存），代理侧缓存是合规与流畅的关键。
# keys_zone=50m（内存索引约 40 万瓦片），200MB 磁盘，缓存 30 天，
# 60 天未命中即淘汰；inactive 大于缓存期保证稳定供给。
proxy_cache_path /var/cache/nginx/osm_tiles levels=1:2 keys_zone=osm_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# ── 高德瓦片磁盘缓存（http 层，与 osm_tiles 同规格）──────────────
# /amap-tiles/ 经 proxy_cache 落盘 30 天：瓦片不可变，重复浏览/缩放零回源。
proxy_cache_path /var/cache/nginx/amap_tiles levels=1:2 keys_zone=amap_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# ── /s3/ 媒体对象磁盘缓存（http 层；与 nginx.prod-tls.conf 保持同步）──────
# presigned GET 的 X-Amz-* query 每次签发都不同，缓存 key 只取对象路径、忽略
# query（见 docker/nginx.proxy.inc 的 /s3/ 及其中「安全前提」注释）。
# 10m 内存索引 ≈ 8 万对象；512MB 磁盘上限按 LRU 淘汰；inactive 7d（远大于
# 1h 缓存期：热对象常驻，无人引用后自然淘汰）。缓存放在容器可写层，nginx
# 容器重建即清空（冷启动回源，与 osm/amap 瓦片缓存同口径，不额外挂卷）。
proxy_cache_path /var/cache/nginx/s3_media levels=1:2 keys_zone=s3_media:10m
    max_size=512m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 100m;

    # ── 安全响应头 ─────────────────────────────────────────────
    # 共享基础头（X-Frame-Options 等）在 headers.inc；CSP 是独立的生产专用片段
    # csp.inc（dev 网关不加 CSP，见 docker/nginx.csp.inc 头注释）。
    # 两者都必须在每个带自定义 add_header 的 HTML location（/ 与 /_app/）里重复
    # include：nginx 的 add_header 不跨层级继承，否则 server 层安全头会被丢弃。
    # HSTS 故意未加 —— 仅在 TLS 终止时才应启用，当前网关为纯 HTTP
    # （TLS 由前置 LB/CDN 处理），加上会把首次访问也强制跳转。
    include /etc/nginx/conf.d/headers.inc;
    include /etc/nginx/conf.d/csp.inc;

    # ── 限流超限统一响应 ──────────────────────────────────────
    # limit_req 默认返回 503 HTML；改为 429 + 与后端同形的 {"code":10500,...}
    # 响应体 + Retry-After，前端 core.ts 会按 Retry-After（≤10s）自动重试一次。
    # proxy_intercept_errors 默认为 off，后端自己返回的 429（WS 握手）原样透传。
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":10500,"message":"请求过于频繁"}';
    }

    # ── REST API ──────────────────────────────────────────────
    # burst=20 + nodelay：突发 20 个请求立即放行，超出则 429，不排队拖慢响应。
    # 存活探针（全站约定 GET /healthz）：无鉴权、无限流，直通后端；
    # 业务健康（DB/Redis）仍走 POST /public/v1/system/health。
    location = /healthz {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        # JSON API 体量上限：后端 MaxRequestBodyBytes=1MB，nginx 只兜住极端值
        # （server 级 100m 留给 /s3/ 直传），避免把 100m 大包全收进 nginx。
        client_max_body_size 2m;
        proxy_pass http://backend;
        # keepalive 池要求 HTTP/1.1 且不携带 Connection 头（与 /ws/ 的 upgrade 语义互斥）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
    }

    # ── 头像代理（/public/v1/media/avatars/{file_id} → 302 签名 URL）──
    # 单独限流桶：单页可能一口气加载几十张头像，共享 api 桶（burst 20）会误伤。
    location /public/v1/media/avatars/ {
        limit_req zone=avatar burst=60 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
    }

    # ── 匿名节点 API（/public/v1，纯匿名：认证入口+匿名浏览+系统信息）──
    location /public/ {
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 2m;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
    }

    # ── 平台管理 API（/admin/api/v1 独立节点，独立限流）──────────
    # 仅代理 /admin/api/v1 API 节点；/admin/* 前端页面路由须回落给 SPA（深链/刷新可达）
    location /admin/api/v1/ {
        limit_req zone=admin burst=10 nodelay;
        client_max_body_size 2m;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $hotspot_request_id;
    }

    # ── 共享代理（/ws/ WebSocket、/s3/ SeaweedFS S3）────────
    include /etc/nginx/conf.d/proxy.inc;

    # ── 高德地图安全代理（由 amap.conf 注入 jscode）────
    include /etc/nginx/conf.d/amap.inc;

    # ── Frontend (SvelteKit SPA 静态产物) ─────────────────────
    # Vite build 产物由共享 volume 挂载到 root。
    # /_app/ 为内容 hash 命名（immutable），可长缓存；HTML 入口需实时校验。
    # add_header 会覆盖本层安全头，故先 include headers.inc 再追加缓存头。
    location /_app/ {
        include /etc/nginx/conf.d/headers.inc;
        include /etc/nginx/conf.d/csp.inc;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # ── 首屏静态资源缓存策略（本段与 docker/prod-server.inc 的同段内容必须
    #    一致：只允许缩进不同，指令/注释/顺序一律相同；任一侧改动都要同步另一侧）──
    # 每个 location 都重新 include headers/csp：nginx 的 add_header 不跨层级
    # 继承，加了缓存头就会丢掉 server 层安全头（与 /_app/ 同一处理，见
    # docker/nginx.headers.inc、docker/nginx.csp.inc 头注释）。
    #
    # /fonts/：字体 public, max-age=1y + immutable。当前字体文件名不带 content
    # hash（frontend/static/fonts/inter-latin-wght.woff2 原样发布），用 1y 的前提
    # 是「不原地替换同名文件」；将来要同文件名换内容，必须先改名（或迁到带 hash
    # 的路径），否则已缓存客户端 1 年内看不到新字体。取舍：首屏 preload 字体命中
    # 本地缓存零往返，代价是改名纪律。
    location /fonts/ {
        include /etc/nginx/conf.d/headers.inc;
        include /etc/nginx/conf.d/csp.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /icons/ 与 /favicon.png：PWA 图标/站点图标会随发版原地替换（同名），
    # 故 30d 而非 immutable——换图后最多 30 天收敛，不会出现 1 年不更新。
    location /icons/ {
        include /etc/nginx/conf.d/headers.inc;
        include /etc/nginx/conf.d/csp.inc;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /favicon.png {
        include /etc/nginx/conf.d/headers.inc;
        include /etc/nginx/conf.d/csp.inc;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # = /manifest.webmanifest：PWA 清单。nginx 内置 mime.types 未收录
    # .webmanifest（nginx 1.30.4 实测），不显式 default_type 会以
    # application/octet-stream 下发，影响 PWA 安装判定。缓存 1h：与 index.html
    # 同属「改版后应尽快生效」的入口元数据，同时吸收首屏重复请求。
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/headers.inc;
        include /etc/nginx/conf.d/csp.inc;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # dev 网关（docker/nginx.dev.conf）前端是 Vite dev server 直出、没有构建
    # 产物 root，故不做上述长缓存（有意差异，说明见该文件）。

    # 非文件请求 fallback 到 index.html
    location / {
        include /etc/nginx/conf.d/headers.inc;
        include /etc/nginx/conf.d/csp.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
