# ── 真实客户端 IP 还原（http 层；部署拓扑：全部流量必经 Cloudflare 回源）──
# 部署拓扑假设（2026-10-23 确认）：源站防火墙/mTLS 保证只有 CF 能建连，
# CF-Connecting-IP 由 CF 强制设置（客户端自带的同名头会被 CF 覆盖后转发），可信。
# set_real_ip_from 列出的来源连接，其 remote_addr 被替换为 real_ip_header 的值：
#   - limit_req 的 $binary_remote_addr 变为真实客户端 IP，不再按 CF 边缘 IP
#     共享桶（同一 POP 的全部用户共用 10r/s 会互相 429 误伤）；
#   - proxy_set_header X-Real-IP $remote_addr 随之为真实客户端 IP，与后端
#     requestmeta 的 CF-Connecting-IP 首选口径一致。
# 网段清单与 backend-go/internal/platform/requestmeta 的
# defaultTrustedProxyCIDRs 保持一致（CF 官方 IPv4/IPv6 回源段）。
# 网段变更时两处同改（与 nginx.prod-tls.conf 三处同步）。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Rate limit zone (http context) ───────────────────────────────
# 本文件由 nginx 的 http {} 块 include，故 limit_req_zone 写在顶层即可。
# 按 client IP 限流：每秒 10 个请求，10MB 共享内存（约 16 万个 IP）。
# real_ip 还原生效后这里按真实客户端 IP 计数（见上方还原块注释）。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# 平台管理节点独立限流（/admin/api/v1 专属，spec api_spec_base.md「节点与路径架构」）
limit_req_zone $binary_remote_addr zone=admin:5m rate=5r/s;
# OSM Nominatim 公共服务使用政策：≤1 req/s（/osm-service/，docker/nginx.proxy.inc）
limit_req_zone $binary_remote_addr zone=osm_service:1m rate=1r/s;

# ── gzip 压缩（静态产物 + API JSON）──────────────────────────────
# gzip_proxied any：压缩经反代返回的后端响应（Go 后端本身不压缩 JSON）。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

upstream backend {
    server backend:8081;
    keepalive 32;   # API 长连接池，避免每个请求重复建连 Go 后端
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

# ── OSM 瓦片磁盘缓存（http 层）───────────────────────────────────
# /osm-tiles/ 经 proxy_cache 落盘后，同一瓦片只回源一次；OSM 公共瓦片
# 服务有使用政策（低频 + 重缓存），代理侧缓存是合规与流畅的关键。
# keys_zone=50m（内存索引约 40 万瓦片），200MB 磁盘，缓存 30 天，
# 60 天未命中即淘汰；inactive 大于缓存期保证稳定供给。
proxy_cache_path /var/cache/nginx/osm_tiles levels=1:2 keys_zone=osm_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

# ── 高德瓦片磁盘缓存（http 层，与 osm_tiles 同规格）──────────────
# /amap-tiles/ 经 proxy_cache 落盘 30 天：瓦片不可变，重复浏览/缩放零回源。
proxy_cache_path /var/cache/nginx/amap_tiles levels=1:2 keys_zone=amap_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 100m;

    # ── 安全响应头 ─────────────────────────────────────────────
    # 共享头（X-Frame-Options 等与 CSP）统一在 headers.inc：CSP 放 server 层
    # 会被带 add_header 的 HTML location（/ 与 /_app/）按继承规则丢弃。
    # HSTS 故意未加 —— 仅在 TLS 终止时才应启用，当前网关为纯 HTTP
    # （TLS 由前置 LB/CDN 处理），加上会把首次访问也强制跳转。
    include /etc/nginx/conf.d/headers.inc;

    # ── REST API ──────────────────────────────────────────────
    # burst=20 + nodelay：突发 20 个请求立即放行，超出则 429，不排队拖慢响应。
    # 存活探针（全站约定 GET /healthz）：无鉴权、无限流，直通后端；
    # 业务健康（DB/Redis）仍走 POST /public/v1/system/health。
    location = /healthz {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        # keepalive 池要求 HTTP/1.1 且不携带 Connection 头（与 /ws/ 的 upgrade 语义互斥）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 匿名节点 API（/public/v1，纯匿名：认证入口+匿名浏览+系统信息）──
    location /public/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 平台管理 API（/admin/api/v1 独立节点，独立限流）──────────
    # 仅代理 /admin/api/v1 API 节点；/admin/* 前端页面路由须回落给 SPA（深链/刷新可达）
    location /admin/api/v1/ {
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 共享代理（/ws/ WebSocket、/s3/ SeaweedFS S3）────────
    include /etc/nginx/conf.d/proxy.inc;

    # ── 高德地图安全代理（由 amap.conf 注入 jscode）────
    include /etc/nginx/conf.d/amap.inc;

    # ── Frontend (SvelteKit SPA 静态产物) ─────────────────────
    # Vite build 产物由共享 volume 挂载到 root。
    # /_app/ 为内容 hash 命名（immutable），可长缓存；HTML 入口需实时校验。
    # add_header 会覆盖本层安全头，故先 include headers.inc 再追加缓存头。
    location /_app/ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # 非文件请求 fallback 到 index.html
    location / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
