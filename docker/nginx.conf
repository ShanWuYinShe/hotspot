# ── Rate limit zone (http context) ───────────────────────────────
# 本文件由 nginx 的 http {} 块 include，故 limit_req_zone 写在顶层即可。
# 按 client IP 限流：每秒 10 个请求，10MB 共享内存（约 16 万个 IP）。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# 平台管理节点独立限流（/admin/v1 专属，spec api_spec_base.md「节点与路径架构」）
limit_req_zone $binary_remote_addr zone=admin:5m rate=5r/s;
# OSM Nominatim 公共服务使用政策：≤1 req/s（/osm-service/，docker/nginx.proxy.inc）
limit_req_zone $binary_remote_addr zone=osm_service:1m rate=1r/s;

# ── gzip 压缩（静态产物 + API JSON）──────────────────────────────
# gzip_proxied any：压缩经反代返回的后端响应（Go 后端本身不压缩 JSON）。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

upstream backend {
    server backend:8081;
    keepalive 32;   # API 长连接池，避免每个请求重复建连 Go 后端
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

# ── OSM 瓦片磁盘缓存（http 层）───────────────────────────────────
# /osm-tiles/ 经 proxy_cache 落盘后，同一瓦片只回源一次；OSM 公共瓦片
# 服务有使用政策（低频 + 重缓存），代理侧缓存是合规与流畅的关键。
# keys_zone=50m（内存索引约 40 万瓦片），200MB 磁盘，缓存 30 天，
# 60 天未命中即淘汰；inactive 大于缓存期保证稳定供给。
proxy_cache_path /var/cache/nginx/osm_tiles levels=1:2 keys_zone=osm_tiles:50m
    max_size=200m inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 100m;

    # ── 安全响应头 ─────────────────────────────────────────────
    # 共享头（X-Frame-Options 等）见 headers.inc；此处仅追加 prod 专有头。
    # HSTS 故意未加 —— 仅在 TLS 终止时才应启用，当前网关为纯 HTTP
    # （TLS 由前置 LB/CDN 处理），加上会把首次访问也强制跳转。
    include /etc/nginx/conf.d/headers.inc;
    # SvelteKit SPA：
    #  - script-src 'self' 'unsafe-inline'：SvelteKit 静态产物含一枚确定性
    #    内联 bootstrap script（<script type="module">import { start } ...），
    #    被 'self' 拦截会导致生产白屏；无第三方注入面，风险可控
    #  - style-src 'self' 'unsafe-inline'：Tailwind / Svelte 注入内联样式
    #  - img-src：允许 data: URI 与任意 https CDN（用户头像/地图瓦片）
    #  - connect-src 'self'：API/WS 必须同源；如需接外部 API 在此追加
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── REST API ──────────────────────────────────────────────
    # burst=20 + nodelay：突发 20 个请求立即放行，超出则 429，不排队拖慢响应。
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        # keepalive 池要求 HTTP/1.1 且不携带 Connection 头（与 /ws/ 的 upgrade 语义互斥）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 匿名节点 API（/public/v1，纯匿名：认证入口+匿名浏览+系统信息）──
    location /public/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 平台管理 API（/admin/v1 独立节点，独立限流）──────────
    # 仅代理 /admin/v1 API 节点；/admin/* 前端页面路由须回落给 SPA（深链/刷新可达）
    location /admin/v1/ {
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── 共享代理（/ws/ WebSocket、/s3/ SeaweedFS S3）────────
    include /etc/nginx/conf.d/proxy.inc;

    # ── 高德地图安全代理（由 amap.conf 注入 jscode）────
    include /etc/nginx/conf.d/amap.inc;

    # ── Frontend (SvelteKit SPA 静态产物) ─────────────────────
    # Vite build 产物由共享 volume 挂载到 root。
    # /_app/ 为内容 hash 命名（immutable），可长缓存；HTML 入口需实时校验。
    # add_header 会覆盖本层安全头，故先 include headers.inc 再追加缓存头。
    location /_app/ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # 非文件请求 fallback 到 index.html
    location / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
