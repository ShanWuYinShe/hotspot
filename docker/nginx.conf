# ── Rate limit zone (http context) ───────────────────────────────
# 本文件由 nginx 的 http {} 块 include，故 limit_req_zone 写在顶层即可。
# 按 client IP 限流：每秒 10 个请求，10MB 共享内存（约 16 万个 IP）。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream backend {
    server backend:8081;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 100m;

    # ── 安全响应头 ─────────────────────────────────────────────
    # 这些头对 SPA 是安全的默认值。HSTS 故意未加 —— 仅在 TLS 终止时才应启用，
    # 当前网关为纯 HTTP（TLS 由前置 LB/CDN 处理），加上会把首次访问也强制跳转。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SvelteKit SPA：
    #  - script-src 'self' 'unsafe-inline'：SvelteKit 静态产物含一枚确定性
    #    内联 bootstrap script（<script type="module">import { start } ...），
    #    被 'self' 拦截会导致生产白屏；无第三方注入面，风险可控
    #  - style-src 'self' 'unsafe-inline'：Tailwind / Svelte 注入内联样式
    #  - img-src：允许 data: URI 与任意 https CDN（用户头像/地图瓦片）
    #  - connect-src 'self'：API/WS 必须同源；如需接外部 API 在此追加
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── REST API ──────────────────────────────────────────────
    # burst=20 + nodelay：突发 20 个请求立即放行，超出则 429，不排队拖慢响应。
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── WebSocket ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── 高德地图安全代理（由 amap.conf 注入 jscode）────
    include /etc/nginx/conf.d/amap.inc;

    # ── SeaweedFS S3 ─────────────────────────────────────────
    location /s3/ {
        proxy_pass http://seaweedfs_s3/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend (React SPA 静态产物) ─────────────────────────
    # Vite build 产物由共享 volume 挂载到 root，非文件请求 fallback 到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
