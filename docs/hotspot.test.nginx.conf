##
# HotSpot 测试环境（同源统一入口）Nginx 配置示例
#
# 目标：
# - 同一域名下同时提供 Web（Nuxt）+ API（Axum）+ WebSocket
# - 客户端只配置一个 base（同源），不再需要 Vite 代理，也不会有 CORS 问题
#
# 路由约定：
# - "/"      -> Nuxt Web（SSR/静态皆可，示例按 Node SSR 反代）
# - "/api/"  -> Backend HTTP（例如 :8080）
# - "/ws"    -> Backend WebSocket（例如 :8080）
#
# 你需要按实际环境替换：
# - server_name
# - upstream 地址
# - TLS 证书路径
##

upstream hotspot_web_dev {
  # Nuxt SSR（Node/Nitro）监听地址
  server localhost:3000;
  keepalive 64;
}

upstream hotspot_web_prod {
  # Nuxt SSR（Node/Nitro）监听地址
  server localhost:6666;
  keepalive 64;
}

upstream hotspot_backend {
  # Rust 后端监听地址（HTTP + WS）
  server localhost:5496;
  keepalive 64;
}

upstream hotspot_minio {
  # MinIO/S3 服务地址（本地开发）
  server localhost:9000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name hotspot-test.example.com;
  return 301 https://$host$request_uri;
}

# dev proxy
server {
  #listen 443 ssl http2;
  #server_name hotspot-test.example.com;

  listen 8888;
  server_name _;

  # TLS（按实际替换）
  #ssl_certificate     /etc/letsencrypt/live/hotspot-test.example.com/fullchain.pem;
  #ssl_certificate_key /etc/letsencrypt/live/hotspot-test.example.com/privkey.pem;
  #ssl_protocols TLSv1.2 TLSv1.3;

  # 日志（按需调整）
  access_log /dev/stderr;
  error_log  /dev/stdout;


  # 自定义地图服务代理（可选，如果没有用到可不设置）
  location /_AMapService/v4/map/styles {
    set $args "$args&jscode=b18c8efd4340355a7546e65bba339cab";
    proxy_ssl_server_name on;
    proxy_set_header Host webapi.amap.com;
    proxy_pass https://webapi.amap.com/v4/map/styles;
  }

  # Web 服务 API 代理（必需）
  location /_AMapService/ {
    set $args "$args&jscode=b18c8efd4340355a7546e65bba339cab";
    proxy_ssl_server_name on;
    proxy_set_header Host restapi.amap.com;
    proxy_pass https://restapi.amap.com/;
  }

  # =========================
  # S3 文件上传和访问（MinIO 代理 - 开发环境）
  # =========================
  # 开发环境流程：
  # 1. 后端配置：S3_PUBLIC_BASE=/s3, S3_BUCKET=hotspot
  # 2. AWS SDK 生成 presigned URL path: "/hotspot/uploads/{user_id}/{uuid}.{ext}?signature=xxx"
  # 3. 后端拼接：/s3 + path = "/s3/hotspot/uploads/{user_id}/{uuid}.{ext}?signature=xxx"
  # 4. 客户端请求该 URL，Nginx 将 /s3/ 前缀去掉，转发到 MinIO
  # 5. MinIO 收到：/hotspot/uploads/{user_id}/{uuid}.{ext}?signature=xxx（正确的 bucket 路径）
  # 效果：
  #   - 客户端只看到 /s3/ 前缀，语义清晰
  #   - bucket 名包含在 AWS SDK 生成的 path 中，Nginx 无需额外处理
  #   - 通过 Nginx 统一域名，方便前端调试
  # =========================
  location ^~ /s3/ {
    # 关键：proxy_pass 以 / 结尾时，Nginx 会将匹配的 location 前缀去掉
    # 例如：/s3/hotspot/uploads/123/abc.jpg → http://localhost:9000/hotspot/uploads/123/abc.jpg
    proxy_pass http://hotspot_minio/;
    proxy_http_version 1.1;
    
    # 关键：使用 MinIO 的实际 Host，否则 S3 签名验证会失败
    # presigned URL 的签名是基于 S3_ENDPOINT 的 Host 计算的
    proxy_set_header Host localhost:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # 大文件上传配置
    client_max_body_size 100M;
    proxy_request_buffering off;
    
    # 超时配置（大文件上传需要更长时间）
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # =========================
  # API（同源转发）
  # =========================
  location ^~ /api/v1/ {
    proxy_pass http://hotspot_backend;
    proxy_http_version 1.1;

    # 透传常用头
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 让后端能拿到真实 request_id（如果客户端传了）
    proxy_set_header X-Request-Id $http_x_request_id;

    # 超时（按需调整）
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # =========================
  # WebSocket（同源转发）
  # =========================
  location = /ws {
    proxy_pass http://hotspot_backend;
    proxy_http_version 1.1;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $http_x_request_id;

    # WebSocket 长连接
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  # =========================
  # Web（Nuxt）同源入口
  # =========================
  location / {
    proxy_pass http://hotspot_web_dev;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSR 常见：支持升级（如果未来需要 HMR/WS，可保留）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

