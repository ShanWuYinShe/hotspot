##
# HotSpot 测试环境（同源统一入口）Nginx 配置
#
# 目标：
# - 同一域名下同时提供 Web（Nuxt）+ API（Axum）+ WebSocket
# - 客户端只配置一个 base（同源），不再需要 Vite 代理，也不会有 CORS 问题
#
# 路由约定：
# - "/"      -> Nuxt Web（SSR/静态皆可，示例按 Node SSR 反代）
# - "/api/"  -> Backend HTTP（例如 :8080）
# - "/ws"    -> Backend WebSocket（例如 :8080）
# - "/s3/"   -> MinIO (自动剥离前缀转发)
##

upstream hotspot_web_dev {
  # Nuxt SSR（Node/Nitro）监听地址
  server localhost:3000;
  keepalive 64;
}

upstream hotspot_backend {
  # Rust 后端监听地址（HTTP + WS）
  server localhost:5496;
  keepalive 64;
}

upstream hotspot_minio {
  # MinIO/S3 服务地址（本地开发）
  server localhost:9000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8888;
  server_name _;

  access_log /dev/stderr;
  error_log  /dev/stdout;


  # 自定义地图服务代理（可选，如果没有用到可不设置）
  location /_AMapService/v4/map/styles {
    set $args "$args&jscode=b18c8efd4340355a7546e65bba339cab";
    proxy_ssl_server_name on;
    proxy_set_header Host webapi.amap.com;
    proxy_pass https://webapi.amap.com/v4/map/styles;
  }

  # Web 服务 API 代理（必需）
  location /_AMapService/ {
    set $args "$args&jscode=b18c8efd4340355a7546e65bba339cab";
    proxy_ssl_server_name on;
    proxy_set_header Host restapi.amap.com;
    proxy_pass https://restapi.amap.com/;
  }

  # =========================
  # S3 文件上传和访问（MinIO 代理）
  # =========================
  # 逻辑：
  # 1. 前端请求 /s3/hotspot/uploads/...
  # 2. Nginx 匹配 /s3/
  # 3. proxy_pass 加了 trailing slash (/) -> 自动剥离 /s3/
  # 4. 转发给 MinIO: /hotspot/uploads/...
  # =========================
  location ^~ /s3/ {
    # ⚠️ 核心配置：尾部的 / 表示剥离 location 匹配的 path
    proxy_pass http://hotspot_minio/;
    proxy_http_version 1.1;
    
    # ⚠️ 关键修正：Host 必须与后端生成签名时使用的 S3_ENDPOINT Host 一致
    # 场景 A: 后端 .env 配置 S3_ENDPOINT=http://localhost:9000 (本地开发)
    # -> 这里必须是 localhost:9000
    # 场景 B: 后端 .env 配置 S3_ENDPOINT=http://minio:9000 (Docker)
    # -> 这里必须是 minio:9000
    proxy_set_header Host localhost:9000;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # 大文件上传配置
    client_max_body_size 100M;
    proxy_request_buffering off;
    
    # 超时配置（大文件上传需要更长时间）
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # =========================
  # API（同源转发）
  # =========================
  location ^~ /api/v1/ {
    proxy_pass http://hotspot_backend;
    proxy_http_version 1.1;

    # 透传常用头
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 让后端能拿到真实 request_id（如果客户端传了）
    proxy_set_header X-Request-Id $http_x_request_id;

    # 超时（按需调整）
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # =========================
  # WebSocket（同源转发）
  # =========================
  location = /ws {
    proxy_pass http://hotspot_backend;
    proxy_http_version 1.1;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $http_x_request_id;

    # WebSocket 长连接
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  # =========================
  # Web（Nuxt）同源入口
  # =========================
  location / {
    proxy_pass http://hotspot_web_dev;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSR 常见：支持升级（如果未来需要 HMR/WS，可保留）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
