##
# HotSpot 同源统一入口 Nginx 配置示例（可直接用于真实环境）
#
# 目标：
# - 同一域名下同时提供 Web（Nuxt）+ API（Axum）+ WebSocket
# - 客户端只配置一个 base（同源），不再需要 Vite 代理，也不会有 CORS 问题
#
# 路由约定：
# - "/"      -> Nuxt Web（SSR/静态皆可，示例按 Node SSR 反代）
# - "/api/"  -> Backend HTTP（例如 :8080）
# - "/ws"    -> Backend WebSocket（例如 :8080）
#
# 你需要按实际环境替换：
# - server_name
# - upstream 地址
# - TLS 证书路径
##

upstream hotspot_web {
  # Nuxt SSR（Node/Nitro）监听地址
  server 127.0.0.1:3000;
  keepalive 64;
}

upstream hotspot_backend {
  # Rust 后端监听地址（HTTP + WS）
  server 127.0.0.1:5496;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# =========================
# 可选：CORS（按需启用）
# 说明：
# - 同源统一入口时通常不需要 CORS
# - 若未来 Web/API 分域名、或 CDN/CF 边缘转发导致跨域，可在 Nginx 层统一控制
# - 只要不开启 allow_credentials，就不要返回 Access-Control-Allow-Credentials
# =========================
map $http_origin $cors_allow_origin {
  default "";
  # 生产：填你的真实站点（示例）
  # "https://hotspot.example.com" $http_origin;
}

server {
  listen 80;
  server_name hotspot.example.com;
  return 301 https://$host$request_uri;
}

server {
  #listen 443 ssl http2;
  #server_name hotspot.example.com;

  listen 8888;
  server_name _;

  # TLS（按实际替换）
  #ssl_certificate     /etc/letsencrypt/live/hotspot.example.com/fullchain.pem;
  #ssl_certificate_key /etc/letsencrypt/live/hotspot.example.com/privkey.pem;
  #ssl_protocols TLSv1.2 TLSv1.3;

  # 日志（按需调整）
  access_log /dev/stderr;
  error_log  /dev/stdout;

  # =========================
  # 安全相关响应头（按需调整）
  # 说明：这些都更适合放在 Nginx / CDN / WAF 层统一管控
  # =========================
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # CSP 建议在生产按实际资源白名单配置，这里仅示例（默认注释）
  # add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

  # =========================
  # 可选：基础限流（按需启用）
  # - 未来接 CDN/CF 时，也可迁移到边缘层；此处保留 Nginx 兜底能力
  # =========================
  # limit_req_zone $binary_remote_addr zone=api_ip:10m rate=60r/m;
  # limit_req_zone $binary_remote_addr zone=ws_ip:10m  rate=30r/m;

  # =========================
  # 高德 JS API 安全密钥代理（同源转发）
  #
  # 前端会在加载 AMap SDK 之前设置：
  #   window._AMapSecurityConfig = { serviceHost: "<当前站点 origin>/_AMapService" }
  #
  # 这里由 Nginx 负责把 `jscode=<你的 securityJsCode>` 注入到 query。
  # 注意：如果需要自定义地图样式能力，请保留 v4 路径，并且顺序要在 /_AMapService/ 之前。
  # =========================

  # 自定义地图服务代理（可选，如果没有用到可不设置）
  location /_AMapService/v4/map/styles {
    set $args "$args&jscode=你的安全密钥";
    proxy_ssl_server_name on;
    proxy_set_header Host webapi.amap.com;
    proxy_pass https://webapi.amap.com/v4/map/styles;
  }

  # Web 服务 API 代理（必需）
  location /_AMapService/ {
    set $args "$args&jscode=你的安全密钥";
    proxy_ssl_server_name on;
    proxy_set_header Host restapi.amap.com;
    proxy_pass https://restapi.amap.com/;
  }

  # =========================
  # API（同源转发）
  # =========================
  location ^~ /api/v1/ {
    # 可选：API 限流（按需开启）
    # limit_req zone=api_ip burst=30 nodelay;

    proxy_pass http://hotspot_backend;
    proxy_http_version 1.1;

    # 透传常用头
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 让后端能拿到真实 request_id（如果客户端传了）
    proxy_set_header X-Request-Id $http_x_request_id;

    # 可选：CORS（按需启用）
    # if ($cors_allow_origin != "") {
    #   add_header Access-Control-Allow-Origin      $cors_allow_origin always;
    #   add_header Access-Control-Allow-Methods     "POST, OPTIONS" always;
    #   add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Request-Id" always;
    #   add_header Access-Control-Max-Age           86400 always;
    # }
    # if ($request_method = OPTIONS) { return 204; }

    # 超时（按需调整）
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # =========================
  # WebSocket（同源转发）
  # =========================
  location = /ws {
    # 可选：WS 建连限流（按需开启）
    # limit_req zone=ws_ip burst=10 nodelay;

    proxy_pass http://hotspot_backend;
    proxy_http_version 1.1;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $http_x_request_id;

    # WebSocket 长连接
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  # =========================
  # Web（Nuxt）同源入口
  # =========================
  location / {
    proxy_pass http://hotspot_web;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSR 常见：支持升级（如果未来需要 HMR/WS，可保留）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}


