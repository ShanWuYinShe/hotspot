# HotSpot API - 管理后台审核模块端点
# 对应原 api_spec_admin_moderation.mdc

admin_users_search:
  post:
    summary: 搜索用户（管理员）
    operationId: adminUsersSearch
    tags: [admin-moderation]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin-moderation.yaml#/AdminUserSearchRequest'
    responses:
      '200':
        description: 用户列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/admin-moderation.yaml#/PaginatedAdminUserItems'

admin_users_open_the_door:
  post:
    summary: 用户详情（管理员）
    operationId: adminUsersOpenTheDoor
    tags: [admin-moderation]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
      10300: 资源不存在
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin-moderation.yaml#/AdminUserOpenTheDoorRequest'
    responses:
      '200':
        description: 用户详情
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/admin-moderation.yaml#/AdminUserItem'

admin_users_ban:
  post:
    summary: 封禁用户（管理员）
    operationId: adminUsersBan
    tags: [admin-moderation]
    x-idempotency: required
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
      10300: 资源不存在
      10400: 业务冲突
      22000: 幂等键冲突
      22002: 幂等操作进行中
    description: |
      安全约束：
      - 禁止封禁自身（返回 10400）
      - 普通管理员禁止封禁其他管理员（返回 10200）
      - 封禁超级管理员仅限超级管理员执行（返回 10200）
      - 封禁操作会记录审计日志
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin-moderation.yaml#/AdminBanUserRequest'
    responses:
      '200':
        description: 用户封禁成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

admin_users_unban:
  post:
    summary: 解封用户（管理员）
    operationId: adminUsersUnban
    tags: [admin-moderation]
    x-idempotency: semantic
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
      10300: 资源不存在
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin-moderation.yaml#/AdminUnbanUserRequest'
    responses:
      '200':
        description: 用户解封成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

