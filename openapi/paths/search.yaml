# HotSpot API - Search 端点
# 对应原 api_spec_search.mdc

search_suggest:
  post:
    summary: 综合搜索建议
    operationId: searchSuggest
    tags: [search]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      综合搜索建议（标签、用户、群组、瞬间）。
      
      Token 可选；未登录时仅返回公开内容。
      建议用于搜索框输入提示与全局发现入口。
      
      LBS 优化：必须提供 reference_point，用于优先返回附近的匹配结果。
      类型过滤：通过 types 参数可限定返回特定类型的结果，替代各模块独立的 suggest 端点。
      
      排序：
      1. 完全匹配优先。
      2. 距离优先（在匹配度相近的情况下）。
      3. 热度/活跃度作为辅助排序信号。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/search.yaml#/SearchSuggestRequest'
    responses:
      '200':
        description: 搜索建议
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/search.yaml#/SearchSuggestResponse'

tags_list_trending:
  post:
    summary: 热门标签
    operationId: tagsListTrending
    tags: [tags]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      获取热门标签。
      
      标签属于"默认公开资源"，不涉及用户隐私等级/访问控制分支。
      标签是跨模块使用的概念（用户标签、群组标签、瞬间标签）。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/search.yaml#/TrendingTagsRequest'
    responses:
      '200':
        description: 热门标签列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/search.yaml#/TagItem'
