# HotSpot API - Map 端点
# 对应原 api_spec_map.mdc

render:
  post:
    summary: 获取地图渲染数据
    operationId: mapRender
    tags: [map]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      获取地图渲染数据。
      
      服务端智能决策：客户端只负责"渲染"，不再手动决定"何时拉聚合/何时拉列表"。
      视口驱动 (Viewport-Driven)：完全基于当前视口 (bounds) 和缩放级别 (zoom)，服务端根据算法（如网格聚合/K-Means）动态返回最适合当前视野的展示项。
      
      高德模式：
      - Low Zoom (远)：返回行政区/热门区域的聚合点 (type: 'cluster', label: '海淀区 500+')
      - Mid Zoom (中)：分裂为更小的聚合或展示头部热点 (type: 'cluster', preview_urls: [...])
      - High Zoom (近)：直接展示具体的 Poi (type: 'user'/'moment', entity: {...})
      
      Token 可选：
      - 未登录：仅返回地图视野内"可匿名公开展示"的实体
      - 已登录：在满足隐私与关系规则前提下，允许返回更多可见实体
      - 位置保护：服务端可对匿名不可见实体进行聚合或降精度处理
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/map.yaml#/MapRenderRequest'
    responses:
      '200':
        description: 地图渲染数据
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/map.yaml#/MapCanvas'
