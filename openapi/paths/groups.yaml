# HotSpot API - 群组管理模块端点
# 对应原 api_spec_group.mdc

search:
  post:
    summary: 搜索群组（支持关键字/标签/位置组合）
    operationId: groupsSearch
    tags: [groups]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      统一搜索群组。支持关键字、标签、位置范围三种条件的自由组合。

      说明（Token 可选的搜索语义）：
      - 未登录（不带 token）：仅返回 `is_searchable=true` 的群组；不返回 `@auth-only` 字段
      - 已登录（带 token）：在满足关系与可见性规则前提下，允许返回更多可见群组；返回完整的 `GroupItem`（包括 `@auth-only` 字段）

      排序：
      - 默认 `sort_by='relevance'`：按相关性优先排序
      - `sort_by='distance'`：按距离由近到远排序（需要 `radius`）
      - `sort_by='newest'`：按创建时间倒序
      - `sort_by='popular'`：按成员数/活跃度排序
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/groups.yaml#/SearchGroupsRequest'
    responses:
      '200':
        description: 搜索成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/PaginatedGroupItems'

