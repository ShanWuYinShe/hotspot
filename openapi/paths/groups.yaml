me_join:
  post:
    summary: 加入群组（根据 join_method 自动处理）
    operationId: groupsMeJoin
    tags: [groups]
    x-idempotency: required
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
      10300: 资源不存在
      10400: 业务冲突
      22000: 幂等键冲突
      22002: 幂等操作进行中
    description: |
      加入群组（智能路由）。根据群组 `join_method` 自动处理：
      - `open`：直接加入，返回 `status: 'joined'`
      - `open` + 有密码：需提供 `password`，验证通过后直接加入
      - `approval`：创建加入申请，返回 `status: 'pending_approval'`
      - `invite_only`：返回错误 `10400`（该群组仅限邀请加入）
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/groups.yaml#/JoinGroupRequest'
    responses:
      '200':
        description: 加入成功或申请已提交
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
