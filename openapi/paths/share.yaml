# HotSpot API - Share 端点
# 对应原 api_spec_share.mdc

create:
  post:
    summary: 创建分享
    operationId: shareCreate
    tags: [share]
    x-idempotency: required
    x-error-codes:
      10000: 参数错误
      10300: 资源不存在
      22000: 幂等键冲突
      22002: 幂等操作进行中
    description: |
      创建分享。
      
      业务规则：
      - 校验 payload 与 share_type 匹配
      - 校验目标资源存在且可访问
      - reference_point：校验经纬度范围与 location_name 长度（1-100 字符）
      - expires_in_seconds 若提供，必须为正整数且不超过系统允许上限
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/share.yaml#/CreateShareRequest'
    responses:
      '200':
        description: 分享创建成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/share.yaml#/ShareCreated'

get:
  post:
    summary: 获取分享详情
    operationId: shareGet
    tags: [share]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10300: 资源不存在
    description: |
      获取分享详情。
      
      公开访问，Token 可选。
      过期分享返回 10300。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/share.yaml#/GetShareRequest'
    responses:
      '200':
        description: 分享详情
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/share.yaml#/ShareDetail'

apply:
  post:
    summary: 应用分享
    operationId: shareApply
    tags: [share]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10300: 资源不存在
    description: |
      应用分享。
      
      行为说明：
      - navigate_user / navigate_group / navigate_moment：客户端跳转到对应详情页
      - update_reference_point：服务端更新用户浏览锚点位置，并返回最新锚点
      
      过期分享返回 10300。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/share.yaml#/ApplyShareRequest'
    responses:
      '200':
        description: 应用结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/share.yaml#/ShareApplyResult'

me_list:
  post:
    summary: 我的分享列表
    operationId: shareList
    tags: [share]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      获取当前用户创建的分享列表。
      
      排序：created_at DESC
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/share.yaml#/ShareListRequest'
    responses:
      '200':
        description: 分享列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/share.yaml#/PaginatedShareListItems'

revoke:
  post:
    summary: 撤销分享
    operationId: shareRevoke
    tags: [share]
    x-idempotency: semantic
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
      10300: 资源不存在
    description: |
      撤销分享。撤销后分享码不可再用于 get 和 apply。
      
      仅分享创建者可撤销。
      幂等语义：重复撤销返回一致结果。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/share.yaml#/RevokeShareRequest'
    responses:
      '200':
        description: 撤销成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'
