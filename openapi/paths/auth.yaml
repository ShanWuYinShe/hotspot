# HotSpot API - 认证模块端点
# 对应原 api_spec_auth.mdc

register:
  post:
    summary: 用户注册
    operationId: authRegister
    tags: [auth]
    security: []
    x-idempotency: required
    x-error-codes:
      10000: 参数错误
      10100: 认证失败
      10400: 业务冲突
      22000: 幂等键冲突
      22002: 幂等操作进行中
    description: |
      验证要求：
      - 当 ClientConfig.features.require_phone_verification 为 true 时，verify_token 为必填
      - 当为 false 时（早期开发阶段），verify_token 可选
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/RegisterRequest'
    responses:
      '200':
        description: 注册成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/AuthTokenResponse'

login:
  post:
    summary: 用户登录
    operationId: authLogin
    tags: [auth]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10100: 认证失败
      10201: 账号被封禁
      10300: 资源不存在
    description: |
      支持密码登录和手机验证码登录两种方式。

      验证码登录流程：
      1. 调用 send_verification_code（type: 'login'）获取验证码
      2. 调用 verify_code 验证成功后获得 verify_token
      3. 调用 login（verify_token）完成登录
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: 登录成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/AuthTokenResponse'

logout:
  post:
    summary: 用户登出
    operationId: authLogout
    tags: [auth]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      登出会将当前 access_token 与 refresh_token 写入黑名单，直至过期。

      Web 端行为：通过 Max-Age=0 立即清除 access_token 和 refresh_token Cookie，前端无需手动清除。
      App 端行为：客户端需要自行清除存储的 token。

      WebSocket 处理：服务端在处理 logout 时会主动断开该用户当前会话关联的 WebSocket 连接。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: 登出成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

guest:
  post:
    summary: 创建访客用户
    operationId: authGuest
    tags: [auth]
    security: []
    x-idempotency: required
    x-error-codes:
      10000: 参数错误
      22000: 幂等键冲突
      22002: 幂等操作进行中
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/GuestRequest'
    responses:
      '200':
        description: 访客创建成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/AuthTokenResponse'

refresh_token:
  post:
    summary: 刷新 Token
    operationId: authRefreshToken
    tags: [auth]
    security:
      - refreshTokenCookie: []
      - bearerAuth: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10100: 认证失败
    description: |
      刷新规则：
      - 刷新成功后 access_token 和 refresh_token 都会更新
      - 允许在 access_token 过期或缺失时调用

      并发刷新策略（宽限期机制）：
      - 设计目的：解决多标签页/多并发请求同时触发刷新的竞态问题
      - 旧 refresh_token 在被轮换后，仍有 30 秒宽限期可用
      - 宽限期内使用旧 refresh_token 刷新，返回与首次刷新相同的新 token 对
      - 宽限期过后，旧 refresh_token 彻底失效
      - 客户端侧建议：使用刷新锁（mutex），同一时刻只允许一个刷新请求

      client_type 约束：
      - web：请求体不得携带 refresh_token
      - app：请求体必须携带 refresh_token
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/RefreshTokenRequest'
    responses:
      '200':
        description: Token 刷新成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/AuthTokenResponse'

check_status:
  post:
    summary: 检查认证状态
    operationId: authCheckStatus
    tags: [auth]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: "Token 可选；未登录时返回 is_valid: false。"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: 认证状态
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/AuthStatus'

captcha_request:
  post:
    summary: 请求人机验证挑战
    operationId: authCaptchaRequest
    tags: [auth]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/CaptchaRequest'
    responses:
      '200':
        description: 验证挑战
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/CaptchaChallenge'

captcha_verify:
  post:
    summary: 验证人机挑战答案
    operationId: authCaptchaVerify
    tags: [auth]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10100: 认证失败
    description: |
      captcha_token 为一次性凭证，使用后立即失效，有效期建议 5 分钟。
      受 ClientConfig.features.require_captcha 开关控制：关闭时服务端跳过验证（但端点仍可调用）。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/VerifyCaptchaRequest'
    responses:
      '200':
        description: 验证结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/CaptchaVerified'

send_verification_code:
  post:
    summary: 发送验证码
    operationId: authSendVerificationCode
    tags: [auth]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      captcha_token 受 ClientConfig.features.require_captcha 开关控制。
      type 对应的手机验证受 ClientConfig.features.require_phone_verification 开关控制。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/SendVerificationCodeRequest'
    responses:
      '200':
        description: 验证码已发送
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/VerificationCodeSent'

verify_code:
  post:
    summary: 验证验证码
    operationId: authVerifyCode
    tags: [auth]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10300: 资源不存在
      10400: 业务冲突
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/VerifyCodeRequest'
    responses:
      '200':
        description: 验证结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/VerificationResult'

reset_password:
  post:
    summary: 重置密码（忘记密码场景）
    operationId: authResetPassword
    tags: [auth]
    security: []
    x-idempotency: required
    x-error-codes:
      10000: 参数错误
      10100: 认证失败
      10300: 资源不存在
      22000: 幂等键冲突
      22002: 幂等操作进行中
    description: |
      流程：
      1. 用户输入手机号/邮箱，调用 send_verification_code 获取验证码
      2. 用户输入验证码，调用 verify_code 验证成功后获得 verify_token（短期有效，建议 5 分钟）
      3. 用户输入新密码，调用 reset_password 完成重置

      安全说明：
      - verify_token 使用后立即失效，不可重复使用
      - verify_token 与 login_id 绑定，防止跨账户攻击
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/ResetPasswordRequest'
    responses:
      '200':
        description: 密码重置成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

me_change_password:
  post:
    summary: 修改密码（需要验证旧密码）
    operationId: authChangePassword
    tags: [auth]
    x-idempotency: required
    x-error-codes:
      10000: 参数错误
      10100: 认证失败
      22000: 幂等键冲突
      22002: 幂等操作进行中
    description: |
      修改密码成功后：
      - 服务端自动吊销当前会话之外的所有其他活跃会话
      - 所有被吊销会话的 token 写入黑名单
      - 被吊销设备的 WebSocket 连接会被服务端主动断开（Error 事件，severity=fatal）
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/ChangePasswordRequest'
    responses:
      '200':
        description: 密码修改成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

me_sessions_list:
  post:
    summary: 获取活跃会话列表
    operationId: authSessionsList
    tags: [auth]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      活跃会话数天然有限（受并发设备数约束，过期会话自动清理），无需分页。
      按 last_active_at 倒序排列，当前会话在前。
      黑名单语义：登出/撤销会话会将对应 token 写入黑名单，直至 token 过期。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: 会话列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/SessionItemList'

me_sessions_revoke:
  post:
    summary: 撤销会话
    operationId: authSessionsRevoke
    tags: [auth]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
      10300: 资源不存在
    description: |
      撤销操作会将对应会话的 token 写入黑名单，直至过期。
      不允许撤销当前会话（使用 logout 代替）。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/RevokeSessionRequest'
    responses:
      '200':
        description: 会话已撤销
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

me_sessions_revoke_all:
  post:
    summary: 撤销所有其他会话
    operationId: authSessionsRevokeAll
    tags: [auth]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      撤销当前会话之外的所有其他活跃会话。适用于账号被盗、密码泄露等紧急安全场景。
      - 当前会话不会被撤销
      - 所有被撤销会话的 token 写入黑名单
      - 操作不可逆，被撤销的设备需要重新登录
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: 撤销结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/RevokeAllResult'
