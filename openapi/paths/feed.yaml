me_feedback:
  post:
    summary: 信息流反馈
    operationId: feedFeedback
    tags: [feed]
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
      10300: 资源不存在
    description: 反馈信息流内容（用于改进推荐算法）
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/feed.yaml#/FeedFeedbackRequest'
    responses:
      '200':
        description: 反馈成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'
