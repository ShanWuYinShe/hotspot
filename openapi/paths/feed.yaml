    x-error-codes:
      10000: 参数错误
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/feed.yaml#/GetFeedTrendingRequest'
    responses:
      '200':
        description: 热门内容
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
