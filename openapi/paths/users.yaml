    x-error-codes:
      10000: 参数错误
      10200: 权限不足
      10300: 资源不存在
      10400: 业务冲突
    description: |
      关注用户。关注成功后，若对方已关注当前用户，自动成为好友，触发 WebSocket `MutualFollow` 事件。

      规则说明：
      - 不存在关注申请流程
      - 对方 `allow_follow=false` 时直接返回失败（`10200`）

      心理学设计说明：`source` 字段让被关注者了解"为什么被关注"（如"通过你的瞬间"），增强用户发布内容的正向反馈。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/FollowRequest'
    responses:
      '200':
        description: 关注成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

