# HotSpot API - 用户模块端点
# 对应原 api_spec_user.mdc

search:
  post:
    summary: 搜索用户（支持关键字/标签/位置组合）
    operationId: usersSearch
    tags: [users]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      统一搜索用户。支持关键字、标签、位置范围三种条件的自由组合。

      说明（Token 可选的搜索语义）：
      - 未登录（不带 token）：仅返回可被匿名公开发现/可见的用户；不返回 `@auth-only` 字段
      - 已登录（带 token）：在满足隐私与关系规则前提下，允许返回更多可见用户；返回完整的 `UserItem`（包括 `@auth-only` 字段）

      排序：
      - 默认 `sort_by='relevance'`：按相关性优先排序，同分时以最近活跃时间做稳定 tie-breaker
      - `sort_by='distance'`：按距离由近到远排序（需要 `radius`），距离相近时体现关键词相关性
      - `sort_by='newest'`：按注册时间倒序
      - 在同一 `cursor` 会话内必须保持排序基准一致；跨会话允许排序轻微波动

      后端实现说明：使用 PostgreSQL 的 `($param IS NULL OR condition)` 模式处理可选参数，单条静态 SQL 即可覆盖所有搜索组合，无需 if-else 分支。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/SearchUsersRequest'
    responses:
      '200':
        description: 搜索结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/PaginatedUserItems'

