      字段可见性：
      - ip_location：具有 admin.audit.read 权限的管理员可见
      - ip_address：具有 admin.audit.read_ip 权限的管理员可见（IP 地址属于敏感 PII，通过独立权限控制）
      - device_summary：从 User-Agent 脱敏提取的设备摘要，不暴露完整 UA 字符串
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin-core.yaml#/AuditLogListRequest'
    responses:
      '200':
