admin_server_config_update_rate_limits:
  post:
    summary: 更新频率限制
    operationId: adminServerConfigUpdateRateLimits
    tags: [admin-core]
    x-idempotency: semantic
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
    description: |
      动态调整 Rate Limit 策略，无需重启服务即可生效。
      
      验证规则：
      - 所有值必须为正整数
      - 全局限速建议范围：100-10000 次/小时
      - 用户限速建议范围：500-50_000 次/小时
      - 认证相关限速建议最小值：验证码发送 >= 3 次/分钟，登录 >= 10 次/10分钟，注册 >= 5 次/10分钟
      - 业务限速建议最小值：创建瞬间 >= 5 次/分钟，创建评论 >= 20 次/分钟，举报 >= 5 次/小时
      
      注意事项：
      - 配置立即生效，影响所有后续请求
      - 降低限制值时，可能导致正常用户受影响，建议谨慎操作
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin-core.yaml#/UpdateRateLimitsRequest'
    responses:
      '200':
        description: 频率限制更新成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

admin_server_config_update_response_defaults:
  post:
    summary: 更新响应默认值
    operationId: adminServerConfigUpdateResponseDefaults
    tags: [admin-core]
    x-idempotency: semantic
    x-error-codes:
      10000: 参数错误
      10200: 权限不足
    description: |
      控制非分页接口的服务端返回数量（如搜索建议条数、热门标签条数、聊天开门时的最近消息条数）。
      
      验证规则：
      - 所有值必须为正整数
      - search_suggest_count：建议范围 1-20
      - trending_tags_count：建议范围 5-100
      - hot_moments_count：建议范围 5-100
      - chat_recent_messages_count：建议范围 10-50
      - group_announcements_count：建议范围 5-50
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin-core.yaml#/UpdateResponseDefaultsRequest'
    responses:
      '200':
        description: 响应默认值更新成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'

