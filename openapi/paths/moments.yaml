# HotSpot API - 生活瞬间与评论模块端点
# 对应原 api_spec_moment.mdc

search:
  post:
    summary: 搜索瞬间（支持关键字/标签/位置组合）
    operationId: momentsSearch
    tags: [moments]
    security: []
    x-idempotency: none
    x-error-codes:
      10000: 参数错误
    description: |
      统一搜索生活瞬间。支持关键字、标签、位置范围三种条件的自由组合。

      说明（Token 可选的搜索语义）：
      - 生活瞬间支持 `privacy_level` 控制可见性：`public`（公开）、`followers`（关注我的人可见）、`friends`（互关好友可见）、`private`（仅自己）
      - 未登录用户仅能访问 `public` 的瞬间
      - 登录态下可访问自己的所有瞬间 + 好友的 `friends` 瞬间 + 关注者的 `followers` 瞬间 + 所有 `public` 瞬间
      - 登录态会返回 `@auth-only` 字段（如 `my_state`）

      排序：默认 `sort_by='relevance'`：按相关性优先排序，同分时以 `created_at` 倒序作为稳定 tie-breaker；`sort_by='distance'`：按距离由近到远排序（需要 `radius`）；`sort_by='newest'`：按发布时间倒序；`sort_by='popular'`：按点赞/评论热度排序
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/moments.yaml#/SearchMomentsRequest'
    responses:
      '200':
        description: 搜索结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/PaginatedMomentItems'

