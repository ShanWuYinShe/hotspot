# HotSpot API - 通用类型定义
# 定义跨模块复用的基础值对象（Domain Primitives）和业务核心对象（Domain Entities）
# 对应原 api_spec_types.mdc + api_spec_errors.mdc

# ============================================================
# 枚举类型
# ============================================================

MessageType:
  type: string
  enum: [text, image, video, audio, file, share, system]
  description: 消息类型

SendMessageType:
  type: string
  enum: [text, image, video, audio, file, share]
  description: 消息发送类型（排除 system）

UserType:
  type: string
  enum: [temp, normal, admin, system]
  description: 用户类型

PrivacyLevel:
  type: string
  enum: [public, followers, friends, private]
  description: |
    隐私级别，层级关系：public > followers > friends > private。
    - public: 所有人可见（包括未登录用户）
    - followers: 关注我的人可见（单向关系）
    - friends: 互关好友可见（双向关系，好友 = 双方互相关注的用户）
    - private: 仅自己可见

GroupRole:
  type: string
  enum: [owner, admin, member]
  description: 群组角色

ClientType:
  type: string
  enum: [web, app]
  description: 客户端类型

UserPresenceStatus:
  type: string
  enum: [online, offline]
  description: 用户在线状态

UserAccountStatus:
  type: string
  enum: [normal, banned]
  description: 账号状态（管理员视角）

ReportStatus:
  type: string
  enum: [pending, reviewing, resolved, dismissed]
  description: 举报状态

ReportTargetType:
  type: string
  enum: [user, moment, comment, message, group]
  description: 举报目标类型

ReportHandleAction:
  type: string
  enum: [resolve, dismiss, escalate]
  description: 举报处理动作

GroupJoinMethod:
  type: string
  enum: [open, approval, invite_only]
  description: 群组加入方式

AnnouncementSeverity:
  type: string
  enum: [info, warning, error]
  description: 公告严重等级

FollowSource:
  type: string
  enum: [moment, search, recommendation, profile, group]
  description: 关注来源（心理学优化：让被关注者了解"为什么被关注"）

RecommendationType:
  type: string
  enum: [friend_liked, nearby, trending, following, tag_match]
  description: 推荐理由类型

# ============================================================
# 地理位置
# ============================================================

GeoPoint:
  type: object
  required: [latitude, longitude]
  description: 基础坐标点（经纬度）
  properties:
    latitude:
      type: number
      minimum: -90
      maximum: 90
    longitude:
      type: number
      minimum: -180
      maximum: 180

Location:
  type: object
  required: [point, location_name]
  description: |
    位置信息（仅用于 request）。
    包含坐标和位置名称。若用户拒绝定位或无法获取精确位置，客户端必须使用默认位置填充。
  properties:
    point:
      $ref: '#/GeoPoint'
    location_name:
      type: string
      maxLength: 100
      description: 位置名称，无名称时使用默认值或空字符串

RelativeLocation:
  type: object
  required: [point, location_name]
  description: |
    相对位置（用于所有 response）。
    distance 和 bearing_degrees 基于 reference_point 计算，且可能被服务端降精度。
    搜索/列表/Feed 场景下 distance/bearing_degrees 有值；详情/Admin/当前用户的内容为 undefined。
  properties:
    point:
      $ref: '#/GeoPoint'
    location_name:
      type: string
    distance:
      type: number
      description: 距离浏览锚点的距离（米），有参考点时有值
    bearing_degrees:
      type: number
      minimum: 0
      exclusiveMaximum: 360
      description: 相对浏览锚点的方位角 [0, 360)，有参考点时有值

# ============================================================
# 分页与搜索
# ============================================================

PaginationParams:
  type: object
  description: 分页请求参数（游标分页）
  properties:
    limit:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
      description: 每页数量
    cursor:
      type: string
      description: 不透明游标字符串，客户端只透传

Pagination:
  type: object
  required: [has_more]
  description: 分页响应元数据
  properties:
    has_more:
      type: boolean
    next_cursor:
      type: string

SearchBaseParams:
  type: object
  required: [reference_point]
  description: |
    搜索基础参数（包含浏览锚点位置，组合分页参数）。
    reference_point 是客户端必须传入的有效地理位置，即使是纯关键字搜索，
    服务端也可能利用 reference_point 优化排序（附近的结果更靠前）。
  properties:
    pagination:
      $ref: '#/PaginationParams'
    reference_point:
      $ref: '#/GeoPoint'

# ============================================================
# 媒体资源
# ============================================================

MessageMedia:
  type: object
  required: [url]
  description: 消息附件/媒体信息
  properties:
    url:
      type: string
      format: uri
    thumbnail_url:
      type: string
      format: uri
    file_name:
      type: string
    file_size:
      type: integer
    duration:
      type: number
    width:
      type: integer
    height:
      type: integer
    mime_type:
      type: string

RecommendationContext:
  type: object
  required: [type]
  properties:
    type:
      $ref: '#/RecommendationType'

# ============================================================
# 领域实体：用户 (User)
# ============================================================

UserInfo:
  type: object
  required: [user_id, nickname]
  description: 用户基础信息（用于嵌套在其他对象中）
  properties:
    user_id:
      type: string
      description: 目标用户 ID
    nickname:
      type: string
      minLength: 1
      maxLength: 30
      description: 用户昵称
    avatar_url:
      type: string
      format: uri

UserStats:
  type: object
  required: [moments_count, friends_count, followers_count, following_count, groups_count]
  description: 用户统计信息
  properties:
    moments_count:
      type: integer
    friends_count:
      type: integer
      description: 好友数量（好友 = 互相关注）
    followers_count:
      type: integer
    following_count:
      type: integer
    groups_count:
      type: integer

Relationship:
  type: object
  required: [is_following, is_followed_by, is_blocked, is_blocked_by]
  description: 用户关系信息（@auth-only）
  x-visibility: auth-only
  properties:
    is_following:
      type: boolean
      description: 我是否关注了对方
    is_followed_by:
      type: boolean
      description: 对方是否关注了我
    is_blocked:
      type: boolean
      description: 我是否拉黑了对方
    is_blocked_by:
      type: boolean
      description: 对方是否拉黑了我

SocialContext:
  type: object
  required: [mutual_friends_count]
  description: 社交上下文（@auth-only，详情页/Feed 返回，搜索/列表不返回）
  x-visibility: auth-only
  properties:
    mutual_friends_count:
      type: integer
      description: 共同好友数
    mutual_friends_preview:
      type: array
      description: 前 2-3 个共同好友
      items:
        $ref: '#/UserInfo'
    common_groups_count:
      type: integer
      description: 共同群组数
    common_tags:
      type: array
      description: 共同兴趣标签
      items:
        type: string

UserItem:
  type: object
  required: [user]
  description: |
    用户统一数据类型（用于列表、搜索、详情、Feed 等所有场景）。
    管理员使用普通 API 时与普通用户无区别：使用相同端点、获得相同响应形态。
  properties:
    user:
      $ref: '#/UserInfo'
    bio:
      type: string
      maxLength: 500
      description: 个人简介
    tags:
      type: array
      maxItems: 10
      items:
        type: string
        maxLength: 30
      description: 标签列表
    presence_status:
      $ref: '#/UserPresenceStatus'
      description: 隐私受控字段（隐私限制时不返回）
    last_online:
      type: string
      format: date-time
      description: 最后在线时间（offline 时有值），精度截断到分钟
    location:
      $ref: '#/RelativeLocation'
    stats:
      $ref: '#/UserStats'
      description: 统计信息（详情页返回，搜索/列表可选返回）
    relation:
      $ref: '#/Relationship'
      x-visibility: auth-only
    social_context:
      $ref: '#/SocialContext'
      x-visibility: auth-only

# ============================================================
# 领域实体：群组 (Group)
# ============================================================

GroupInfo:
  type: object
  required: [group_id, name, members_count]
  description: 群组基础信息（用于嵌套在其他对象中）
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: 名称
    avatar_url:
      type: string
      format: uri
    members_count:
      type: integer

GroupSettings:
  type: object
  required: [join_method, is_searchable, max_members, location]
  description: 群组设置（可修改的配置项）
  properties:
    join_method:
      $ref: '#/GroupJoinMethod'
      description: 加入方式
    is_searchable:
      type: boolean
      description: 是否可被搜索发现
    max_members:
      type: integer
      minimum: 2
      maximum: 2000
      description: 最大成员数
    location:
      $ref: '#/Location'
      description: 直接映射自请求，不经过距离/角度计算

MyGroupState:
  type: object
  required: [role, is_joined, unread_count, is_muted, is_pinned]
  description: 我在群内的状态（@auth-only）
  x-visibility: auth-only
  properties:
    role:
      $ref: '#/GroupRole'
      description: 角色
    is_joined:
      type: boolean
    unread_count:
      type: integer
    is_muted:
      type: boolean
      description: 是否静音
    is_pinned:
      type: boolean
      description: 是否置顶
    joined_at:
      type: string
      format: date-time

GroupItem:
  type: object
  required: [group, has_password, location]
  description: |
    群组统一数据类型（用于列表、搜索、详情、Feed 等所有场景）。
    搜索/列表场景下 location 的 distance/bearing_degrees 有值；详情场景为 undefined。
  properties:
    group:
      $ref: '#/GroupInfo'
    description:
      type: string
      maxLength: 500
      description: 描述说明
    tags:
      type: array
      maxItems: 10
      items:
        type: string
      description: 标签列表
    has_password:
      type: boolean
    location:
      $ref: '#/RelativeLocation'
    last_activity_at:
      type: string
      format: date-time
      description: 最近活跃时间（列表/详情页返回）
    created_at:
      type: string
      format: date-time
      description: 详情页返回，搜索/列表不返回
    owner_id:
      type: string
      description: 详情页返回，搜索/列表不返回
    my_state:
      $ref: '#/MyGroupState'
      x-visibility: auth-only
    friends_in_group:
      type: integer
      description: Feed 场景返回（好友中有多少在该群组内）
    join_method:
      $ref: '#/GroupJoinMethod'
      x-visibility: group-admin-only
      description: 加入方式
    is_searchable:
      type: boolean
      x-visibility: group-admin-only
      description: 是否可被搜索发现
    max_members:
      type: integer
      x-visibility: group-admin-only
      description: 最大成员数
    settings_location:
      $ref: '#/Location'
      description: 群组配置位置（原始 Location，非 RelativeLocation）
      x-visibility: group-admin-only

GroupAnnouncementItem:
  type: object
  required: [announcement_id, group_id, title, content, created_by, created_at, is_pinned]
  description: 群公告列表项
  properties:
    announcement_id:
      type: string
      description: 公告 ID
    group_id:
      type: string
      description: 目标群组 ID
    title:
      type: string
      minLength: 1
      maxLength: 100
      description: 标题
    content:
      type: string
      minLength: 1
      maxLength: 5000
      description: 文本内容
    created_by:
      $ref: '#/UserInfo'
    created_at:
      type: string
      format: date-time
    is_pinned:
      type: boolean
      description: 是否置顶

# ============================================================
# 领域实体：系统公告
# ============================================================

SystemAnnouncementItem:
  type: object
  required: [announcement_id, title, content, severity, created_at]
  description: 系统公告列表项
  properties:
    announcement_id:
      type: string
      description: 公告 ID
    title:
      type: string
      description: 标题
    content:
      type: string
      description: 文本内容
    severity:
      $ref: '#/AnnouncementSeverity'
    action_url:
      type: string
      format: uri
      description: 点击跳转链接
    created_at:
      type: string
      format: date-time

# ============================================================
# 领域实体：生活瞬间 (Moment)
# ============================================================

MomentImage:
  type: object
  required: [url]
  properties:
    url:
      type: string
      format: uri
    thumbnail_url:
      type: string
      format: uri
      description: 缩略图 URL（列表/Feed 场景使用）
    width:
      type: integer
    height:
      type: integer
    content_type:
      type: string

MomentItem:
  type: object
  required: [moment_id, description, tags, created_at, likes_count, comments_count, shares_count, user, location]
  description: |
    瞬间统一数据类型（用于列表、搜索、详情、Feed、用户瞬间历史等所有场景）。
    privacy_level 不对非拥有者暴露，生活瞬间的可见性由服务端过滤控制。
  properties:
    moment_id:
      type: string
      description: 瞬间 ID
    description:
      type: string
      minLength: 1
      maxLength: 2000
      description: 描述说明
    images:
      type: array
      maxItems: 9
      items:
        $ref: '#/MomentImage'
    tags:
      type: array
      maxItems: 10
      items:
        type: string
      description: 标签列表
    mentions:
      type: array
      maxItems: 20
      items:
        type: string
      description: '@ 提及的用户 ID 列表'
    created_at:
      type: string
      format: date-time
    likes_count:
      type: integer
    comments_count:
      type: integer
    shares_count:
      type: integer
    user:
      $ref: '#/UserInfo'
    location:
      $ref: '#/RelativeLocation'
    privacy_level:
      $ref: '#/PrivacyLevel'
      description: 仅资源拥有者可见
      x-visibility: owner-only
    my_state:
      type: object
      x-visibility: auth-only
      properties:
        is_liked:
          type: boolean
          description: 当前用户是否已点赞
        is_favorited:
          type: boolean
          description: 当前用户是否已收藏
    recommendation:
      $ref: '#/RecommendationContext'
      description: Feed 场景返回（推荐理由）

# ============================================================
# 领域实体：消息 (Message)
# ============================================================

MessageReplyTo:
  type: object
  required: [message_id, user_id, nickname, content]
  description: 回复引用快照
  properties:
    message_id:
      type: string
      description: 消息 ID
    user_id:
      type: string
      description: 目标用户 ID
    nickname:
      type: string
      description: 用户昵称
    content:
      type: string
      description: 文本预览
    share_code:
      type: string
      description: 分享码
MessageSent:
  type: object
  required: [message_id, sent_at]
  description: 消息发送响应（私聊/群聊共用，支持客户端乐观更新）
  properties:
    message_id:
      type: string
      description: 消息 ID
    sent_at:
      type: string
      format: date-time
      description: 服务端确定的发送时间

# ============================================================
# 业务错误码
# ============================================================

BusinessErrorCode:
  type: integer
  description: |
    业务错误码。0 = 成功，非 0 = 业务错误。

    错误码的职责是告诉客户端**该做什么**（刷新 token / 跳登录 / 显示提示 / 重试），
    而不是**发生了什么**。`message` 描述具体业务场景，客户端**禁止**解析 message 来决定行为。

    ### HTTP API 业务错误码（10000–19999）

    | 错误码 | 类型 | 客户端行为 |
    |--------|------|-----------|
    | `10000` | 参数错误 | 显示 message，引导用户修正输入 |
    | `10100` | 认证失败 | 尝试刷新 token，失败则跳登录页；登录表单场景直接显示 message |
    | `10200` | 权限不足/访问受限 | 显示 message |
    | `10201` | 账号被封禁 | **强制登出** + 显示封禁页 |
    | `10300` | 资源不存在 | 显示"不存在"提示 |
    | `10400` | 业务冲突 | 显示 message |
    | `10500` | 请求过于频繁 | 按 `Retry-After` 响应头等待后重试 |
    | `10600` | 服务器错误 | 显示"服务异常"提示 |

    ### 幂等性错误码（22000–22099）

    | 错误码 | 类型 | 客户端行为 |
    |--------|------|-----------|
    | `22000` | 幂等键冲突 | 换新 Idempotency-Key 重试 |
    | `22001` | 幂等缓存失效 | 换新 Idempotency-Key 重试 |
    | `22002` | 幂等操作进行中 | 等待后使用相同 Key 重试 |

    ### 通用隐含错误码

    以下错误码适用于所有需要认证的端点，**不在各端点单独列出**：
    `10100`（认证失败）、`10201`（账号封禁）、`10500`（请求频繁）、`10600`（服务器错误）

# ============================================================
# API 响应信封
# ============================================================

ApiResponse:
  type: object
  required: [code]
  description: |
    统一响应信封。仅当 HTTP 200 时才返回此结构。
    - code = 0：业务成功，data 字段包含响应数据
    - code != 0：业务错误，message 字段包含错误描述
    HTTP 非 200 视为请求失败（网络/网关/服务器错误），不进入业务层处理。
  properties:
    code:
      $ref: '#/BusinessErrorCode'
    message:
      type: string
      description: 错误描述（code != 0 时必须返回）

# ============================================================
# 列表响应类型
# ============================================================

GroupAnnouncementItemList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupAnnouncementItem'

PaginatedGroupItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupItem'
    pagination:
      $ref: '#/Pagination'

PaginatedMomentItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/MomentItem'
    pagination:
      $ref: '#/Pagination'

PaginatedUserInfos:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/UserInfo'
    pagination:
      $ref: '#/Pagination'

PaginatedUserItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/UserItem'
    pagination:
      $ref: '#/Pagination'

SystemAnnouncementItemList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/SystemAnnouncementItem'
