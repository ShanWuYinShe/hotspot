# HotSpot API - 聊天模块类型定义
# 对应原 api_spec_chat.mdc 中的类型定义

# ============================================================
# 枚举
# ============================================================

CantMessageReason:
  type: string
  enum: [blocked, privacy, stranger_limit, account_suspended]
  description: 不可发消息原因

# ============================================================
# 私聊类型
# ============================================================

PrivateChatItem:
  type: object
  required: [other_user, unread_count, is_muted, is_pinned, last_activity_at, can_message]
  description: 私聊统一数据类型（用于列表、详情等所有场景）
  properties:
    other_user:
      $ref: './common.yaml#/UserInfo'
    unread_count:
      type: integer
    is_muted:
      type: boolean
      description: 是否静音
    is_pinned:
      type: boolean
      description: 是否置顶
    last_activity_at:
      type: string
      format: date-time
    last_message:
      type: object
      description: 列表场景返回
      properties:
        message_id:
          type: string
          description: 最后一条消息 ID
        content:
          type: string
          description: 消息内容
        type:
          $ref: './common.yaml#/MessageType'
        share_code:
          type: string
          description: 分享码
        sender_id:
          type: string
          description: 发送者用户 ID
        sent_at:
          type: string
          format: date-time
    presence_status:
      $ref: './common.yaml#/UserPresenceStatus'
      description: 隐私受控（对方隐私设置时不返回）
    created_at:
      type: string
      format: date-time
      description: 详情场景返回
    can_message:
      type: boolean
    cant_message_reason:
      $ref: '#/CantMessageReason'
      description: 仅 can_message=false 时返回

PrivateChatOpenResult:
  type: object
  required: [chat, recent_messages]
  description: 私聊详情响应，始终返回最近消息列表
  properties:
    chat:
      $ref: '#/PrivateChatItem'
    recent_messages:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/PrivateMessageItem'
        pagination:
          $ref: './common.yaml#/Pagination'

PrivateMessageItem:
  type: object
  required: [message_id, type, sender_id, sent_at]
  description: 私聊消息项
  properties:
    message_id:
      type: string
      description: 消息 ID
    type:
      $ref: './common.yaml#/MessageType'
    content:
      type: string
      description: 消息文本内容
    media:
      $ref: './common.yaml#/MessageMedia'
    share_code:
      type: string
      description: 分享码
    sender_id:
      type: string
      description: 私聊场景：会话双方已知，只需 ID
    reply_to:
      $ref: './common.yaml#/MessageReplyTo'
    sent_at:
      type: string
      format: date-time
    edited_at:
      type: string
      format: date-time
    recalled_at:
      type: string
      format: date-time
      description: 存在即表示已撤回
    is_read:
      type: boolean
      description: 消息是否已被对方读取

# ============================================================
# 群聊类型
# ============================================================

GroupMessageItem:
  type: object
  required: [message_id, type, sender, sent_at]
  description: |
    群聊消息项。设计说明：群聊消息使用 sender: UserInfo 而非 sender_id: string，
    因为群聊场景下客户端需要显示发送者头像/昵称等信息，且群成员数量多变、
    不一定在本地缓存中。私聊消息使用 sender_id 是因为双方信息已通过
    PrivateChatItem.other_user 获取，无需重复传输。
  properties:
    message_id:
      type: string
      description: 消息 ID
    type:
      $ref: './common.yaml#/MessageType'
    content:
      type: string
      description: 消息文本内容
    media:
      $ref: './common.yaml#/MessageMedia'
    share_code:
      type: string
      description: 分享码
    sender:
      $ref: './common.yaml#/UserInfo'
      description: 群聊场景：需要完整用户信息
    reply_to:
      $ref: './common.yaml#/MessageReplyTo'
    mentions:
      type: array
      description: "@UserIDs"
      items:
        type: string
    recalled_by:
      type: string
      description: 撤回操作者用户 ID
    sent_at:
      type: string
      format: date-time
    edited_at:
      type: string
      format: date-time
    recalled_at:
      type: string
      format: date-time
      description: 存在即表示已撤回
    read_count:
      type: integer
      description: 已读人数

# ============================================================
# 请求类型
# ============================================================

MyPrivateChatsRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'

PrivateChatOpenTheDoorRequest:
  type: object
  required: [target_user_id]
  properties:
    target_user_id:
      type: string
      description: 对方用户 ID
UpdatePrivateChatSettingsRequest:
  type: object
  required: [target_user_id]
  properties:
    target_user_id:
      type: string
      description: 对方用户 ID
    is_muted:
      type: boolean
      description: 是否静音
    is_pinned:
      type: boolean
      description: 是否置顶
DeletePrivateChatRequest:
  type: object
  required: [target_user_id]
  properties:
    target_user_id:
      type: string
      description: 对方用户 ID
SendPrivateMessageRequest:
  type: object
  required: [target_user_id, type]
  properties:
    target_user_id:
      type: string
      description: 接收方用户 ID
    type:
      $ref: './common.yaml#/SendMessageType'
    content:
      type: string
      minLength: 1
      maxLength: 5000
      description: 消息文本内容
    file_id:
      type: string
      description: 文件 ID（发送图片/文件消息时传入）
    share_code:
      type: string
      description: 分享码
    reply_to_message_id:
      type: string
      description: 引用回复的消息 ID
GetPrivateMessagesHistoryRequest:
  type: object
  required: [target_user_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    target_user_id:
      type: string
      description: 对方用户 ID
UpdatePrivateMessageRequest:
  type: object
  required: [message_id, content]
  properties:
    message_id:
      type: string
      description: 消息 ID
    content:
      type: string
      description: 修改后的消息内容
RecallPrivateMessageRequest:
  type: object
  required: [message_id]
  properties:
    message_id:
      type: string
      description: 消息 ID
MarkPrivateMessagesReadRequest:
  type: object
  properties:
    target_user_id:
      type: string
      description: 指定会话；不传时标记全部私聊
    up_to_message_id:
      type: string
      description: 标记截至此消息；不传时标记该会话全部

SendGroupMessageRequest:
  type: object
  required: [group_id, type]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    type:
      $ref: './common.yaml#/SendMessageType'
    content:
      type: string
      minLength: 1
      maxLength: 5000
      description: 消息文本内容
    file_id:
      type: string
      description: 文件 ID（发送图片/文件消息时传入）
    share_code:
      type: string
      description: 分享码
    reply_to_message_id:
      type: string
      description: 引用回复的消息 ID
    mentions:
      type: array
      items:
        type: string
      maxItems: 20
      description: '@ 提及的用户 ID 列表'
GetGroupMessagesHistoryRequest:
  type: object
  required: [group_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    group_id:
      type: string
      description: 目标群组 ID
    include_system:
      type: boolean
      description: 是否包含系统消息
UpdateGroupMessageRequest:
  type: object
  required: [message_id, content]
  properties:
    message_id:
      type: string
      description: 消息 ID
    content:
      type: string
      description: 修改后的消息内容
RecallGroupMessageRequest:
  type: object
  required: [message_id]
  properties:
    message_id:
      type: string
      description: 消息 ID
MarkGroupMessagesReadRequest:
  type: object
  properties:
    group_id:
      type: string
      description: 指定群组；不传时标记全部群聊
    up_to_message_id:
      type: string
      description: 标记截至此消息；不传时标记该群全部

# ============================================================
# 列表响应类型
# ============================================================

PaginatedGroupMessageItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupMessageItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedPrivateChatItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/PrivateChatItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedPrivateMessageItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/PrivateMessageItem'
    pagination:
      $ref: './common.yaml#/Pagination'
