# HotSpot API - 认证模块类型定义
# 对应原 api_spec_auth.mdc 中的类型定义

# ============================================================
# 枚举
# ============================================================

CaptchaScene:
  type: string
  enum: [register, login, reset_password]
  description: CAPTCHA 验证场景

VerificationCodeType:
  type: string
  enum: [register, reset_password, login]
  description: 验证码类型

# ============================================================
# CAPTCHA 人机验证
# ============================================================

CaptchaRequest:
  type: object
  required: [scene]
  properties:
    scene:
      $ref: '#/CaptchaScene'

CaptchaChallenge:
  type: object
  required: [captcha_id, image_url, expires_at]
  properties:
    captcha_id:
      type: string
      description: CAPTCHA 验证 ID
    image_url:
      type: string
      format: uri
      description: 验证码图片 URL
    expires_at:
      type: string
      format: date-time
      description: 有效期（建议 2 分钟）

VerifyCaptchaRequest:
  type: object
  required: [captcha_id, answer]
  properties:
    captcha_id:
      type: string
      description: CAPTCHA 验证 ID
    answer:
      type: string
      description: 用户输入的验证码答案
CaptchaVerified:
  type: object
  required: [captcha_token, expires_at]
  description: captcha_token 为一次性凭证，使用后立即失效，有效期建议 5 分钟
  properties:
    captcha_token:
      type: string
      description: 短期有效凭证，一次性
    expires_at:
      type: string
      format: date-time

# ============================================================
# Token 响应类型
# ============================================================

AuthTokenPairWeb:
  type: object
  description: |
    Web 端认证响应。响应体为空对象（data: {}），Token 通过 Set-Cookie 响应头传递：
    - Cookie `access_token`：`HttpOnly; Secure; SameSite=Strict; Path=/api; Max-Age=<ttl>`
    - Cookie `refresh_token`：`HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh_token; Max-Age=<ttl>`
    前端不可读取 Cookie 内容，也不应手动操作。

AuthTokenPairApp:
  type: object
  required: [user_id, access_token, refresh_token, access_token_expires_at, refresh_token_expires_at]
  description: App 端认证响应。客户端负责安全存储（Keychain/Keystore）。
  properties:
    user_id:
      type: string
      description: 目标用户 ID
    access_token:
      type: string
    refresh_token:
      type: string
    access_token_expires_at:
      type: string
      format: date-time
    refresh_token_expires_at:
      type: string
      format: date-time

AuthTokenResponse:
  description: |
    认证 Token 响应（按 client_type 区分）。
    Web 端（client_type='web'）：data 为空对象，Token 通过 Set-Cookie 传递（Cookie 名：access_token / refresh_token）。
    App 端（client_type='app'）：data 包含 access_token、refresh_token 及各自过期时间。
  oneOf:
  - $ref: '#/AuthTokenPairWeb'
  - $ref: '#/AuthTokenPairApp'

# ============================================================
# 会话与状态
# ============================================================

SessionItem:
  type: object
  required: [session_id, created_at, last_active_at, is_current]
  properties:
    session_id:
      type: string
      description: 会话标识，用于展示和撤销操作
    device_type:
      type: string
      description: 设备类型
    device_name:
      type: string
      description: 设备名称
    ip_address:
      type: string
      description: 脱敏显示（如 "192.168.xxx.xxx"）
    ip_location:
      type: string
      description: IP 地理位置（如 "北京市"）
    created_at:
      type: string
      format: date-time
    last_active_at:
      type: string
      format: date-time
    is_current:
      type: boolean

AuthStatus:
  type: object
  required: [is_valid]
  description: 如需完整用户信息（nickname、头像等），应调用 /api/v1/users/me/profile/get
  properties:
    is_valid:
      type: boolean
    expires_at:
      type: string
      format: date-time
      description: 仅当 is_valid === true 时返回

# ============================================================
# 请求类型
# ============================================================

RegisterRequest:
  type: object
  required: [login_id, nickname, password, client_type]
  properties:
    login_id:
      type: string
      minLength: 3
      maxLength: 20
      description: 登录账号（3-20 字符）
    nickname:
      type: string
      minLength: 2
      maxLength: 20
      description: 用户昵称（2-20 字符）
    password:
      type: string
      minLength: 8
      maxLength: 64
      description: 密码（8-64 字符，至少含字母和数字）
    client_type:
      $ref: './common.yaml#/ClientType'
    verify_token:
      type: string
      description: |
        当 ClientConfig.features.require_phone_verification 为 true 时必填。
        来自 verify_code 接口。

LoginRequest:
  type: object
  required: [login_id, client_type]
  description: password 和 verify_token 二选一，不可同时为空
  properties:
    login_id:
      type: string
      description: 手机号/邮箱/用户名
    password:
      type: string
      description: 密码登录时必填
    verify_token:
      type: string
      description: 验证码登录时必填（来自 verify_code 接口，type='login'）
    client_type:
      $ref: './common.yaml#/ClientType'

GuestRequest:
  type: object
  required: [nickname, client_type]
  properties:
    nickname:
      type: string
      minLength: 2
      maxLength: 20
      description: 游客昵称（2-20 字符）
    client_type:
      $ref: './common.yaml#/ClientType'

RefreshTokenRequest:
  type: object
  required: [client_type]
  description: App 端必须携带 refresh_token，Web 端留空（使用 Cookie）
  properties:
    client_type:
      $ref: './common.yaml#/ClientType'
      description: 客户端类型（web / app）
    refresh_token:
      type: string
      description: App 端必填，Web 端留空

SendVerificationCodeRequest:
  type: object
  required: [phone, type, captcha_token]
  properties:
    phone:
      type: string
      description: 目标手机号
    type:
      $ref: '#/VerificationCodeType'
    captcha_token:
      type: string
      description: 必填（来自 captcha/verify）。受 ClientConfig.features.require_captcha 开关控制。

VerificationCodeSent:
  type: object
  required: [code_id, expires_at]
  properties:
    code_id:
      type: string
      description: 验证码 ID
    expires_at:
      type: string
      format: date-time
    retry_after:
      type: integer
      description: 重试等待秒数

VerifyCodeRequest:
  type: object
  required: [code_id, code]
  properties:
    code_id:
      type: string
      description: 验证码请求 ID（send_verification_code 返回）
    code:
      type: string
      description: 用户输入的验证码
VerificationResult:
  type: object
  required: [verified, verify_token, expires_at]
  properties:
    verified:
      type: boolean
      description: 是否验证成功
    verify_token:
      type: string
      description: 验证成功后的凭证（用于后续操作）
    expires_at:
      type: string
      format: date-time

ResetPasswordRequest:
  type: object
  required: [login_id, verify_token, new_password]
  properties:
    login_id:
      type: string
      description: 手机号或邮箱（用于验证 verify_token 的绑定）
    verify_token:
      type: string
      description: 来自 verify_code 接口，短期有效
    new_password:
      type: string
      minLength: 8
      maxLength: 64
      description: 新密码（8-64 字符）

ChangePasswordRequest:
  type: object
  required: [old_password, new_password]
  properties:
    old_password:
      type: string
      description: 当前密码
    new_password:
      type: string
      minLength: 8
      maxLength: 64
      description: 新密码（8-64 字符）

RevokeSessionRequest:
  type: object
  required: [session_id]
  properties:
    session_id:
      type: string
      description: 来自 SessionItem.session_id

RevokeAllResult:
  type: object
  required: [revoked_count]
  properties:
    revoked_count:
      type: integer
      description: 被撤销的会话数量

# ============================================================
# 列表响应类型
# ============================================================

SessionItemList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/SessionItem'
