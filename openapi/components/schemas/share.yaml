# HotSpot API - Share 类型定义
# 对应原 api_spec_share.mdc 中的类型定义

# ============================================================
# 枚举
# ============================================================

ShareType:
  type: string
  enum: [user, group, moment, reference_point]
  description: 分享目标类型

# ============================================================
# 分享基础类型
# ============================================================

ShareCode:
  type: string
  description: |
    分享码规则：
    - 字符集：[A-HJ-NP-Z2-9] 共 32 个字符（排除易混淆字符 0/O/1/I）
    - 长度：8 位
    - 大小写：不区分大小写，服务端统一转换为大写
    - 校验：必须完全匹配字符集与长度，禁止空格、连字符、前后缀

UserSharePayload:
  type: object
  required: [user_id]
  properties:
    user_id:
      type: string
      description: 分享的用户 ID
GroupSharePayload:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 分享的群组 ID
MomentSharePayload:
  type: object
  required: [moment_id]
  properties:
    moment_id:
      type: string
      description: 分享的瞬间 ID
ReferencePointSharePayload:
  type: object
  required: [reference_point]
  properties:
    reference_point:
      $ref: './common.yaml#/Location'

SharePayload:
  description: 分享载荷（联合类型）
  oneOf:
  - $ref: '#/UserSharePayload'
  - $ref: '#/GroupSharePayload'
  - $ref: '#/MomentSharePayload'
  - $ref: '#/ReferencePointSharePayload'

SharePreview:
  type: object
  required: [title]
  description: 展示用摘要，服务端可根据权限与可见性策略选择是否返回
  properties:
    title:
      type: string
      description: 分享预览标题
    subtitle:
      type: string
      description: 分享预览副标题
    cover_url:
      type: string
      format: uri
      description: 分享预览封面 URL

ShareBase:
  type: object
  required: [share_id, share_code, share_type, creator, created_at]
  properties:
    share_id:
      type: string
      description: 分享 ID
    share_code:
      $ref: '#/ShareCode'
      description: 分享码
    share_type:
      $ref: '#/ShareType'
    creator:
      $ref: './common.yaml#/UserInfo'
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
      description: 过期时间

ShareCreated:
  type: object
  required: [share_id, share_code]
  properties:
    share_id:
      type: string
      description: 分享 ID
    share_code:
      $ref: '#/ShareCode'
      description: 分享码
    expires_at:
      type: string
      format: date-time

ShareDetail:
  type: object
  required: [share, payload]
  properties:
    share:
      $ref: '#/ShareBase'
    payload:
      $ref: '#/SharePayload'
    preview:
      $ref: '#/SharePreview'

ShareApplyAction:
  description: 分享应用动作（联合类型）
  oneOf:
  - type: object
    required: [type, user_id]
    properties:
      type:
        type: string
        enum: [navigate_user]
      user_id:
        type: string
  - type: object
    required: [type, group_id]
    properties:
      type:
        type: string
        enum: [navigate_group]
      group_id:
        type: string
  - type: object
    required: [type, moment_id]
    properties:
      type:
        type: string
        enum: [navigate_moment]
      moment_id:
        type: string
  - type: object
    required: [type, reference_point]
    properties:
      type:
        type: string
        enum: [update_reference_point]
      reference_point:
        $ref: './common.yaml#/Location'

ShareApplyResult:
  type: object
  required: [share_type, action]
  properties:
    share_type:
      $ref: '#/ShareType'
    action:
      $ref: '#/ShareApplyAction'
      description: 处理动作
ShareListItem:
  type: object
  required: [share_id, share_code, share_type, created_at, is_revoked]
  description: 分享列表项（我的分享管理）
  properties:
    share_id:
      type: string
      description: 分享 ID
    share_code:
      $ref: '#/ShareCode'
      description: 分享码
    share_type:
      $ref: '#/ShareType'
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    is_revoked:
      type: boolean
      description: 是否已撤销
    preview:
      $ref: '#/SharePreview'
      description: 分享目标的摘要预览

# ============================================================
# 请求类型
# ============================================================

CreateShareRequest:
  type: object
  required: [share_type, payload]
  properties:
    share_type:
      $ref: '#/ShareType'
    payload:
      $ref: '#/SharePayload'
    expires_in_seconds:
      type: integer
      minimum: 1
      description: 可选，默认由系统配置

GetShareRequest:
  type: object
  required: [share_code]
  properties:
    share_code:
      $ref: '#/ShareCode'
      description: 不区分大小写，服务端统一转换为大写

ApplyShareRequest:
  type: object
  required: [share_code]
  properties:
    share_code:
      $ref: '#/ShareCode'
      description: 不区分大小写，服务端统一转换为大写

ShareListRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    share_type:
      $ref: '#/ShareType'
      description: 按类型筛选

RevokeShareRequest:
  type: object
  required: [share_id]
  properties:
    share_id:
      type: string
      description: 要撤销的分享 ID

# ============================================================
# 列表响应类型
# ============================================================

PaginatedShareListItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/ShareListItem'
    pagination:
      $ref: './common.yaml#/Pagination'
