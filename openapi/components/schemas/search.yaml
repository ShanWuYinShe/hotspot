# HotSpot API - Search 类型定义
# 对应原 api_spec_search.mdc 中的类型定义

# ============================================================
# 枚举
# ============================================================

TagTrend:
  type: string
  enum: [rising, stable, falling]
  description: 标签趋势

TagTimeframe:
  type: string
  enum: [daily, weekly, monthly]
  description: 标签时间范围

SearchSuggestType:
  type: string
  enum: [tag, user, group, moment]
  description: 搜索建议类型（支持按类型过滤）

# ============================================================
# 标签类型
# ============================================================

TagSuggestItem:
  type: object
  required: [name, usage_count]
  properties:
    name:
      type: string
      description: 标签名
    usage_count:
      type: integer
      description: 使用次数
TagItem:
  type: object
  required: [name, usage_count]
  properties:
    name:
      type: string
      description: 标签名
    usage_count:
      type: integer
      description: 使用次数
    trend:
      $ref: '#/TagTrend'

# ============================================================
# 搜索建议类型
# ============================================================

UserSuggestItem:
  type: object
  required: [user_id, nickname]
  properties:
    user_id:
      type: string
      description: 目标用户 ID
    nickname:
      type: string
      description: 用户昵称
    avatar_url:
      type: string
      format: uri
    bio:
      type: string
      description: 个人简介
    location:
      $ref: './common.yaml#/RelativeLocation'

GroupSuggestItem:
  type: object
  required: [group_id, name, members_count]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    name:
      type: string
      description: 名称
    avatar_url:
      type: string
      format: uri
    description:
      type: string
      description: 描述说明
    members_count:
      type: integer
    location:
      $ref: './common.yaml#/RelativeLocation'

MomentSuggestItem:
  type: object
  required: [moment_id, content, author_nickname]
  properties:
    moment_id:
      type: string
      description: 瞬间 ID
    content:
      type: string
      description: 内容摘要
    author_nickname:
      type: string
      description: 作者昵称
    author_avatar_url:
      type: string
      format: uri
      description: 作者头像 URL
    location:
      $ref: './common.yaml#/RelativeLocation'

SearchSuggestItem:
  description: 搜索建议项（联合类型）
  oneOf:
  - type: object
    required: [type, payload]
    properties:
      type:
        type: string
        enum: [tag]
      payload:
        $ref: '#/TagSuggestItem'
  - type: object
    required: [type, payload]
    properties:
      type:
        type: string
        enum: [user]
      payload:
        $ref: '#/UserSuggestItem'
  - type: object
    required: [type, payload]
    properties:
      type:
        type: string
        enum: [group]
      payload:
        $ref: '#/GroupSuggestItem'
  - type: object
    required: [type, payload]
    properties:
      type:
        type: string
        enum: [moment]
      payload:
        $ref: '#/MomentSuggestItem'

SearchSuggestResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/SearchSuggestItem'

# ============================================================
# 请求类型
# ============================================================

SearchSuggestRequest:
  type: object
  required: [prefix, reference_point]
  properties:
    prefix:
      type: string
      description: 搜索前缀
    reference_point:
      $ref: './common.yaml#/GeoPoint'
      description: 必填，用于 LBS 优先排序（用户拒绝定位时使用 fallback）
    types:
      type: array
      items:
        $ref: '#/SearchSuggestType'
      description: 可选：限定返回的类型（如 ['user', 'group']）。为空则返回所有类型。

TrendingTagsRequest:
  type: object
  properties:
    timeframe:
      $ref: '#/TagTimeframe'
