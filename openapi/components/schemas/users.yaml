# HotSpot API - 用户模块类型定义
# 对应原 api_spec_user.mdc 中的类型定义

# ============================================================
# 枚举
# ============================================================

Gender:
  type: string
  enum: [male, female, apache_helicopter]
  description: 性别枚举

PrivateChatPermission:
  type: string
  enum: [everyone, friends, nobody]
  description: |
    私聊权限。
    'friends' 表示"仅好友"，好友 = 双方互相关注的用户

# ============================================================
# 用户资料与设置
# ============================================================

MyProfile:
  type: object
  required: [user_id, nickname, user_type, location, presence_status, last_online, created_at, stats]
  description: |
    我的资料（/me/profile/get 返回）。
    user_type 仅在"我的资料"中返回，UserInfo 不包含此字段。
  properties:
    user_id:
      type: string
      description: 用户 ID
    nickname:
      type: string
      minLength: 1
      maxLength: 30
      description: 用户昵称
    avatar_url:
      type: string
      format: uri
      description: 头像 URL
    user_type:
      $ref: './common.yaml#/UserType'
      description: 仅在"我的资料"中返回
    bio:
      type: string
      maxLength: 500
      description: 个人简介
    tags:
      type: array
      maxItems: 10
      items:
        type: string
        maxLength: 30
      description: 用户标签
    gender:
      $ref: '#/Gender'
      description: 性别
    email:
      type: string
      description: 电子邮箱
    phone:
      type: string
      description: 手机号
    location:
      $ref: './common.yaml#/Location'
      description: 直接映射自请求，不经过距离/角度计算
    presence_status:
      $ref: './common.yaml#/UserPresenceStatus'
    last_online:
      type: string
      format: date-time
      description: 最后在线时间
    created_at:
      type: string
      format: date-time
    stats:
      $ref: './common.yaml#/UserStats'

UserSettings:
  type: object
  required: [privacy_level, location_visible, presence_visible, friends_visible, following_visible, followers_visible, groups_visible, liked_moments_visible, stats_visible, allow_follow, 
      allow_private_chat, searchable, phone_searchable, nickname_searchable, location_searchable]
  description: 用户设置
  properties:
    privacy_level:
      $ref: './common.yaml#/PrivacyLevel'
    location_visible:
      type: boolean
    presence_visible:
      type: boolean
      description: 在线状态和最后在线时间的可见性（统一控制）
    friends_visible:
      $ref: './common.yaml#/PrivacyLevel'
      description: 好友列表可见性（好友 = 互相关注）
    following_visible:
      $ref: './common.yaml#/PrivacyLevel'
    followers_visible:
      $ref: './common.yaml#/PrivacyLevel'
    groups_visible:
      $ref: './common.yaml#/PrivacyLevel'
    liked_moments_visible:
      $ref: './common.yaml#/PrivacyLevel'
    stats_visible:
      $ref: './common.yaml#/PrivacyLevel'
    allow_follow:
      type: boolean
    allow_private_chat:
      $ref: '#/PrivateChatPermission'
    searchable:
      type: boolean
    phone_searchable:
      type: boolean
    nickname_searchable:
      type: boolean
    location_searchable:
      type: boolean

# ============================================================
# 关系列表项
# ============================================================

FriendItem:
  type: object
  required: [user, followed_at, followed_back_at]
  description: 好友列表项（好友 = 双方互相关注的用户）
  properties:
    user:
      $ref: './common.yaml#/UserInfo'
    presence_status:
      $ref: './common.yaml#/UserPresenceStatus'
      description: 隐私受控：对方隐私设置时不返回
    last_online:
      type: string
      format: date-time
    remark:
      type: string
      description: 好友备注名
    followed_at:
      type: string
      format: date-time
      description: 我关注对方的时间
    followed_back_at:
      type: string
      format: date-time
      description: 对方回关我的时间（成为好友的时间）

FollowingItem:
  type: object
  required: [user, followed_at, is_mutual]
  description: 关注列表项
  properties:
    user:
      $ref: './common.yaml#/UserInfo'
    followed_at:
      type: string
      format: date-time
    is_mutual:
      type: boolean
      description: 是否互相关注
    presence_status:
      $ref: './common.yaml#/UserPresenceStatus'
      description: 隐私受控：对方隐私设置时不返回
    last_online:
      type: string
      format: date-time

FollowerItem:
  type: object
  required: [user, followed_at, is_following_back]
  description: 粉丝列表项
  properties:
    user:
      $ref: './common.yaml#/UserInfo'
    followed_at:
      type: string
      format: date-time
    is_following_back:
      type: boolean
      description: 是否已回关
    presence_status:
      $ref: './common.yaml#/UserPresenceStatus'
      description: 隐私受控：对方隐私设置时不返回
    last_online:
      type: string
      format: date-time

BlockedUserItem:
  type: object
  required: [user, blocked_at]
  description: 拉黑列表项
  properties:
    user:
      $ref: './common.yaml#/UserInfo'
    blocked_at:
      type: string
      format: date-time
    reason:
      type: string

# ============================================================
# 请求类型
# ============================================================

      description: 拉黑原因
SearchUsersRequest:
  type: object
  required: [search]
  description: |
    至少提供 keyword、tag、radius 中的一个
  properties:
    search:
      $ref: './common.yaml#/SearchBaseParams'
    keyword:
      type: string
      description: 关键字搜索（匹配昵称、bio 等）
    tag:
      type: string
      description: 标签筛选
    radius:
      type: number
      description: 位置范围（米），配合 search.reference_point 使用
    sort_by:
      type: string
      enum: [relevance, distance, newest]
      default: relevance
      description: "默认: relevance"

UserOpenTheDoorRequest:
  type: object
  required: [user_id]
  properties:
    user_id:
      type: string
      description: 要查看的用户 ID
UserFriendsRequest:
  type: object
  required: [user_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    user_id:
      type: string
      description: 目标用户 ID
UserFollowingRequest:
  type: object
  required: [user_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    user_id:
      type: string
      description: 目标用户 ID
UserFollowersRequest:
  type: object
  required: [user_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    user_id:
      type: string
      description: 目标用户 ID
UserGroupsRequest:
  type: object
  required: [user_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    user_id:
      type: string
      description: 目标用户 ID
UserMomentsRequest:
  type: object
  required: [user_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    user_id:
      type: string
      description: 目标用户 ID
UserLikedMomentsRequest:
  type: object
  required: [user_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    user_id:
      type: string
      description: 目标用户 ID
UpdateProfileRequest:
  type: object
  properties:
    nickname:
      type: string
      minLength: 2
      maxLength: 20
      description: 用户昵称（2-20 字符）
    avatar_file_id:
      type: string
      description: 头像文件 ID（来自上传接口）
    bio:
      type: string
      maxLength: 500
      description: 个人简介
    tags:
      type: array
      maxItems: 10
      items:
        type: string
        maxLength: 30
      description: 标签列表
    gender:
      $ref: '#/Gender'
      description: 性别
UpdateLocationRequest:
  type: object
  required: [location]
  properties:
    location:
      $ref: './common.yaml#/Location'

UpgradeAccountRequest:
  type: object
  required: [login_id, password]
  properties:
    login_id:
      type: string
      minLength: 3
      maxLength: 20
      description: 登录账号（3-20 字符）
    password:
      type: string
      minLength: 8
      maxLength: 64
      description: 账号密码（8-64 字符）
UpdateSettingsRequest:
  type: object
  properties:
    settings:
      type: object
      description: Partial<UserSettings>
      properties:
        privacy_level:
          $ref: './common.yaml#/PrivacyLevel'
        location_visible:
          type: boolean
        presence_visible:
          type: boolean
        friends_visible:
          $ref: './common.yaml#/PrivacyLevel'
        following_visible:
          $ref: './common.yaml#/PrivacyLevel'
        followers_visible:
          $ref: './common.yaml#/PrivacyLevel'
        groups_visible:
          $ref: './common.yaml#/PrivacyLevel'
        liked_moments_visible:
          $ref: './common.yaml#/PrivacyLevel'
        stats_visible:
          $ref: './common.yaml#/PrivacyLevel'
        allow_follow:
          type: boolean
        allow_private_chat:
          $ref: '#/PrivateChatPermission'
        searchable:
          type: boolean
        phone_searchable:
          type: boolean
        nickname_searchable:
          type: boolean
        location_searchable:
          type: boolean

DeleteAccountRequest:
  type: object
  required: [confirmation]
  properties:
    confirmation:
      type: string
      description: 必须为 "DELETE_MY_ACCOUNT"

FollowRequest:
  type: object
  required: [user_id]
  properties:
    user_id:
      type: string
      description: 要关注的用户 ID
    source:
      $ref: './common.yaml#/FollowSource'
      description: 可选：关注来源（用于心理学优化，让被关注者知道来源）
    source_moment_id:
      type: string
      description: 可选：如果是通过瞬间关注，提供瞬间 ID

UnfollowRequest:
  type: object
  required: [user_id]
  properties:
    user_id:
      type: string
      description: 要取消关注的用户 ID
BlockRequest:
  type: object
  required: [user_id]
  properties:
    user_id:
      type: string
      description: 要拉黑的用户 ID
    reason:
      type: string
      description: 拉黑原因
UnblockRequest:
  type: object
  required: [user_id]
  properties:
    user_id:
      type: string
      description: 要取消拉黑的用户 ID
MyFriendsRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'

MyFollowingRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'

MyFollowersRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'

MyBlockedRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'

SetRemarkRequest:
  type: object
  required: [user_id]
  properties:
    user_id:
      type: string
      description: 目标用户 ID
    remark:
      type: string
      description: 为空则清除备注

# ============================================================
# 列表响应类型
# ============================================================

PaginatedBlockedUserItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/BlockedUserItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedFollowerItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/FollowerItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedFollowingItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/FollowingItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedFriendItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/FriendItem'
    pagination:
      $ref: './common.yaml#/Pagination'
