# HotSpot API - 群组管理模块类型定义
# 对应原 api_spec_group.mdc 中的类型定义

# ============================================================
# 枚举
# ============================================================

ApplicationStatus:
  type: string
  enum: [pending, accepted, rejected]
  description: 申请状态

SetableGroupRole:
  type: string
  enum: [admin, member]
  description: 可设置的角色（不含 owner）

# ============================================================
# 群组类型
# ============================================================

GroupOpenResult:
  type: object
  required: [group, recent_messages]
  description: 群组详情响应，始终返回最近消息列表
  properties:
    group:
      $ref: './common.yaml#/GroupItem'
    recent_messages:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: './chat.yaml#/GroupMessageItem'
        pagination:
          $ref: './common.yaml#/Pagination'

GroupMemberItem:
  type: object
  required: [user, role, joined_at]
  description: 群组成员列表项
  properties:
    user:
      $ref: './common.yaml#/UserInfo'
    role:
      $ref: './common.yaml#/GroupRole'
      description: 角色
    joined_at:
      type: string
      format: date-time
    muted_until:
      type: string
      format: date-time
      description: '@group-admin-only（或被禁言者自身可见）'
      x-visibility: group-admin-only
    presence_status:
      $ref: './common.yaml#/UserPresenceStatus'
      description: 隐私受控：成员隐私设置时不返回
    last_online:
      type: string
      format: date-time

Invitation:
  type: object
  required: [invite_id, expires_at]
  description: 邀请响应
  properties:
    invite_id:
      type: string
      description: 邀请 ID
    expires_at:
      type: string
      format: date-time

Application:
  type: object
  required: [application_id]
  description: 申请响应
  properties:
    application_id:
      type: string
      description: 申请 ID
BannedMemberItem:
  type: object
  required: [user, banned_at]
  description: 封禁成员列表项
  properties:
    user:
      $ref: './common.yaml#/UserInfo'
    banned_at:
      type: string
      format: date-time
    reason:
      type: string
      description: '@group-admin-only'
      x-visibility: group-admin-only
    banned_by:
      $ref: './common.yaml#/UserInfo'
      description: '@group-admin-only'
      x-visibility: group-admin-only

GroupApplicationItem:
  type: object
  required: [application_id, applicant, status, created_at]
  description: 群组申请列表项
  properties:
    application_id:
      type: string
      description: 申请 ID
    applicant:
      $ref: './common.yaml#/UserInfo'
    message:
      type: string
      description: 申请附言
    status:
      $ref: '#/ApplicationStatus'
    created_at:
      type: string
      format: date-time
    handled_at:
      type: string
      format: date-time
    handled_by:
      $ref: './common.yaml#/UserInfo'
      description: '@group-admin-only'
      x-visibility: group-admin-only

GroupInviteItem:
  type: object
  required: [invite_id, group, inviter, status, created_at]
  description: 群组邀请列表项
  properties:
    invite_id:
      type: string
      description: 邀请 ID
    group:
      $ref: './common.yaml#/GroupInfo'
    inviter:
      $ref: './common.yaml#/UserInfo'
    message:
      type: string
      description: 邀请附言
    status:
      $ref: '#/ApplicationStatus'
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time

JoinGroupResult:
  type: object
  required: [status]
  description: 加入群组响应
  properties:
    status:
      type: string
      enum: [joined, pending_approval]
      description: 加入结果状态
    application:
      $ref: '#/Application'
      description: 仅 pending_approval 时返回

# ============================================================
# 请求类型
# ============================================================

SearchGroupsRequest:
  type: object
  required: [search]
  description: 至少提供 keyword、tag、radius 中的一个
  properties:
    search:
      $ref: './common.yaml#/SearchBaseParams'
    keyword:
      type: string
      description: 关键字搜索（匹配名称、描述等）
    tag:
      type: string
      description: 标签筛选
    radius:
      type: number
      description: 位置范围（米），配合 search.reference_point 使用
    sort_by:
      type: string
      enum: [relevance, distance, newest, popular]
      default: relevance
      description: "默认: relevance"

GroupOpenTheDoorRequest:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 要查看的群组 ID
CreateGroupRequest:
  type: object
  required: [name, location]
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 50
      description: 群组名称（2-50 字符）
    description:
      type: string
      maxLength: 500
      description: 群组描述（最长 500 字符）
    avatar_file_id:
      type: string
      description: 头像文件 ID（来自上传接口）
    tags:
      type: array
      maxItems: 10
      items:
        type: string
        maxLength: 30
      description: 标签列表
    password:
      type: string
      description: 密码
    join_method:
      $ref: './common.yaml#/GroupJoinMethod'
      description: 加入方式
    is_searchable:
      type: boolean
      description: 是否可被搜索发现
    max_members:
      type: integer
      minimum: 2
      maximum: 2000
      description: 最大成员数
    location:
      $ref: './common.yaml#/Location'

UpdateGroupRequest:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    name:
      type: string
      minLength: 2
      maxLength: 50
      description: 群组名称（2-50 字符）
    description:
      type: string
      maxLength: 500
      description: 群组描述（最长 500 字符）
    avatar_file_id:
      type: string
      description: 头像文件 ID（来自上传接口）
    tags:
      type: array
      maxItems: 10
      items:
        type: string
        maxLength: 30
      description: 标签列表
    password:
      type: string
      description: 密码
    join_method:
      $ref: './common.yaml#/GroupJoinMethod'
      description: 加入方式
    is_searchable:
      type: boolean
      description: 是否可被搜索发现
    max_members:
      type: integer
      minimum: 2
      maximum: 2000
      description: 最大成员数
    location:
      $ref: './common.yaml#/Location'

DismissGroupRequest:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 要解散的群组 ID
GroupMembersRequest:
  type: object
  required: [group_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    group_id:
      type: string
      description: 目标群组 ID
    role:
      $ref: './common.yaml#/GroupRole'
      description: 按角色筛选
SearchGroupMembersRequest:
  type: object
  required: [group_id, keyword]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    group_id:
      type: string
      description: 目标群组 ID
    keyword:
      type: string
      description: 按昵称搜索
    role:
      $ref: './common.yaml#/GroupRole'
      description: 可选：按角色过滤

InviteMemberRequest:
  type: object
  required: [group_id, user_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    user_id:
      type: string
      description: 要邀请的用户 ID
    message:
      type: string
      description: 邀请附言
SetMemberRoleRequest:
  type: object
  required: [group_id, user_id, role]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    user_id:
      type: string
      description: 目标成员用户 ID
    role:
      $ref: '#/SetableGroupRole'
      description: 要设置的角色
MuteMemberRequest:
  type: object
  required: [group_id, user_id, duration_minutes]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    user_id:
      type: string
      description: 要禁言的用户 ID
    duration_minutes:
      type: integer
      minimum: 1
      maximum: 43200
      description: 持续时间（分钟），最多 30 天
UnmuteMemberRequest:
  type: object
  required: [group_id, user_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    user_id:
      type: string
      description: 要解除禁言的用户 ID
BanMemberRequest:
  type: object
  required: [group_id, user_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    user_id:
      type: string
      description: 要封禁的用户 ID
    reason:
      type: string
      description: 封禁原因
UnbanMemberRequest:
  type: object
  required: [group_id, user_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    user_id:
      type: string
      description: 要解封的用户 ID
BannedMembersRequest:
  type: object
  required: [group_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    group_id:
      type: string
      description: 目标群组 ID
RemoveMemberRequest:
  type: object
  required: [group_id, user_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    user_id:
      type: string
      description: 要移除的用户 ID
GroupApplicationsRequest:
  type: object
  required: [group_id]
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    group_id:
      type: string
      description: 目标群组 ID
    status:
      oneOf:
      - $ref: '#/ApplicationStatus'
      - type: string
        enum: [all]

      description: 按状态筛选
ApproveGroupApplicationRequest:
  type: object
  required: [application_id]
  properties:
    application_id:
      type: string
      description: 要批准的申请 ID
RejectGroupApplicationRequest:
  type: object
  required: [application_id]
  properties:
    application_id:
      type: string
      description: 要拒绝的申请 ID
    reason:
      type: string
      description: 拒绝原因
CreateGroupAnnouncementRequest:
  type: object
  required: [group_id, title, content]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    title:
      type: string
      minLength: 2
      maxLength: 100
      description: 公告标题（2-100 字符）
    content:
      type: string
      minLength: 2
      maxLength: 5000
      description: 公告内容（2-5000 字符）
    is_pinned:
      type: boolean
      description: 是否置顶
GroupAnnouncementsRequest:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
UpdateGroupAnnouncementRequest:
  type: object
  required: [announcement_id]
  properties:
    announcement_id:
      type: string
      description: 公告 ID
    title:
      type: string
      minLength: 2
      maxLength: 100
      description: 公告标题（2-100 字符）
    content:
      type: string
      minLength: 2
      maxLength: 5000
      description: 公告内容（2-5000 字符）
    is_pinned:
      type: boolean
      description: 是否置顶
DeleteGroupAnnouncementRequest:
  type: object
  required: [announcement_id]
  properties:
    announcement_id:
      type: string
      description: 要删除的公告 ID
UpdateGroupMySettingsRequest:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    is_muted:
      type: boolean
      description: 是否静音
    is_pinned:
      type: boolean
      description: 是否置顶
JoinGroupRequest:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    password:
      type: string
      description: open+password 群组需要
    message:
      type: string
      description: approval 群组可选附言

TransferOwnershipRequest:
  type: object
  required: [group_id, new_owner_id]
  properties:
    group_id:
      type: string
      description: 目标群组 ID
    new_owner_id:
      type: string
      description: 新群主的用户 ID
MyGroupsRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'

MyApplicationsRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    status:
      oneOf:
      - $ref: '#/ApplicationStatus'
      - type: string
        enum: [all]
      default: all

      description: 按状态筛选
CancelApplicationRequest:
  type: object
  required: [application_id]
  properties:
    application_id:
      type: string
      description: 要取消的申请 ID
MyInvitesRequest:
  type: object
  properties:
    pagination:
      $ref: './common.yaml#/PaginationParams'
    status:
      oneOf:
      - $ref: '#/ApplicationStatus'
      - type: string
        enum: [all]

      description: 按状态筛选
AcceptInviteRequest:
  type: object
  required: [invite_id]
  properties:
    invite_id:
      type: string
      description: 要接受的邀请 ID
RejectInviteRequest:
  type: object
  required: [invite_id]
  properties:
    invite_id:
      type: string
      description: 要拒绝的邀请 ID
LeaveGroupRequest:
  type: object
  required: [group_id]
  properties:
    group_id:
      type: string
      description: 要退出的群组 ID

# ============================================================
# 列表响应类型
# ============================================================

PaginatedBannedMemberItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/BannedMemberItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedGroupApplicationItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupApplicationItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedGroupInviteItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupInviteItem'
    pagination:
      $ref: './common.yaml#/Pagination'

PaginatedGroupMemberItems:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupMemberItem'
    pagination:
      $ref: './common.yaml#/Pagination'
