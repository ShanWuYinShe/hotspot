components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        App 端认证。请求头 `Authorization: Bearer <access_token>`。
        Token 从登录 / 注册 / 刷新接口的响应体 `AuthTokenPairApp` 获取。
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Web 端 API 访问令牌（固定 Cookie 名称：`access_token`）。
        配置：`HttpOnly; Secure; SameSite=Strict; Path=/api`。
        所有 `/api/*` 请求浏览器自动携带。
        由服务端 Set-Cookie 设置和清除，前端不可读取。
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Web 端 Token 刷新令牌（固定 Cookie 名称：`refresh_token`）。
        配置：`HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh_token`。
        仅在调用 `/api/v1/auth/refresh_token` 端点时浏览器自动携带。
        由服务端 Set-Cookie 设置和清除，前端不可读取。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Web 端 CSRF 防护令牌。前端从 Cookie `hs_csrf_token` 读取值，
        添加到请求头 `X-CSRF-Token` 中。所有 Web 端 POST 请求必须携带。
        Cookie 由服务端在设置 auth Cookie 时同时设置。
        配置：`Secure; SameSite=Strict`（非 HttpOnly，前端需读取）。
