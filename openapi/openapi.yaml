openapi: 3.1.0

info:
  title: HotSpot API
  version: 1.0.0
  description: |
    HotSpot 社交应用 API 规范 —— 跨端契约（Contract）唯一权威来源。

    ## 核心设计原则

    - **全 POST 设计**：所有 HTTP API 仅使用 POST 方法
    - **统一响应信封**：所有响应使用 `ApiResponse<T>` 包装（code=0 成功，非 0 业务错误）
    - **HTTP 200 = 到达业务层**：HTTP 非 200 视为请求失败（网络/网关），不解析业务响应
    - **游标分页**：所有列表接口使用 cursor 分页（cursor 为不透明字符串，客户端只透传）
    - **ID 字段**：所有 ID 为 `string` 类型（不透明），命名必须使用 `xxx_id`
    - **URL 字段**：所有 `*_url` 字段为完整绝对 URL
    - **时间格式**：所有时间字段使用 UTC ISO 8601

    ## 认证机制

    按 `client_type` 区分投递方式：

    **Web 端**（Cookie 认证）：
    - 使用两个固定名称的 HttpOnly Cookie，**禁止** Authorization Header
    - `access_token` Cookie（`Path=/api`）：所有 API 请求自动携带
    - `refresh_token` Cookie（`Path=/api/v1/auth/refresh_token`）：仅刷新端点自动携带
    - 属性：`HttpOnly; Secure; SameSite=Strict`，`Max-Age` 由服务端动态设置
    - Cookie 由服务端 `Set-Cookie` 设置和清除，前端不可读取也不应手动操作

    **App 端**（Header 认证）：
    - `Authorization: Bearer <access_token>`
    - Token 从响应体 `AuthTokenPairApp` 获取并存储在 Keychain / Keystore

    ## 通用隐含错误码（各端点不再列出）

    - `10100` 认证失败（Token 无效/过期）
    - `10201` 账号被封禁（强制登出）
    - `10500` 请求过于频繁（按 Retry-After 退避）
    - `10600` 服务器内部错误

    ## 通用请求/响应头

    | Header | 方向 | 说明 |
    |--------|------|------|
    | `X-Request-Id` | 请求（可选）/ 响应（必须） | 请求链路追踪 ID。客户端可选传入；服务端必须在响应头返回（未携带时由服务端生成）。格式为 UUID v4 |
    | `Idempotency-Key` | 请求 | 仅用于 `x-idempotency: required` 的端点。格式：`{client_id}-{timestamp_ms}-{random}`，32-64 字符，字符集 `[a-zA-Z0-9-_]`。重试必须复用同一 Key，新请求必须生成新 Key |
    | `Retry-After` | 响应 | 仅在触发限流（错误码 `10500`）时返回，单位秒。客户端应按此值退避重试 |

    ### 禁止返回的响应头

    服务端禁止返回可能泄露技术栈或部署架构的响应头：`Server`、`X-Powered-By`、`X-AspNet-Version`、`X-Runtime` 等。在反向代理层和应用层均须移除或覆盖。

    安全说明：不暴露 `X-RateLimit-Limit` / `X-RateLimit-Remaining` / `X-RateLimit-Reset` 等精确限流状态，避免攻击者优化请求频率以规避限流。

    ## 分页约定

    - 所有列表接口使用**游标分页**（cursor-based），`cursor` 为不透明字符串，客户端只透传
    - 全局默认值：`limit` default=20, max=100
    - 各模块可覆盖 `limit` 的 default/max，会在接口文档中显式标注
    - 有界数据（搜索建议、热门标签等）由服务端决定返回数量，通过 `ServerConfig.response_defaults` 配置

    ## 自定义扩展

    - `x-idempotency`：`required`（必须 Idempotency-Key）| `semantic`（幂等语义）| `none`
    - `x-error-codes`：端点特有的业务错误码列表
    - `x-visibility`：字段可见性标注（`auth-only` | `owner-only` | `group-admin-only` | `member-only` | `participant-only`）

    ## 详细设计文档

    Token 语义、隐私控制、限流策略、WebSocket 事件等详细设计，参见 spec/ 下对应文档。

