# ── crates.io 国内镜像（rsproxy.cn）──────────────────────────────────
# crates.io 的索引与包 CDN（static.crates.io）在国内网络不可靠，
# 统一走 rsproxy.cn sparse 索引（与宿主全局配置一致），避免 cargo 拉依赖超时。
# 参考: https://rsproxy.cn/
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.crates-io]
protocol = "sparse"

[net]
git-fetch-with-cli = true
