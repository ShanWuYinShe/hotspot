[workspace]
members = []
resolver = "2"

[package]
name = "hotspot-backend"
version = "0.0.1"
edition = "2021"

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "ipnetwork"] }

# Redis
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 认证
jsonwebtoken = { version = "10.2", features = ["rust_crypto"] }
bcrypt = "0.17"
sha2 = "0.10"
hex = "0.4"

# 异步流操作（WebSocket、Redis PubSub 等需要）
futures-util = "0.3"

# 工具
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 环境变量
dotenvy = "0.15"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json"] }

# S3
aws-config = "1.1"
aws-sdk-s3 = "1.17"
aws-credential-types = "1.1"

# 其他
once_cell = "1.21"
base64 = "0.22.1"
http = "1.2"
aes-gcm = "0.10.3"
rand = "0.9.2"
